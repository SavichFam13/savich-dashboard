<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M18 40 L18 14 L40 28 Q50 22 60 28 L82 14 L82 40 Q82 86 50 86 Q18 86 18 40 Z' fill='%2314111a' stroke='%23c9a0ff' stroke-width='5' stroke-linejoin='round'/%3E%3Cellipse cx='36' cy='54' rx='5' ry='8' fill='%235fd3c4'/%3E%3Cellipse cx='64' cy='54' rx='5' ry='8' fill='%235fd3c4'/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Today — Savich Tasks</title>
<style>
.tb-btn {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--dim);
  font-family: inherit;
  font-size: 0.78rem;
  font-weight: 700;
  padding: 6px 12px;
  cursor: pointer;
}
.tb-btn:hover { border-color: var(--accent); color: var(--text); }
</style>
<link rel="stylesheet" href="tasks.css">
</head>
<body>
<nav class="nav-bar">
    <span class="sync-note" id="sync-note">syncing…</span>
    <button class="tb-btn" id="backup-imp" title="restore from a backup file">Import</button>
    <button class="tb-btn" id="backup-exp" title="download a backup file of ALL lists, tasks, and history">Export</button>
    <div id="nav"></div>
</nav>
<h1>Today</h1>
<div class="date-nav">
  <button id="prev-day">←</button>
  <span class="date-line" id="date-line"></span>
  <button id="next-day">→</button>
  <span class="spacer"></span>
  <button id="jump-today">Back to Today</button>
  <button onclick="location.href='household.html'" title="go to the Household lists">Household</button>
  <button onclick="location.href='personal.html'" title="go to your Personal lists">Personal</button>
</div>
<div class="progress-outer"><div class="progress-inner" id="prog"></div></div>
<div class="progress-label" id="prog-label"></div>
<div class="add-bar">
  <button class="add-btn" id="add-btn">+ add task</button>
</div>
<div class="hint">left-click checkbox = done / undone · right-click row = won't do / move / edit · click title = details</div>
<div id="task-area"></div>
<div class="panel" id="editor-panel">
  <button class="panel-x" id="ed-close">✕</button>
  <h2 id="ed-heading">New Task</h2>
  <label for="ed-title">Title</label>
  <input id="ed-title" type="text" placeholder="Clean off stove top">
  <label for="ed-list">List</label>
  <select id="ed-list"></select>
  <label for="ed-section">Section (blank = none)</label>
  <input id="ed-section" list="ed-section-list" placeholder="e.g. To Buy, Deliveries">
  <datalist id="ed-section-list"></datalist>
  <label for="ed-date">Starts on (blank = parked in list only)</label>
    <input id="ed-date" type="date">
  <button type="button" id="ed-date-cal" class="dc-open" title="pick from calendar">📅</button>
  <label for="ed-time">Time of day (blank = anytime)</label>
  <input id="ed-time" type="time">
  <label for="ed-repeat">Repeat</label>
  <select id="ed-repeat">
    <option value="none">One time</option>
    <option value="daily">Every day</option>
    <option value="weekdays">Weekdays (Mon–Fri)</option>
    <option value="weekly">Weekly</option>
    <option value="biweekly">Every N weeks</option>
    <option value="monthly">Monthly</option>
    <option value="yearly">Yearly</option>
    <option value="nthmonth">Every N months on the Nth day (12 = yearly)</option>
    <option value="afterdone">Every N days after completion</option>
  </select>
  <div class="dow-row" id="ed-dow-row" style="display:none"></div>
  <div id="ed-ends-row" style="display:none">
    <label for="ed-count">Ends — after … times (blank = forever)</label>
    <input id="ed-count" type="number" min="1" max="999">
    <label for="ed-until">… or on date (blank = no end date)</label>
    <input id="ed-until" type="date">
  </div>
  <div id="ed-mday-row" style="display:none">
    <label for="ed-mday">Day of month</label>
    <input id="ed-mday" type="number" min="1" max="31" readonly
           style="cursor:pointer" title="click to pick the day">
  </div>
  <div id="ed-every-row" style="display:none">
    <label for="ed-every" id="ed-every-label">Every …</label>
    <input id="ed-every" type="number" min="1" max="120">
  </div>
  <div id="ed-nth-row" style="display:none">
    <label for="ed-nth">On the …</label>
    <select id="ed-nth">
      <option value="1">First</option>
      <option value="2">Second</option>
      <option value="3">Third</option>
      <option value="4">Fourth</option>
      <option value="5">Last</option>
    </select>
  </div>
  <label class="ed-note-flag"><input type="checkbox" id="ed-note">
    note — never scheduled, never overdue</label>
  <label for="ed-notes">Notes</label>
  <textarea id="ed-notes" placeholder="optional details"></textarea>
  <button class="btn" id="ed-save">SAVE</button>
  <button class="btn btn-del" id="ed-delete" style="display:none">DELETE ENTIRE SERIES</button>
  <div class="panel-note">Editing affects the whole series. To change just one day's copy, right-click it on the main list instead.</div>
</div>
<div class="flash-msg" id="flash-msg"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../db.js"></script>
<script src="tasks.js"></script>
<script src="../nav.js"></script>
<script>
  window.VIEW_DATE = todayStr();
  function rerender() {
    const view = window.VIEW_DATE;
    const today = todayStr();
    document.getElementById("date-line").textContent = fmtDateLong(view) +
      (view === today ? "" : "  (viewing another day)");
    renderDay({
      filterFn: list => !!list,  
      rerender: rerender
    });
    const todays = buildDayModel(tasksCache, listsCache, occCache, today, today);
    const doneCount = todays.filter(it =>
      it.occ && it.occ.status === "done").length; 
    const total = todays.length;
    let scheduled = 0, completed = 0;
    const seen = new Set();
    for (const o of occCache) {
      if (o.status === "done" && o.orig_date === today) {
        completed++;
        if (!seen.has(o.task_id)) { seen.add(o.task_id); scheduled++; }
      }
    }
    for (const it of todays) {
      if (!seen.has(it.task.id)) { seen.add(it.task.id); scheduled++; }
    }
    const pct = scheduled ? Math.round(completed / scheduled * 100) : 0;
    const prog = document.getElementById("prog");
    prog.style.width = pct + "%";
    prog.classList.toggle("full", scheduled > 0 && completed >= scheduled);
    document.getElementById("prog-label").textContent =
      scheduled ? completed + " of " + scheduled + " done (" + pct + "%)" : "";
  }
  window.__rerender = rerender;
  document.getElementById("prev-day").onclick = () => {
    window.VIEW_DATE = addDaysStr(window.VIEW_DATE, -1); rerender();
  };
  document.getElementById("next-day").onclick = () => {
    window.VIEW_DATE = addDaysStr(window.VIEW_DATE, 1); rerender();
  };
  document.getElementById("jump-today").onclick = () => {
    window.VIEW_DATE = todayStr(); rerender();
  };
    document.getElementById("backup-exp").onclick = async function () {
    try {
      var d = new Date().toISOString().slice(0, 10);
      var data = {
        exported_on: d,
        lists: listsCache,
        tasks: tasksCache,
        occurrences: occCache
      };
      var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "tasks-backup-" + d + ".json";
      a.click();
      URL.revokeObjectURL(a.href);
      flash("backup exported — keep it somewhere safe");
    } catch (e) {
      flash("export failed: " + e.message);
    }
  };
  document.getElementById("backup-imp").onclick = function () {
    var inp = document.createElement("input");
    inp.type = "file";
    inp.accept = ".json";
    inp.onchange = function () {
      var f = inp.files[0];
      if (!f) return;
      var rd = new FileReader();
      rd.onload = async function () {
        try {
          var parsed = JSON.parse(rd.result);
          if (!Array.isArray(parsed.lists) || !Array.isArray(parsed.tasks))
            throw new Error("not a task backup file");
          if (!(await confirmBox("Import task backup?",
            "Restores " + parsed.lists.length + " lists and " + parsed.tasks.length +
            " tasks from \"" + f.name + "\". Existing matching rows get overwritten. Continue?"))) return;
          var sbc = sb();
          await sbc.from("task_lists").upsert(parsed.lists, { onConflict: "id" });
          await sbc.from("tasks").upsert(parsed.tasks, { onConflict: "id" });
          if (Array.isArray(parsed.occurrences))
            await sbc.from("task_occurrences").upsert(parsed.occurrences, { onConflict: "id" });
          await loadAll();
          rerender();
          flash("backup imported");
        } catch (e) {
          flash("import failed: " + (e.message || e));
        }
      };
      rd.readAsText(f);
    };
    inp.click();
  };
  document.getElementById("add-btn").onclick = () => openEditor(null);
  initTaskPage({
    pageTitle: "Today",
    filterFn: list => !!list,
    rerender: rerender
  });
  new MutationObserver(fillListSelect).observe(
    document.getElementById("editor-panel"), { attributes: true, attributeFilter: ["class"] });
  function fillListSelect() {
    const sel = document.getElementById("ed-list");
    if (sel.options.length) return;
    for (const l of listsCache) {
      const opt = document.createElement("option");
      opt.value = l.id;
      opt.textContent = l.name + (l.scope === "personal" ? " (mine)" : "");
      sel.appendChild(opt);
    }
  }
</script>
</body>
</html>
