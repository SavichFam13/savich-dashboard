<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M18 40 L18 14 L40 28 Q50 22 60 28 L82 14 L82 40 Q82 86 50 86 Q18 86 18 40 Z' fill='%2314111a' stroke='%23c9a0ff' stroke-width='5' stroke-linejoin='round'/%3E%3Cellipse cx='36' cy='54' rx='5' ry='8' fill='%235fd3c4'/%3E%3Cellipse cx='64' cy='54' rx='5' ry='8' fill='%235fd3c4'/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Savich Dashboard</title>
<style>
  :root {
    --bg: #121016;
    --panel: #1c1922;
    --text: #f2eef7;
    --accent: #c9a0ff;
    --accent2: #5fd3c4;
    --dim: #a89bbd;
    --border: #332c3e;
    --good: #7ddba3;
    --bad: #ff8a8a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: Verdana, Geneva, Tahoma, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    background-image:
      radial-gradient(ellipse 600px 300px at 15% 10%, rgba(139,47,201,.18), transparent 70%),
      radial-gradient(ellipse 500px 260px at 85% 20%, rgba(95,211,196,.12), transparent 70%);
  }
  .box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 34px 30px;
    width: 100%; max-width: 380px;
    box-shadow: 0 12px 40px rgba(0,0,0,.5);
  }
  h1 {
    font-size: 1.3rem; color: var(--accent);
    letter-spacing: .5px; margin-bottom: 4px;
  }
  .cat-logo {
    width: 92px; height: 92px;
    display: block;
    margin: 0 auto 14px auto;
  }
  p.sub { color: var(--dim); font-size: .8rem; margin-bottom: 24px; }
  label {
    display: block; font-size: .68rem; color: var(--dim);
    text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px;
  }
  input {
    width: 100%;
    background: #16131d; color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 11px 13px; font-family: inherit; font-size: .92rem;
    margin-bottom: 16px; outline: none;
  }
  input:focus { border-color: var(--accent2); }
  button.primary {
    width: 100%;
    background: var(--accent2); color: #121016; border: none;
    padding: 12px; border-radius: 6px; font-family: inherit;
    font-size: .9rem; font-weight: 700; cursor: pointer;
    letter-spacing: 1px;
  }
  button.primary:hover { filter: brightness(1.1); }
  button.primary:disabled { opacity: .5; cursor: wait; }
  .err {
    display: none;
    background: #2a1620; border: 1px solid var(--bad); color: var(--bad);
    border-radius: 6px; padding: 10px 14px; font-size: .8rem;
    margin-bottom: 16px;
  }
  .err.show { display: block; }
  .hint { color: var(--dim); font-size: .72rem; margin-top: 22px; text-align: center; }
</style>
</head>
<body>

<div class="box">
  <svg class="cat-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- ears -->
  <path d="M20 38 L18 12 L42 26 Z" fill="#14111a" stroke="#c9a0ff" stroke-width="4" stroke-linejoin="round"/>
  <path d="M80 38 L82 12 L58 26 Z" fill="#14111a" stroke="#c9a0ff" stroke-width="4" stroke-linejoin="round"/>
  <!-- head -->
  <path d="M20 40 Q20 84 50 84 Q80 84 80 40 Q80 28 50 28 Q20 28 20 40 Z"
        fill="#14111a" stroke="#c9a0ff" stroke-width="4"/>
  <!-- eyes (vertical slits) -->
  <ellipse cx="36" cy="52" rx="4" ry="9" fill="#5fd3c4"/>
  <ellipse cx="64" cy="52" rx="4" ry="9" fill="#5fd3c4"/>
  <!-- nose + smile -->
  <path d="M46 64 L54 64 L50 69 Z" fill="#c9a0ff"/>
  <path d="M50 69 Q44 75 39 71 M50 69 Q56 75 61 71"
        stroke="#c9a0ff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- whiskers -->
  <path d="M30 62 L16 58 M30 68 L16 72 M70 62 L84 58 M70 68 L84 72"
        stroke="#a89bbd" stroke-width="2" stroke-linecap="round"/>
</svg>
  <h1>Savich Dashboard</h1>
  <p class="sub">Sign-in — your data lives in the cloud now.</p>
  <div class="err" id="err"></div>
  <form id="login-form">
    <label for="email">Email</label>
    <input type="email" id="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" required>
    <button type="submit" class="primary" id="btn">SIGN IN</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL  = "https://abcdefghij.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_BrHe5dx8nd4Cs40QPEq7zg_mZwOGgqc";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

(async () => {
  const { data } = await sb.auth.getSession();
  if (data.session) redirect();
})();

function redirect() {
  const params = new URLSearchParams(location.search);
  const next = params.get("next");
  if (next && /^https?:\/\/.+/.test(next)) {
    location.href = next;
  } else {
    location.href = "index.html";
  }
}

document.getElementById("login-form").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("btn");
  const err = document.getElementById("err");
  err.classList.remove("show");
  btn.disabled = true;
  btn.textContent = "SIGNING IN…";

  const { error } = await sb.auth.signInWithPassword({
    email: document.getElementById("email").value.trim(),
    password: document.getElementById("password").value
  });

  if (error) {
    err.textContent = error.message;
    err.classList.add("show");
    btn.disabled = false;
    btn.textContent = "SIGN IN";
    return;
  }
  redirect();
});
</script>
</body>
</html>
