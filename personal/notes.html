<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M18 40 L18 14 L40 28 Q50 22 60 28 L82 14 L82 40 Q82 86 50 86 Q18 86 18 40 Z' fill='%2314111a' stroke='%23c9a0ff' stroke-width='5' stroke-linejoin='round'/%3E%3Cellipse cx='36' cy='54' rx='5' ry='8' fill='%235fd3c4'/%3E%3Cellipse cx='64' cy='54' rx='5' ry='8' fill='%235fd3c4'/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sticky Notes</title>
<style>
  :root {
    --bg: #121016;
    --panel: #1c1922;
    --text: #f2eef7;
    --accent: #c9a0ff;
    --accent2: #5fd3c4;
    --hot-pink: #e10ab2;
    --dim: #a89bbd;
    --border: #332c3e;
    --good: #7ddba3;
    --bad: #ff8a8a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: Verdana, Geneva, Tahoma, sans-serif;
    font-size: 13px;
    line-height: 1.55;
    padding: 32px 20px;
    max-width: 1340px;
    margin: 0 auto;
  }
  .top {
    display: flex; justify-content: flex-end; align-items: center;
    flex-wrap: wrap; gap: 12px; margin-bottom: 6px;
  }
  h1.wall-title {
    display: flex; align-items: flex-end; gap: 14px;
    justify-content: center;
    font-size: 2rem; letter-spacing: 0.5px;
    margin: -34px auto 10px auto;
  }
  .wt { display: inline-block; font-weight: 400; }
  .w1 { color: #e8c27a; transform: rotate(-7deg); }
  .w2 {
    color: #ff5ec4; transform: rotate(4deg);
    font-size: 1.55rem; margin-bottom: 6px;
  }
  .w3 { color: #5fd3c4; transform: rotate(-3deg); }
  .w4 { color: #c9a0ff; transform: rotate(6deg); margin-bottom: 3px; }
  .top-right {
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap; justify-content: flex-end;
  }
  .nav-bar {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end;
  }
  .nav-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--dim);
    text-decoration: none;
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 600;
    transition: all 0.2s ease;
    cursor: pointer;
    font-family: inherit;
  }
  .nav-btn:hover { border-color: var(--accent2); color: var(--accent2); }
  p.sub { color: var(--dim); font-size: 0.82rem; margin-bottom: 24px; }
  .sync-note { font-size: 0.72rem; color: var(--dim); letter-spacing: 0.5px; }
  .sync-note.live { color: var(--good); }

  .toolbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 18px; flex-wrap: wrap; gap: 10px;
  }
  .toolbar-left { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .btn {
    background: var(--panel); border: 1px solid var(--border);
    color: var(--text); padding: 7px 14px; border-radius: 5px;
    font-family: inherit; font-size: 0.78rem; cursor: pointer;
  }
  .btn:hover { border-color: var(--accent2); }
  .btn-primary { background: var(--accent2); color: #121016; font-weight: 700; }
  .btn-primary:hover { filter: brightness(1.1); }
  #note-count { font-size: 0.79rem; color: var(--dim); }
  #search-box {
    background: #16131d; color: var(--text); border: 1px solid var(--border);
    border-radius: 5px; padding: 8px 12px; font-family: inherit;
    font-size: 0.82rem; width: 240px;
  }
  #search-box:focus { outline: none; border-color: var(--accent2); }
  .board {
    position: relative;
    min-height: 72vh;
    border: 1px dashed var(--border);
    border-radius: 12px;
    background:
      radial-gradient(circle at 12% 20%, rgba(201,160,255,0.03), transparent 40%),
      radial-gradient(circle at 85% 75%, rgba(95,211,196,0.03), transparent 40%);
  }
  .board-hint {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: var(--dim); font-size: 0.85rem; text-align: center;
    pointer-events: none; line-height: 2;
  }
  .note {
    --nb: #2b2240;
    --nbord: #c9a0ff;
    position: absolute;
    width: 245px;
    background: var(--nb);
    border: 1px solid var(--nbord);
    border-radius: 4px 4px 16px 4px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.45);
    transform: rotate(var(--rot, -2deg));
    transition: box-shadow 0.15s ease;
    cursor: pointer;
  }
  .note.dragging {
    box-shadow: 0 16px 34px rgba(0,0,0,0.6);
    transition: none;
    z-index: 9999 !important;
  }
  .note.dimmed { opacity: 0.18; }
  .note.c0 { --nb: #2b2240; --nbord: #c9a0ff; }
  .note.c1 { --nb: #163a35; --nbord: #5fd3c4; }
  .note.c2 { --nb: #3a1733; --nbord: #e10ab2; }
  .note.c3 { --nb: #3a2222; --nbord: #ff8a8a; }
  .note.c4 { --nb: #211d2b; --nbord: #a89bbd; }
  .note.c5 { --nb: #352c1e; --nbord: #e8c27a; }
  .note.c6 { --nb: #1c3328; --nbord: #7ddba3; }
  .note.c7 { --nb: #22304a; --nbord: #8ab4ff; }
  .note::before {
    content: "";
    position: absolute; top: -9px; left: 50%;
    width: 64px; height: 18px;
    transform: translateX(-50%) rotate(-3deg);
    background: rgba(242,238,247,0.13);
    border: 1px solid rgba(242,238,247,0.06);
    border-radius: 2px;
    pointer-events: none;
  }
  .note-grab {
    height: 30px;
    cursor: grab;
    display: flex; align-items: center; gap: 7px;
    padding: 0 40px 0 10px;
    border-bottom: 1px solid rgba(242,238,247,0.07);
    touch-action: none;
  }
  .note-grab:active { cursor: grabbing; }
  .grab-handle { color: var(--nbord); font-size: 0.75rem; opacity: 0.5; }
  .note-del {
    position: absolute; top: 5px; right: 6px;
    background: none; border: 1px solid transparent; color: var(--dim);
    border-radius: 4px; cursor: pointer; padding: 2px 6px;
    font-size: 0.72rem; font-family: inherit;
    line-height: 1;
    z-index: 5;
  }
  .note-del:hover { border-color: var(--bad); color: var(--bad); }
  .note-body {
    color: var(--text); font-family: inherit; font-size: 0.82rem;
    line-height: 1.55; padding: 10px 12px 14px;
    min-height: 130px; outline: none;
    white-space: pre-wrap; word-wrap: break-word;
    cursor: pointer;
  }
  .note-body:empty::before {
    content: "click to type\2026";
    color: var(--dim); opacity: 0.6;
  }
  .note-meta {
    font-size: 0.62rem; color: var(--dim); opacity: 0.65;
    padding: 0 12px 8px; text-align: right;
  }
  .hl.c1 { background: #ffd93d; color: #121016; border-radius: 2px; }
  .hl.c2 { background: #3ddb84; color: #0d1a12; border-radius: 2px; }
  .hl.c3 { background: #ff5ec4; color: #1a0d16; border-radius: 2px; }
  .hl.c4 { background: #38b6ff; color: #0d1420; border-radius: 2px; }
  .expand-overlay {
    position: fixed; inset: 0; background: rgba(10, 8, 14, 0.75);
    display: none; align-items: center; justify-content: center;
    z-index: 4000; padding: 20px;
  }
  .expand-overlay.open { display: flex; }
  .expand-box {
    --nbord: #c9a0ff;
    background: var(--panel);
    border: 1px solid var(--nbord);
    border-radius: 6px;
    width: 480px; max-width: 94vw;
    box-shadow: 0 16px 48px rgba(0,0,0,0.55);
    transform: rotate(-1deg);
  }
  .expand-box.c0 { --nbord: #c9a0ff; }
  .expand-box.c1 { --nbord: #5fd3c4; }
  .expand-box.c2 { --nbord: #e10ab2; }
  .expand-box.c3 { --nbord: #ff8a8a; }
  .expand-box.c4 { --nbord: #a89bbd; }
  .expand-box.c5 { --nbord: #e8c27a; }
  .expand-box.c6 { --nbord: #7ddba3; }
  .expand-box.c7 { --nbord: #8ab4ff; }
  .expand-head {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid rgba(242,238,247,0.08);
  }
  .expand-title {
    font-size: 0.78rem; font-weight: 700;
    color: var(--nbord); letter-spacing: 1px;
  }
  .expand-age {
    font-size: 0.66rem; color: var(--dim);
    margin-left: auto;
  }
  .expand-close {
    background: none; border: 1px solid transparent;
    color: var(--dim); border-radius: 4px; cursor: pointer;
    font-size: 0.95rem; padding: 2px 8px; line-height: 1;
    font-family: inherit;
  }
  .expand-close:hover { border-color: var(--bad); color: var(--bad); }
  .pen-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 16px 2px;
  }
  .pen-title { font-size: 0.62rem; color: var(--dim); letter-spacing: 0.5px; }
  .pen-dot {
    width: 18px; height: 18px; border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.5);
    cursor: pointer; padding: 0;
    transition: transform 0.1s ease;
  }
  .pen-dot:hover { transform: scale(1.2); }
  .pen-dot.k1 { background: #ffd93d; }
  .pen-dot.k2 { background: #3ddb84; }
  .pen-dot.k3 { background: #ff5ec4; }
  .pen-dot.k4 { background: #38b6ff; }
  .pen-x {
    background: none; border: 1px solid var(--border); color: var(--dim);
    border-radius: 4px; cursor: pointer; padding: 1px 7px;
    font-size: 0.7rem; font-family: inherit; line-height: 1.4;
  }
  .pen-x:hover { border-color: var(--bad); color: var(--bad); }
  #expand-ta {
    color: var(--text); font-family: inherit; font-size: 0.95rem;
    line-height: 1.6; padding: 12px 16px 16px;
    min-height: 230px; outline: none;
    white-space: pre-wrap; word-wrap: break-word;
    overflow: hidden;
  }
  #expand-ta:empty::before {
    content: "type here\2026";
    color: var(--dim); opacity: 0.6;
  }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(10, 8, 14, 0.75);
    display: none; align-items: center; justify-content: center;
    z-index: 5000; padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 26px 28px 22px;
    max-width: 410px; width: 100%;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  }
  .modal-box h2 { font-size: 0.96rem; color: var(--hot-pink); margin-bottom: 12px; line-height: 1.4; }
  .modal-box p { font-size: 0.81rem; color: var(--dim); line-height: 1.6; margin-bottom: 22px; white-space: pre-line; }
  .modal-buttons { display: flex; gap: 10px; justify-content: flex-end; }
  .modal-buttons button {
    font-family: inherit; font-size: 0.81rem; font-weight: 700;
    border-radius: 5px; padding: 8px 22px; cursor: pointer; letter-spacing: 1px;
  }
  .modal-yes { background: var(--bad); color: #121016; border: none; }
  .modal-yes:hover { filter: brightness(1.1); }
  .modal-no { background: none; color: var(--dim); border: 1px solid var(--border); font-weight: 400; }
  .modal-no:hover { border-color: var(--accent); color: var(--text); }

  .toast {
    position: fixed; bottom: 26px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--panel); border: 1px solid var(--accent2);
    color: var(--good); border-radius: 8px; padding: 12px 22px;
    font-size: 0.81rem; opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 6000; max-width: 90vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (max-width: 640px) {
    .note { width: 210px; }
    #search-box { width: 100%; }
  }
</style>
</head>
<body>

<div class="top">
<nav class="nav-bar">
    <span class="sync-note" id="sync-note">syncing…</span>
    <div id="nav"></div>
</nav>
</div>
<p class="sub">Wall O' stickies. </p>
<h1 class="wall-title">
  <span class="wt w1">Wall</span>
  <span class="wt w2">O'</span>
  <span class="wt w3">Sticky</span>
  <span class="wt w4">Notes</span>
</h1>
<div class="toolbar">
  <div class="toolbar-left">
    <button class="btn btn-primary" onclick="createNote()">&#43; NEW NOTE</button>
    <span id="note-count">0 notes</span>
  </div>
  <input type="search" id="search-box" placeholder="Search your notes&hellip;">
</div>
<div class="board" id="board">
  <div class="board-hint" id="board-hint">
    A blank wall.<br>Hit <strong style="color:var(--accent2)">+ NEW NOTE</strong> and start sticking things you want to remember.
  </div>
</div>
<div class="expand-overlay" id="expand-overlay">
  <div class="expand-box" id="expand-box">
    <div class="expand-head">
      <span class="expand-title">STICKY NOTE</span>
      <span class="expand-age" id="expand-age"></span>
      <button class="expand-close" id="expand-close" title="close">&#10005;</button>
    </div>
    <div class="pen-bar">
      <span class="pen-title">HIGHLIGHTER:</span>
      <button class="pen-dot k1" data-c="c1" title="yellow"></button>
      <button class="pen-dot k2" data-c="c2" title="bright green"></button>
      <button class="pen-dot k3" data-c="c3" title="bright pink"></button>
      <button class="pen-dot k4" data-c="c4" title="bright blue"></button>
      <button class="pen-x" id="pen-clear" title="erase highlight from selected text">&#9003;</button>
    </div>
    <div id="expand-ta" contenteditable="true" spellcheck="false"></div>
  </div>
</div>
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box">
    <h2 id="modal-title"></h2>
    <p id="modal-message"></p>
    <div class="modal-buttons">
      <button class="modal-no" id="modal-no">NO</button>
      <button class="modal-yes" id="modal-yes">YES</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../db.js"></script>
<script src="../nav.js"></script>
<script>
let notes = [];
let uid = null;
let zTop = 10;
let draggingId = null;
let popupOpenId = null;
const textTimers = {};
const PALETTE_COUNT = 8;
const expandOverlay = document.getElementById("expand-overlay");
const expandBox = document.getElementById("expand-box");
const expandTa = document.getElementById("expand-ta");

function esc(str) {
  return String(str == null ? "" : str)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function markedToHtml(txt) {
  let s = esc(txt);
  s = s.replace(/\[\[(c[1-4]):([\s\S]*?)\]\]/g,
    (m, c, inner) => '<span class="hl ' + c + '">' + inner + "</span>");
  return s;
}
function htmlToMarked(el) {
  let h = el.innerHTML;
  h = h.replace(/<br\s*\/?>/gi, "\n");
  h = h.replace(/<span class="hl (c[1-4])">([\s\S]*?)<\/span>/gi,
    (m, c, inner) => "[[" + c + ":" + inner + "]]");
  h = h.replace(/<\/(div|p)>/gi, "\n");
  h = h.replace(/<[^>]+>/g, "");
  const d = document.createElement("textarea");
  d.innerHTML = h;
  let out = d.value;
  return out.replace(/^\n+/, "").replace(/\n{3,}/g, "\n\n");
}
function stripMarked(t) {
  return String(t == null ? "" : t)
    .replace(/\[\[c[1-4]:/g, "").replace(/\]\]/g, "");
}
function applyHighlight(cls) {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed) {
    showToast("Select some text first, then tap a color.");
    return;
  }
  const range = sel.getRangeAt(0);
  if (!expandTa.contains(range.commonAncestorContainer.nodeType === 1
        ? range.commonAncestorContainer : range.commonAncestorContainer.parentNode)) {
    showToast("Select text inside the note.");
    return;
  }
  const parent = sel.anchorNode && sel.anchorNode.parentElement
    ? sel.anchorNode.parentElement.closest("span.hl")
    : null;
  if (parent) {
    showToast("Already highlighted \u2014 erase it first (\u232b).");
    return;
  }
  const span = document.createElement("span");
  span.className = "hl " + cls;
  try {
    range.surroundContents(span);
  } catch (e) {
    span.appendChild(range.extractContents());
    range.insertNode(span);
  }
  sel.removeAllRanges();
  onExpandInput();
}
function clearHighlights() {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed) {
    showToast("Select the highlighted text first.");
    return;
  }
  const range = sel.getRangeAt(0);
  const hits = Array.from(expandTa.querySelectorAll("span.hl"))
    .filter(sp => {
      const r = document.createRange();
      r.selectNodeContents(sp);
      return range.intersectsRange(r);
    });
  if (!hits.length) {
    showToast("No highlight in that selection.");
    return;
  }
  hits.forEach(sp => sp.replaceWith(document.createTextNode(sp.textContent)));
  onExpandInput();
}
document.querySelectorAll(".pen-dot").forEach(btn => {
  btn.addEventListener("click", () => applyHighlight(btn.dataset.c));
});
document.getElementById("pen-clear").addEventListener("click", clearHighlights);
async function ensureAuth() {
  if (typeof requireAuth === "function") return await requireAuth();
  const { data } = await sb().auth.getSession();
  if (!data || !data.session) {
    location.href = "../auth.html?next=" + encodeURIComponent(location.pathname);
    throw new Error("not signed in");
  }
}
function setSync(ok, msg) {
  const el = document.getElementById("sync-note");
  el.textContent = ok ? (msg || "\u2713") : "offline \u2014 changes NOT saved";
  el.classList.toggle("live", !!ok);
}
async function loadNotes() {
  const { data, error } = await sb()
    .from("sticky_notes").select("*")
    .eq("user_id", uid)
    .order("id", { ascending: true });
  if (error) throw error;
  notes = data || [];
}
function stampNow() { return new Date().toISOString(); }
async function savePatch(note, patch) {
  note.updated_at = stampNow();
  try {
    const { error } = await sb().from("sticky_notes")
      .update(patch).eq("id", note.id);
    if (error) throw error;
    setSync(true);
    if (popupOpenId === note.id)
      document.getElementById("expand-age").textContent =
        "saved " + fmtAge(note.updated_at);
  } catch (e) {
    console.error("sticky save failed:", e.message);
    setSync(false);
  }
}
function queueTextSave(note, text) {
  note.text = text;
  clearTimeout(textTimers[note.id]);
  textTimers[note.id] = setTimeout(() => {
    delete textTimers[note.id];
    savePatch(note, { text: note.text, updated_at: stampNow() });
  }, 700);
}
function flushTextSave(note) {
  if (textTimers[note.id]) {
    clearTimeout(textTimers[note.id]);
    delete textTimers[note.id];
    savePatch(note, { text: note.text, updated_at: stampNow() });
  }
}
async function createNote() {
  const idx = notes.length;
  const board = document.getElementById("board");
  const x = Math.min(
    30 + (idx % 6) * 262 + (Math.random() * 40 - 20),
    Math.max(20, board.clientWidth - 265)
  );
  const y = 40 + Math.floor(idx / 6) * 270 + (Math.random() * 40 - 20);
  const color = Math.floor(Math.random() * PALETTE_COUNT);
  try {
    const { data, error } = await sb().from("sticky_notes")
      .insert([{ user_id: uid, text: "", color: color, x: Math.round(x), y: Math.round(y) }])
      .select().single();
    if (error) throw error;
    notes.push(data);
    renderNotes();
    setSync(true);
    openExpand(data);
  } catch (e) {
    console.error(e);
    setSync(false);
    showToast("Could not create the note.");
  }
}
async function deleteNote(id) {
  const n = notes.find(r => r.id === id);
  if (!n) return;
  if (popupOpenId === id) closeExpand();
  const preview = stripMarked(n.text || "").split("\n")[0].slice(0, 60);
  const ok = await askConfirm(
    "Throw this sticky away?",
    (preview ? '"' + preview + '"\n\n' : "") +
    "This permanently deletes it from the cloud.",
    true
  );
  if (!ok) return;
  try {
    const { error } = await sb().from("sticky_notes").delete().eq("id", id);
    if (error) throw error;
    notes = notes.filter(r => r.id !== id);
    renderNotes();
    setSync(true);
  } catch (e) {
    console.error(e);
    showToast("Could not delete the note.");
  }
}
function autosizeCe() {
  expandTa.style.height = "auto";
  expandTa.style.height = Math.max(230, expandTa.scrollHeight) + "px";
}
function openExpand(n) {
  popupOpenId = n.id;
  expandBox.className = "expand-box c" + (n.color || 0);
  expandTa.innerHTML = markedToHtml(n.text || "");
  document.getElementById("expand-age").textContent = "saved " + fmtAge(n.updated_at);
  expandOverlay.classList.add("open");
  autosizeCe();
  expandTa.focus();
  const sel = window.getSelection();
  const r = document.createRange();
  r.selectNodeContents(expandTa);
  r.collapse(false);
  sel.removeAllRanges();
  sel.addRange(r);
}
function closeExpand() {
  if (popupOpenId === null) return;
  const n = notes.find(r => r.id === popupOpenId);
  popupOpenId = null;
  expandOverlay.classList.remove("open");
  if (n) {
    flushTextSave(n);
    updateTileText(n);
  }
}
function updateTileText(n) {
  const tile = document.querySelector('.note[data-id="' + n.id + '"] .note-body');
  if (tile) tile.innerHTML = markedToHtml(n.text || "");
}

function onExpandInput() {
  const n = notes.find(r => r.id === popupOpenId);
  if (!n) return;
  autosizeCe();
  queueTextSave(n, htmlToMarked(expandTa));
  updateTileText(n);
}
expandTa.addEventListener("input", onExpandInput);
document.getElementById("expand-close").onclick = closeExpand;
expandOverlay.addEventListener("click", e => {
  if (e.target === expandOverlay) closeExpand();
});
function fmtAge(iso) {
  if (!iso) return "";
  const mins = Math.floor((Date.now() - Date.parse(iso)) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return mins + "m ago";
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + "h ago";
  return Math.floor(hrs / 24) + "d ago";
}
function renderNotes() {
  const board = document.getElementById("board");
  board.querySelectorAll(".note").forEach(el => el.remove());
  document.getElementById("board-hint").style.display =
    notes.length ? "none" : "block";
  document.getElementById("note-count").textContent =
    notes.length + " note" + (notes.length === 1 ? "" : "s");
  const q = document.getElementById("search-box").value.trim().toLowerCase();
  for (const n of notes) {
    const note = document.createElement("article");
    note.className = "note c" + (n.color || 0) + (draggingId === n.id ? " dragging" : "");
    note.dataset.id = n.id;
    const rot = ((n.id * 37) % 9) - 4;
    note.style.left = n.x + "px";
    note.style.top = n.y + "px";
    note.style.setProperty("--rot", rot + "deg");
    const grab = document.createElement("div");
    grab.className = "note-grab";
    grab.innerHTML = '<span class="grab-handle">&#9776;</span>';
    const del = document.createElement("button");
    del.className = "note-del";
    del.title = "delete note";
    del.innerHTML = "&#10005;";
    del.onclick = (e) => { e.stopPropagation(); deleteNote(n.id); };
    const body = document.createElement("div");
    body.className = "note-body";
    body.innerHTML = markedToHtml(n.text || "");
    const meta = document.createElement("div");
    meta.className = "note-meta";
    meta.textContent = "saved " + fmtAge(n.updated_at);
    note.appendChild(grab);
    note.appendChild(del);
    note.appendChild(body);
    note.appendChild(meta);
    attachDrag(note, grab, n);
    note.addEventListener("click", (e) => {
      if (e.target.closest(".note-del")) return;
      openExpand(n);
    });
    board.appendChild(note);
    if (q && !stripMarked(n.text).toLowerCase().includes(q)) note.classList.add("dimmed");
  }
}
function bringToFront(el) {
  if (zTop > 500) {
    const sorted = [...document.querySelectorAll(".note")]
      .sort((a, b) => ((+a.style.zIndex) || 0) - ((+b.style.zIndex) || 0));
    sorted.forEach((nn, i) => { nn.style.zIndex = 10 + i; });
    zTop = 10 + sorted.length;
  }
  el.style.zIndex = ++zTop;
}
function attachDrag(noteEl, grabEl, n) {
  let startX = 0, startY = 0, origX = 0, origY = 0, moved = false;
  grabEl.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    grabEl.setPointerCapture(e.pointerId);
    startX = e.clientX; startY = e.clientY;
    origX = n.x; origY = n.y;
    moved = false;
    draggingId = n.id;
    noteEl.classList.add("dragging");
    bringToFront(noteEl);
    const onMove = (ev) => {
      const dx = ev.clientX - startX, dy = ev.clientY - startY;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
      const board = document.getElementById("board");
      n.x = Math.max(0, Math.min(origX + dx, board.clientWidth - noteEl.offsetWidth));
      n.y = Math.max(0, origY + dy);
      noteEl.style.left = n.x + "px";
      noteEl.style.top = n.y + "px";
    };
    const onUp = () => {
      grabEl.removeEventListener("pointermove", onMove);
      grabEl.removeEventListener("pointerup", onUp);
      draggingId = null;
      noteEl.classList.remove("dragging");
      if (moved) savePatch(n, { x: n.x, y: n.y });
    };
    grabEl.addEventListener("pointermove", onMove);
    grabEl.addEventListener("pointerup", onUp);
  });
  noteEl.addEventListener("mouseenter", () => bringToFront(noteEl));
  noteEl.addEventListener("pointerdown", () => bringToFront(noteEl));
}
let rtTimer = null;
function setupRealtime() {
  sb()
    .channel("sticky-notes-rt-" + uid)
    .on("postgres_changes",
      { event: "*", schema: "public", table: "sticky_notes",
        filter: "user_id=eq." + uid },
      () => scheduleRemoteReload())
    .subscribe();
}
function scheduleRemoteReload() {
  if (popupOpenId !== null || draggingId !== null) {
    clearTimeout(rtTimer);
    rtTimer = setTimeout(scheduleRemoteReload, 800);
    return;
  }
  clearTimeout(rtTimer);
  rtTimer = setTimeout(async () => {
    try {
      await loadNotes();
      renderNotes();
    } catch (e) {
      console.warn("sticky realtime reload skipped:", e);
    }
  }, 250);
}
let modalResolve = null;
function askConfirm(title, message, destructive) {
  return new Promise(resolve => {
    modalResolve = resolve;
    document.getElementById("modal-title").textContent = title;
    document.getElementById("modal-message").textContent = message;
    document.getElementById("modal-overlay").classList.add("open");
  });
}
function closeModal(result) {
  document.getElementById("modal-overlay").classList.remove("open");
  if (modalResolve) { modalResolve(result); modalResolve = null; }
}
document.getElementById("modal-yes").onclick = () => closeModal(true);
document.getElementById("modal-no").onclick = () => closeModal(false);
document.getElementById("modal-overlay").addEventListener("click", e => {
  if (e.target === document.getElementById("modal-overlay")) closeModal(false);
});
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (expandOverlay.classList.contains("open")) { closeExpand(); return; }
  if (document.getElementById("modal-overlay").classList.contains("open")) {
    closeModal(false);
  }
});
let toastTimer = null;
function showToast(message) {
  const t = document.getElementById("toast");
  t.textContent = message;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}
document.getElementById("search-box").addEventListener("input", renderNotes);
(async function init() {
  try { await ensureAuth(); } catch (e) { return; }
  const session = await sb().auth.getSession();
  uid = session.data && session.data.session && session.data.session.user.id;
  if (!uid) return;
  try {
    await loadNotes();
    setupRealtime();
    setSync(true);
  } catch (err) {
    console.error(err);
    setSync(false);
    showToast("Could not load your notes from the cloud.");
  }
  renderNotes();
})();
</script>
