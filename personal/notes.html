<script>
let notes = [];
let uid = null;
let zTop = 10;
let draggingId = null;
let popupOpenId = null;
const textTimers = {};
const PALETTE_COUNT = 8;
const expandOverlay = document.getElementById("expand-overlay");
const expandBox = document.getElementById("expand-box");
const expandTa = document.getElementById("expand-ta");
function esc(str) {
  return String(str == null ? "" : str)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function markedToHtml(txt) {
  const s = esc(String(txt == null ? "" : txt));
  let out = "";
  const stack = [];
  let i = 0;
  const re = /\[\[(c[1-4]):/g;
  while (i < s.length) {
    re.lastIndex = i;
    const m = re.exec(s);
    const close = s.indexOf("]]", i);
    if (m && (close === -1 || m.index < close)) {
      out += s.slice(i, m.index);
      out += '<span class="hl ' + m[1] + '">';
      stack.push(m[1]);
      i = m.index + m[0].length;
    } else if (close !== -1) {
      out += s.slice(i, close);
      if (stack.length) {
        out += "</span>";
        stack.pop();
      } else {
        out += "]]";
      }
      i = close + 2;
    } else {
      out += s.slice(i);
      i = s.length;
    }
  }
  while (stack.length) {
    out += "</span>";
    stack.pop();
  }
  return out;
}
function stripMarked(t) {
  return String(t == null ? "" : t)
    .replace(/\[\[c[1-4]:/g, "").replace(/\]\]/g, "");
}
function readModel(root) {
  const plainParts = [];
  const nodes = [];
  const spans = [];
  function pushBoundary() {
    if (plainParts.length &&
        !plainParts[plainParts.length - 1].endsWith("\n")) {
      plainParts.push("\n");
    }
  }
  function currentLength() {
    return plainParts.join("").length;
  }
  function walk(node, color) {
    node.childNodes.forEach(ch => {
      if (ch.nodeType === 3) {
        nodes.push({ node: ch, start: currentLength() });
        plainParts.push(ch.nodeValue);
      } else if (ch.nodeType === 1) {
        if (ch.tagName === "BR") {
          plainParts.push("\n");
        } else if (ch.tagName === "DIV" || ch.tagName === "P") {
          pushBoundary();
          walk(ch, color);
        } else {
          const cls = ch.getAttribute("class") || "";
          const m = cls.match(/(?:^|\s)hl\s(c[1-4])(?:\s|$)/);

          if (m) {
            const start = currentLength();
            walk(ch, color || m[1]);
            const end = currentLength();
            if (end > start && !color) {
              spans.push({ start, end, color: m[1] });
            }
          } else {
            walk(ch, color);
          }
        }
      }
    });
  }
  walk(root, null);
  return {
    plain: plainParts.join(""),
    spans: spans.sort((a, b) => a.start - b.start),
    nodes
  };
}
function nodeLen(node) {
  if (node.nodeType === 3) return node.nodeValue.length;
  if (node.nodeType !== 1) return 0;
  if (node.tagName === "BR") return 1;

  let n = 0;
  node.childNodes.forEach(ch => n += nodeLen(ch));
  return n;
}
function charOffset(container, offset, model) {
  for (const ent of model.nodes) {
    if (ent.node === container) {
      return Math.min(ent.start + offset,
        ent.start + ent.node.nodeValue.length);
    }
  }
  let acc = 0;
  const kids = container.childNodes;
  for (let i = 0; i < offset && i < kids.length; i++) {
    acc += nodeLen(kids[i]);
  }
  acc = Math.max(0, Math.min(acc, model.plain.length));
  for (const ent of model.nodes) {
    const len = ent.node.nodeValue.length;
    if (acc >= ent.start && acc <= ent.start + len) return acc;
  }
  for (const ent of model.nodes) {
    if (ent.start >= acc) return ent.start;
  }
  return acc;
}
function offsetsFromSelection(model) {
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount || sel.isCollapsed) return null;
  const rng = sel.getRangeAt(0);
  const sn = rng.startContainer.nodeType === 1
    ? rng.startContainer : rng.startContainer.parentNode;
  const en = rng.endContainer.nodeType === 1
    ? rng.endContainer : rng.endContainer.parentNode;
  if (!expandTa.contains(sn) || !expandTa.contains(en)) return null;
  let s = charOffset(rng.startContainer, rng.startOffset, model);
  let e = charOffset(rng.endContainer, rng.endOffset, model);
  if (s > e) [s, e] = [e, s];
  return s === e ? null : { s, e };
}
function setSelectionByOffsets(model, s, e) {
  try {
    let sn = null, so = 0, en = null, eo = 0;
    for (const ent of model.nodes) {
      const len = ent.node.nodeValue.length;
      if (!sn && s >= ent.start && s <= ent.start + len) {
        sn = ent.node;
        so = s - ent.start;
      }
      if (!en && e >= ent.start && e <= ent.start + len) {
        en = ent.node;
        eo = e - ent.start;
      }
      if (sn && en) break;
    }
    if (sn && en) {
      const sel = window.getSelection();
      const r = document.createRange();
      r.setStart(sn, Math.min(so, sn.nodeValue.length));
      r.setEnd(en, Math.min(eo, en.nodeValue.length));
      sel.removeAllRanges();
      sel.addRange(r);
    }
  } catch (err) {
    console.debug("Could not restore text selection:", err);
  }
}
function subtractRange(spans, s, e) {
  const out = [];
  for (const sp of spans) {
    if (sp.end <= s || sp.start >= e) {
      out.push(sp);
      continue;
    }
    if (sp.start < s) {
      out.push({ start: sp.start, end: s, color: sp.color });
    }
    if (sp.end > e) {
      out.push({ start: e, end: sp.end, color: sp.color });
    }
  }
  return out.sort((a, b) => a.start - b.start);
}
function spansIntersect(spans, s, e) {
  return spans.some(sp => sp.end > s && sp.start < e);
}
let armed = null;
function penOffsets(model) {
  const live = offsetsFromSelection(model);
  if (live) {
    armed = live;
    return live;
  }
  if (armed && armed.s < model.plain.length &&
      armed.e <= model.plain.length) {
    return armed;
  }
  return null;
}
function commitModel(model, keep) {
  const n = notes.find(r => r.id === popupOpenId);
  if (!n) return;
  let out = "";
  let last = 0;
  for (const sp of model.spans) {
    if (sp.start < last) continue;
    out += model.plain.slice(last, sp.start);
    out += "[[" + sp.color + ":" +
      model.plain.slice(sp.start, sp.end) + "]]";
    last = sp.end;
  }
  out += model.plain.slice(last);
  n.text = out.replace(/^\n+/, "").replace(/\n{3,}/g, "\n\n");
  expandTa.innerHTML = markedToHtml(n.text);
  const fresh = readModel(expandTa);
  if (keep) setSelectionByOffsets(fresh, keep.s, keep.e);
  armed = keep || null;
  autosizeCe();
  savePatch(n, { text: n.text });
  updateTileText(n);
}
function applyHighlight(cls) {
  if (popupOpenId === null) return;
  const model = readModel(expandTa);
  const r = penOffsets(model);
  if (!r) {
    showToast("Select a word inside the note, then tap a color.");
    return;
  }
  model.spans = subtractRange(model.spans, r.s, r.e);
  model.spans.push({ start: r.s, end: r.e, color: cls });
  model.spans.sort((a, b) => a.start - b.start);
  commitModel(model, r);
}
function clearHighlights() {
  if (popupOpenId === null) return;
  const model = readModel(expandTa);
  const r = penOffsets(model);
  if (!r) {
    showToast("Select the highlighted text, then tap the eraser.");
    return;
  }
  if (!spansIntersect(model.spans, r.s, r.e)) {
    showToast("No highlight in that selection.");
    return;
  }
  model.spans = subtractRange(model.spans, r.s, r.e);
  commitModel(model, r);
}
function stashSelection() {
  if (popupOpenId === null) return;
  const off = offsetsFromSelection(readModel(expandTa));
  if (off) armed = off;
}
expandTa.addEventListener("mouseup", stashSelection);
expandTa.addEventListener("keyup", stashSelection);
document.addEventListener("selectionchange", () => {
  requestAnimationFrame(stashSelection);
});
document.querySelectorAll(".pen-dot").forEach(btn => {
  btn.addEventListener("mousedown", e => e.preventDefault());
  btn.addEventListener("click", () => applyHighlight(btn.dataset.c));
});
document.getElementById("pen-clear").addEventListener("mousedown",
  e => e.preventDefault());
document.getElementById("pen-clear").addEventListener("click",
  clearHighlights);
expandTa.addEventListener("paste", e => {
  e.preventDefault();
  document.execCommand("insertText", false,
    e.clipboardData.getData("text/plain"));
});
async function ensureAuth() {
  if (typeof requireAuth === "function") return await requireAuth();
  const { data } = await sb().auth.getSession();
  if (!data || !data.session) {
    location.href = "../auth.html?next=" +
      encodeURIComponent(location.pathname);
    throw new Error("not signed in");
  }
}
function setSync(ok, msg) {
  const el = document.getElementById("sync-note");
  el.textContent = ok ? (msg || "✓") :
    (msg || "offline — changes NOT saved");
  el.classList.toggle("live", !!ok);
  el.classList.toggle("save-fail", !ok);
}
function setSaving() {
  const el = document.getElementById("sync-note");
  el.textContent = "saving…";
  el.classList.remove("live", "save-fail");
}
async function loadNotes() {
  const { data, error } = await sb()
    .from("sticky_notes")
    .select("*")
    .eq("user_id", uid)
    .order("id", { ascending: true });

  if (error) throw error;
  notes = data || [];
}
function stampNow() {
  return new Date().toISOString();
}
const saveQueues = new Map();
const dirtyNotes = new Map();
let pendingSaves = 0;

function updateSyncStatus() {
  if (pendingSaves > 0) {
    setSaving();
  } else if (dirtyNotes.size > 0) {
    setSync(false, "unsaved — retrying every minute");
  } else {
    setSync(true);
  }
}
function clearSavedFields(id, snapshot) {
  const current = dirtyNotes.get(id);
  if (!current) return;
  for (const key of Object.keys(snapshot)) {
    if (Object.prototype.hasOwnProperty.call(current, key) &&
        Object.is(current[key], snapshot[key])) {
      delete current[key];
    }
  }
  if (Object.keys(current).length === 0) {
    dirtyNotes.delete(id);
  }
}
function savePatch(note, patch) {
  if (!note || note.id == null) {
    console.error("Cannot save note without an ID.");
    return Promise.resolve(false);
  }
  const id = note.id;
  note.updated_at = stampNow();
  const previous = dirtyNotes.get(id) || {};
  dirtyNotes.set(id, {
    ...previous,
    ...patch,
    updated_at: note.updated_at
  });
  const existing = saveQueues.get(id);
  if (existing) {
    updateSyncStatus();
    return existing;
  }
  pendingSaves++;
  updateSyncStatus();
  const job = Promise.resolve().then(async () => {
    const delays = [800, 2000, 4000, 8000, 16000];

    while (dirtyNotes.has(id)) {
      if (!notes.some(n => n.id === id)) {
        dirtyNotes.delete(id);
        return false;
      }
      const snapshot = { ...dirtyNotes.get(id) };
      let saved = false;
      for (let attempt = 0; attempt < 5; attempt++) {
        try {
          const { data, error } = await sb()
            .from("sticky_notes")
            .update(snapshot)
            .eq("id", id)
            .eq("user_id", uid)
            .select("id");
          if (!error && data && data.length > 0) {
            clearSavedFields(id, snapshot);
            saved = true;
            break;
          }
          if (!error) {
            console.error("Save affected 0 rows for note:", id);
            return false;
          }
          console.error("Sticky note save failed:", error.message);
        } catch (err) {
          console.error("Sticky note save error:", err);
        }
        if (attempt < 4) {
          await new Promise(resolve =>
            setTimeout(resolve, delays[attempt]));
        }
      }
      if (!saved) {
        console.error("Sticky note save exhausted retries:", id);
        return false;
      }
    }
    return true;
  }).finally(() => {
    if (saveQueues.get(id) === job) {
      saveQueues.delete(id);
    }
    pendingSaves--;
    updateSyncStatus();
  });
  saveQueues.set(id, job);
  return job;
}
window.addEventListener("online", () => {
  for (const [id, patch] of dirtyNotes) {
    const note = notes.find(n => n.id === id);
    if (note) savePatch(note, patch);
  }
});
window.addEventListener("beforeunload", e => {
  if (pendingSaves > 0 || dirtyNotes.size > 0) {
    e.preventDefault();
    e.returnValue = "";
  }
});
setInterval(() => {
  for (const [id, patch] of dirtyNotes) {
    const note = notes.find(n => n.id === id);
    if (note && !saveQueues.has(id)) savePatch(note, patch);
  }
}, 60000);
function queueTextSave(note, text) {
  note.text = text;
  clearTimeout(textTimers[note.id]);
  textTimers[note.id] = setTimeout(() => {
    delete textTimers[note.id];
    savePatch(note, { text: note.text });
  }, 700);
}
function flushTextSave(note) {
  if (!note) return;
  if (textTimers[note.id]) {
    clearTimeout(textTimers[note.id]);
    delete textTimers[note.id];
    savePatch(note, { text: note.text });
  }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden" && popupOpenId !== null) {
    const n = notes.find(r => r.id === popupOpenId);
    if (n) flushTextSave(n);
  }
});
window.addEventListener("pagehide", () => {
  if (popupOpenId !== null) {
    const n = notes.find(r => r.id === popupOpenId);
    if (n) flushTextSave(n);
  }
});
async function createNote() {
  const idx = notes.length;
  const board = document.getElementById("board");
  const x = Math.min(
    30 + (idx % 6) * 262 + (Math.random() * 40 - 20),
    Math.max(20, board.clientWidth - 265)
  );
  const y = 40 + Math.floor(idx / 6) * 270 +
    (Math.random() * 40 - 20);
  const color = Math.floor(Math.random() * PALETTE_COUNT);
  try {
    const { data, error } = await sb()
      .from("sticky_notes")
      .insert([{
        user_id: uid,
        text: "",
        color,
        x: Math.round(x),
        y: Math.round(y)
      }])
      .select()
      .single();
    if (error) throw error;
    notes.push(data);
    renderNotes();
    updateSyncStatus();
    openExpand(data);
  } catch (e) {
    console.error(e);
    setSync(false);
    showToast("Could not create the note.");
  }
}
async function deleteNote(id) {
  const n = notes.find(r => r.id === id);
  if (!n) return;
  if (popupOpenId === id) closeExpand();
  const preview = stripMarked(n.text || "")
    .split("\n")[0].slice(0, 60);

  const ok = await askConfirm(
    "Throw this sticky away?",
    (preview ? '"' + preview + '"\n\n' : "") +
    "This permanently deletes it from the cloud.",
    true
  );
  if (!ok) return;
  try {
    flushTextSave(n);
    const runningSave = saveQueues.get(id);
    if (runningSave) await runningSave;
    const { error } = await sb()
      .from("sticky_notes")
      .delete()
      .eq("id", id)
      .eq("user_id", uid);
    if (error) throw error;
    dirtyNotes.delete(id);
    notes = notes.filter(r => r.id !== id);
    renderNotes();
    updateSyncStatus();
  } catch (e) {
    console.error(e);
    updateSyncStatus();
    showToast("Could not delete the note.");
  }
}
function autosizeCe() {
  expandTa.style.height = "auto";
  expandTa.style.height =
    Math.max(230, expandTa.scrollHeight) + "px";
}
function openExpand(n) {
  armed = null;
  popupOpenId = n.id;
  expandBox.className = "expand-box c" + (n.color || 0);
  expandTa.innerHTML = markedToHtml(n.text || "");
  expandOverlay.classList.add("open");
  autosizeCe();
  expandTa.focus();
  const sel = window.getSelection();
  const r = document.createRange();
  r.selectNodeContents(expandTa);
  r.collapse(false);
  sel.removeAllRanges();
  sel.addRange(r);
}
function closeExpand() {
  if (popupOpenId === null) return;
  const n = notes.find(r => r.id === popupOpenId);
  popupOpenId = null;
  armed = null;
  expandOverlay.classList.remove("open");
  if (n) {
    flushTextSave(n);
    updateTileText(n);
  }
}
function updateTileText(n) {
  const tile = document.querySelector(
    '.note[data-id="' + n.id + '"] .note-body'
  );
  if (tile) tile.innerHTML = markedToHtml(n.text || "");
}
function onExpandInput() {
  const n = notes.find(r => r.id === popupOpenId);
  if (!n) return;
  armed = null;
  autosizeCe();
  const model = readModel(expandTa);
  let out = "";
  let last = 0;
  for (const sp of model.spans) {
    if (sp.start < last) continue;
    out += model.plain.slice(last, sp.start);
    out += "[[" + sp.color + ":" +
      model.plain.slice(sp.start, sp.end) + "]]";
    last = sp.end;
  }
  out += model.plain.slice(last);
  queueTextSave(
    n,
    out.replace(/^\n+/, "").replace(/\n{3,}/g, "\n\n")
  );

  updateTileText(n);
}
expandTa.addEventListener("input", onExpandInput);
document.getElementById("expand-close").onclick = closeExpand;
expandOverlay.addEventListener("click", e => {
  if (e.target === expandOverlay) closeExpand();
});
function fmtAge(iso) {
  if (!iso) return "";
  const mins = Math.floor((Date.now() - Date.parse(iso)) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return mins + "m ago";
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + "h ago";
  return Math.floor(hrs / 24) + "d ago";
}
function renderNotes() {
  const board = document.getElementById("board");
  board.querySelectorAll(".note").forEach(el => el.remove());
  document.getElementById("board-hint").style.display =
    notes.length ? "none" : "block";
  document.getElementById("note-count").textContent =
    notes.length + " note" + (notes.length === 1 ? "" : "s");
  const q = document.getElementById("search-box")
    .value.trim().toLowerCase();
  for (const n of notes) {
    const note = document.createElement("article");
    note.className = "note c" + (n.color || 0) +
      (draggingId === n.id ? " dragging" : "");
    note.dataset.id = n.id;
    const rot = ((n.id * 37) % 9) - 4;
    note.style.left = n.x + "px";
    note.style.top = n.y + "px";
    note.style.setProperty("--rot", rot + "deg");
    const grab = document.createElement("div");
    grab.className = "note-grab";
    grab.innerHTML = '<span class="grab-handle">&#9776;</span>';
    const del = document.createElement("button");
    del.className = "note-del";
    del.title = "delete note";
    del.innerHTML = "&#10005;";
    del.onclick = e => {
      e.stopPropagation();
      deleteNote(n.id);
    };
    const body = document.createElement("div");
    body.className = "note-body";
    body.innerHTML = markedToHtml(n.text || "");
    note.appendChild(grab);
    note.appendChild(del);
    note.appendChild(body);
    attachDrag(note, grab, n);
    note.addEventListener("click", e => {
      if (e.target.closest(".note-del")) return;
      if (note.__justDragged) {
        note.__justDragged = false;
        return;
      }
      openExpand(n);
    });
    board.appendChild(note);
    if (q && !stripMarked(n.text).toLowerCase().includes(q)) {
      note.classList.add("dimmed");
    }
  }
}
function bringToFront(el) {
  if (zTop > 500) {
    const sorted = [...document.querySelectorAll(".note")]
      .sort((a, b) =>
        ((+a.style.zIndex) || 0) - ((+b.style.zIndex) || 0)
      );
    sorted.forEach((nn, i) => {
      nn.style.zIndex = 10 + i;
    });
    zTop = 10 + sorted.length;
  }
  el.style.zIndex = ++zTop;
}
function attachDrag(noteEl, grabEl, n) {
  let startX = 0, startY = 0;
  let origX = 0, origY = 0;
  let moved = false;
  grabEl.addEventListener("pointerdown", e => {
    e.preventDefault();
    grabEl.setPointerCapture(e.pointerId);
    startX = e.clientX;
    startY = e.clientY;
    origX = n.x;
    origY = n.y;
    moved = false;
    draggingId = n.id;
    noteEl.classList.add("dragging");
    bringToFront(noteEl);
    const onMove = ev => {
      const dx = ev.clientX - startX;
      const dy = ev.clientY - startY;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
      const board = document.getElementById("board");
      n.x = Math.max(0, Math.min(
        origX + dx,
        board.clientWidth - noteEl.offsetWidth
      ));
      n.y = Math.max(0, origY + dy);
      noteEl.style.left = n.x + "px";
      noteEl.style.top = n.y + "px";
    };
    const onUp = () => {
      grabEl.removeEventListener("pointermove", onMove);
      grabEl.removeEventListener("pointerup", onUp);
      grabEl.removeEventListener("pointercancel", onUp);
      draggingId = null;
      noteEl.classList.remove("dragging");
      if (moved) {
        noteEl.__justDragged = true;
        n.x = Math.round(n.x);
        n.y = Math.round(n.y);
        noteEl.style.left = n.x + "px";
        noteEl.style.top = n.y + "px";
        savePatch(n, { x: n.x, y: n.y });
      }
    };
    grabEl.addEventListener("pointermove", onMove);
    grabEl.addEventListener("pointerup", onUp);
    grabEl.addEventListener("pointercancel", onUp);
  });

  noteEl.addEventListener("mouseenter", () => bringToFront(noteEl));
  noteEl.addEventListener("pointerdown", () => bringToFront(noteEl));
}
let rtTimer = null;
function setupRealtime() {
  sb()
    .channel("sticky-notes-rt-" + uid)
    .on("postgres_changes", {
      event: "*",
      schema: "public",
      table: "sticky_notes",
      filter: "user_id=eq." + uid
    }, () => scheduleRemoteReload())
    .subscribe();
}
function scheduleRemoteReload() {
  if (popupOpenId !== null || draggingId !== null ||
      pendingSaves > 0 || dirtyNotes.size > 0) {
    clearTimeout(rtTimer);
    rtTimer = setTimeout(scheduleRemoteReload, 1000);
    return;
  }
  clearTimeout(rtTimer);
  rtTimer = setTimeout(async () => {
    if (popupOpenId !== null || draggingId !== null ||
        pendingSaves > 0 || dirtyNotes.size > 0) {
      scheduleRemoteReload();
      return;
    }
    try {
      await loadNotes();
      renderNotes();
    } catch (e) {
      console.warn("Sticky realtime reload skipped:", e);
    }
  }, 250);
}
let modalResolve = null;
function askConfirm(title, message, destructive) {
  return new Promise(resolve => {
    modalResolve = resolve;

    document.getElementById("modal-title").textContent = title;
    document.getElementById("modal-message").textContent = message;
    document.getElementById("modal-overlay").classList.add("open");
  });
}
function closeModal(result) {
  document.getElementById("modal-overlay").classList.remove("open");
  if (modalResolve) {
    modalResolve(result);
    modalResolve = null;
  }
}
document.getElementById("modal-yes").onclick = () => closeModal(true);
document.getElementById("modal-no").onclick = () => closeModal(false);
document.getElementById("modal-overlay").addEventListener("click", e => {
  if (e.target === document.getElementById("modal-overlay")) {
    closeModal(false);
  }
});
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (expandOverlay.classList.contains("open")) {
    closeExpand();
    return;
  }
  if (document.getElementById("modal-overlay")
      .classList.contains("open")) {
    closeModal(false);
  }
});
let toastTimer = null;
function showToast(message) {
  const t = document.getElementById("toast");
  t.textContent = message;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    t.classList.remove("show");
  }, 2600);
}
document.getElementById("search-box")
  .addEventListener("input", renderNotes);
function exportNotes() {
  if (!notes.length) {
    showToast("Nothing to export yet.");
    return;
  }
  const payload = {
    exported_at: new Date().toISOString(),
    app: "wall-o-sticky-notes",
    count: notes.length,
    notes: notes.map(n => ({
      text: n.text || "",
      color: n.color || 0,
      x: n.x,
      y: n.y
    }))
  };
  const blob = new Blob(
    [JSON.stringify(payload, null, 2)],
    { type: "application/json" }
  );
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const d = new Date();
  const stamp = d.getFullYear() + "-" +
    String(d.getMonth() + 1).padStart(2, "0") + "-" +
    String(d.getDate()).padStart(2, "0");
  a.href = url;
  a.download = "sticky-notes-" + stamp + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast("Downloaded " + notes.length + " note" +
    (notes.length === 1 ? "" : "s") + ".");
}
async function importNotes(file) {
  let payload;
  try {
    payload = JSON.parse(await file.text());
  } catch (e) {
    showToast("That file isn't a valid backup.");
    return;
  }
  const incoming = Array.isArray(payload) ? payload : payload.notes;
  if (!Array.isArray(incoming) || !incoming.length) {
    showToast("No notes found in that file.");
    return;
  }
  const rows = incoming
    .filter(n => n && typeof n.text === "string")
    .map(n => ({
      user_id: uid,
      text: n.text,
      color: Number.isInteger(n.color) ? n.color : 0,
      x: Math.max(0, Math.round(Number(n.x) || 0)),
      y: Math.max(0, Math.round(Number(n.y) || 0))
    }));
  if (!rows.length) {
    showToast("No usable notes in that file.");
    return;
  }
  rows.forEach((r, i) => {
    r.x += 16 + (i % 4) * 8;
    r.y += 16;
  });
  try {
    const { error } = await sb()
      .from("sticky_notes")
      .insert(rows);
    if (error) throw error;
    await loadNotes();
    renderNotes();
    updateSyncStatus();
    showToast("Imported " + rows.length + " note" +
      (rows.length === 1 ? "" : "s") + ".");
  } catch (e) {
    console.error(e);
    setSync(false);
    showToast("Import failed — open console (F12) for details.");
  }
}
document.getElementById("export-btn")
  .addEventListener("click", exportNotes);
document.getElementById("import-btn")
  .addEventListener("click", () => {
    document.getElementById("import-file").click();
  });
document.getElementById("import-file")
  .addEventListener("change", e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (f) importNotes(f);
  });
(async function init() {
  try {
    await ensureAuth();
  } catch (e) {
    return;
  }
  const session = await sb().auth.getSession();
  uid = session.data && session.data.session &&
    session.data.session.user.id;
  if (!uid) return;
  try {
    await loadNotes();
    setupRealtime();
    updateSyncStatus();
  } catch (err) {
    console.error(err);
    setSync(false);
    showToast("Could not load your notes from the cloud.");
  }
  renderNotes();
})();
</script>
