  .note { color: var(--dim); font-size: 0.75rem; margin-top: 26px; }

const ROLLOVER_MINS = { "furby": 40 };

function logDailyEv(name, tid, ev, nowMs) {
  const slotMs = evPrevMs(ev, nowMs);
const creditMs = slotMs + ROLLOVER_MINS[tid] * 60000;
  if (dailyEpoch(creditMs) === dailyEpoch(nowMs)) {
    toggleLog(name, tid, nowMs, false, slotMs);
    return;
  }
  let carry = loadState(KEY_CARRY) || {};
  const newEp = dailyEpoch(creditMs);
  if (carry.epoch !== newEp) carry = { epoch: newEp, done: {} };
  if (carry.done[tid] !== undefined) {

const NAKED_MAPS = ["Gendarran Fields", "Timberline Falls", "Iron Marches"];
function mod(a, n) { return ((a % n) + n) % n; }
function nakedMap(slotMs) {
  const h = new Date(slotMs).getUTCHours();

}

function evPrevMs(ev, nowMs) {
  const nowMin = nowMs / 60000;
  const nx = evNextMs(ev, nowMs);
  if (nx - nowMs <= 5 * 60000) return nx;
  if (ev.daily) {
    const dayStart = Math.floor(nowMin / 1440) * 1440;
    let best = -Infinity;
    for (let d = -1; d <= 0; d++) {
      for (let i = 0; i < ev.daily.length; i++) {
        const cand = dayStart + d * 1440 + ev.daily[i];
        if (cand <= nowMin && cand > best) best = cand;
      }
    }
    return best * 60000;
  }
  const phase = mod(nowMin - ev.offset, ev.interval);
  return (nowMin - phase) * 60000;
}
function evNextMs(ev, nowMs) {
  const nowMin = nowMs / 60000;
  if (ev.daily) {
    const dayStart = Math.floor(nowMin / 1440) * 1440;
    let best = Infinity;
    for (let d = 0; d <= 1; d++) {
      for (let i = 0; i < ev.daily.length; i++) {
        const delta = dayStart + d * 1440 + ev.daily[i] - nowMin;
        if (delta >= 0 && delta < best) best = delta;

    return nowMs + best * 60000;
  }

}

}
function fmtDur(msLeft) {
  const totalMin = Math.max(0, Math.floor(msLeft / 60000));
  const d = Math.floor(totalMin / 1440);
  const h = Math.floor((totalMin % 1440) / 60);
  const m = totalMin % 60;
  if (d > 0) return d + "d " + h + "hr " + m + "m";
  if (h > 0) return h + "hr " + m + "m";

}
function isoWeek(nowMs) {
  const d = new Date(nowMs);
  const u = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));

function loadState(key) {
  if (key === KEY_DAILY) return dailyState.daily;
  if (key === KEY_CARRY) return dailyState.carry;
  if (key === KEY_WEEKLY) return weeklyState.weekly;
  return null;
}
function saveState(key, value) {
  if (key === KEY_DAILY || key === KEY_CARRY) {
    if (key === KEY_DAILY) dailyState.daily = value;
    else dailyState.carry = value;
    dailySync.save(true);
  } else if (key === KEY_WEEKLY) {
    weeklyState.weekly = value;
    weeklySync.save(true);
  }

function dailyEpoch(nowMs) { return Math.floor(nowMs / 86400000); }
function weeklyEpoch(nowMs) {

  const WEEKLY_ANCHOR = 4 * 86400000 + WEEKLY_RESET_MIN_UTC * 60000;

function getFreshState(key, epoch) {

    if (!state.done || typeof state.done !== "object") state.done = {};
    return state;
  }
  if (rolloverLocked) return state || { epoch: epoch, done: {} };

  if (key === KEY_DAILY) {
    if (state && state.epoch !== epoch && state.epoch >= 0) {
      archiveOldDay(state);
    }
    const fresh = { epoch: epoch, done: {} };
    const carry = loadState(KEY_CARRY);
    if (carry && carry.epoch === epoch) {
      for (const tid in (carry.done || {})) {
        if (fresh.done[tid] === undefined) fresh.done[tid] = carry.done[tid];

      saveState(KEY_CARRY, { epoch: epoch, done: {} });
    }
    saveState(KEY_DAILY, fresh);
    return fresh;
  }

function archiveOldDay(oldState) {

  const done = oldState.done;
  if (!done || typeof done !== "object") return;
  const ids = Object.keys(done);
  if (!ids.length) return;

  const dayMs = oldState.epoch * 86400000;
  const d = new Date(dayMs);
  const year = String(d.getUTCFullYear());
  const dayKey = year + "-" + String(d.getUTCMonth() + 1).padStart(2, "0") +
                 "-" + String(d.getUTCDate()).padStart(2, "0");

  historyLogs[year] = historyLogs[year] || {};
  const existing = historyLogs[year][dayKey] || {};
  for (const tid in done) if (existing[tid] === undefined) existing[tid] = done[tid];
  historyLogs[year][dayKey] = existing;

function toggleLog(name, tid, nowMs, isWeekly, stampMs) {

    chip.className = "chip" + (ts !== undefined ? " logged" : "");

    let inner = '<span class="dot" style="background:' + t.color + '"></span>' + t.name;
    if (ts !== undefined) {
      let stampTxt = fmtClock(ts);
      if (t.id === "nakedman") stampTxt += " \u00B7 " + nakedMap(ts);
      inner += ' <span class="tick">\u2713</span><span class="stamp-info">@ ' + stampTxt + '</span>';
      if (dailyEpoch(ts) < dailyEpoch(now)) {
        inner += ' <span class="chip-cd" style="color:var(--accent2)">(yesterday)</span>';
    }  
    } else if (ev) {
      inner += cdSpanHtml(t, now);
    }
      else if (t.zone) {
      inner += ' <span class="chip-zone">@ ' + t.zone + '</span>';
    }
    chip.innerHTML = inner;
    chip.title = tooltipFor(t, false, now);

chip.onclick = e => {
  e.preventDefault();
  if (ev && ROLLOVER_MINS[t.id]) {
    logDailyEv(t.name, t.id, ev, Date.now());
  } else {
    const stamp = ev ? evPrevMs(ev, Date.now()) : undefined;
    toggleLog(t.name, t.id, Date.now(), false, stamp);
  }
  render();
};
chip.oncontextmenu = e => { e.preventDefault(); openInfo(t, e, false); };
roster.appendChild(chip);
});

  return Object.keys(s.done).filter(k => DAILIES.some(d => d.id === k)).length + " of " + DAILIES.length + " done";
}
function renderGhosts(now) {
  const block = document.getElementById("ghost-block");
  block.innerHTML = "";
  const s = getFreshState(KEY_DAILY, dailyEpoch(now));

  const dailyIds = {};
  DAILIES.forEach(t => { dailyIds[t.id] = true; });
const ghosts = Object.keys(s.done)
    .filter(tid => !dailyIds[tid])
    .map(tid => ({ tid: tid, ts: s.done[tid] }))
    .sort((a, b) => a.ts - b.ts);

  if (ghosts.length === 0) return;

  const roster = document.createElement("div");
  roster.className = "roster";
  block.appendChild(roster);

  ghosts.forEach(g => {
    const x = EXTRAS[g.tid] || { name: g.tid, zone: "logged from Event Timers" };

    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "chip ghost logged";
  let inner = '<span class="dot" style="background:' + (x.color || "#5fd3c4") + '"></span>' + x.name +
                ' <span class="tick">\u2713</span><span class="stamp-info">@ ' + fmtClock(g.ts) + '</span>';
    chip.innerHTML = inner;

    let tip = x.name + "\nWhere: " + (x.zone || "?");
    if (x.reward) tip += "\nReward: " + x.reward;
    tip += "\nLeft-click: toggle done. Right-click: details.";
    chip.title = tip;
    const ghostTask = {
      id: g.tid,
      name: x.name,
      zone: x.zone || "",
      reward: x.reward || "",
      isGhost: true
    };

    chip.onclick = e => {
      e.preventDefault();
      toggleLog(x.name, g.tid, Date.now(), false);
      render();
    };
    chip.oncontextmenu = e => { e.preventDefault(); openInfo(ghostTask, e, false); };
    roster.appendChild(chip);
  });
}

function renderWeeklyChips(now) {
  const roster = document.getElementById("roster-weekly");
  roster.innerHTML = "";
  const s = getFreshState(KEY_WEEKLY, weeklyEpoch(now));
  const wk = isoWeek(now);
  const weekData = WEEKS[wk] || null;

  let doneCount = 0;
  WEEKLIES.forEach(t => {
    const ts = s.done[t.id];
    if (ts !== undefined) doneCount++;

    const missing = t.rotating && !(weekData && weekData[t.rotating]);

    const chip = document.createElement("button");
    chip.className = "chip" + (ts !== undefined ? " logged" : "") + (missing ? " warn" : "");

let inner = '<span class="dot" style="background:#148eb4"></span>' + t.name;
if (ts !== undefined) {
  inner += ' <span class="tick">\u2713</span>';
} else if (missing) {
  inner += ' <span class="warn-flag">no objective for wk ' + wk + '</span>';
}
chip.innerHTML = inner;
chip.title = tooltipFor(t, true, now);

    chip.onclick = e => {
      e.preventDefault();
      toggleLog(t.name, t.id, Date.now(), true);
      render();
    };
    chip.oncontextmenu = e => { e.preventDefault(); openInfo(t, e, true); };
    roster.appendChild(chip);
  });

  const pct = WEEKLIES.length ? (doneCount / WEEKLIES.length) * 100 : 0;
  const bar = document.getElementById("weekly-bar");
  bar.style.width = pct + "%";
  bar.className = "progress-inner" + (pct === 100 ? " full" : "");

  lastWeeklyCounts = { done: doneCount, total: WEEKLIES.length };
  return lastWeeklyCounts;
}
function render() {
  const now = Date.now();
  document.getElementById("clock-now").textContent = fmtClock(now);

  renderDailyChips(now);
  document.getElementById("daily-meta").innerHTML =
    "resets in <b>" + fmtDur(nextDailyReset(now) - now) + "</b>";

  renderGhosts(now);

  const w = renderWeeklyChips(now);
  document.getElementById("weekly-meta").innerHTML =
    "Week " + isoWeek(now) + " \u00B7 " + w.done + " of " + w.total + " done" +
    " \u00B7 resets in <b>" + fmtDur(nextWeeklyReset(now) - now) + "</b>";
}
(async function init() {
  const session = await requireAuth();
  if (!session) return;
  USER_ID = session.user && session.user.id;
  if (!USER_ID) return;

  rolloverLocked = true;

  const dc = Store.get(DAILY_CLOUD_KEY + ":" + USER_ID);
  const wc = Store.get(WEEKLY_CLOUD_KEY + ":" + USER_ID);

  if (dc) dailyState = normalizeDailyState(dc);
  if (wc) weeklyState = normalizeWeeklyState(wc);
  render();

  await dailySync.init();
  await weeklySync.init();
  await historySync.init();
  historySyncReady = true;

  const legacyYearKeys = [];
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (/^gw2-daily-log-\d{4}$/.test(key)) legacyYearKeys.push(key);
  }
  let adoptedYears = false;
  for (const key of legacyYearKeys) {
    const year = key.slice(-4);
    const legacyYear = Store.get(key);
    if (legacyYear && typeof legacyYear === "object") {
      historyLogs[year] = historyLogs[year] || {};
      for (const day of Object.keys(legacyYear)) {
        if (!historyLogs[year][day]) historyLogs[year][day] = legacyYear[day];
      }
      adoptedYears = true;
    }
  }
  if (adoptedYears) historySync.save(true);
  if (adoptedYears && legacyYearKeys.length) legacyYearKeys.forEach(key => localStorage.removeItem(key));

  rolloverLocked = false; 

  const nowMs = Date.now();
  getFreshState(KEY_DAILY, dailyEpoch(nowMs));
  getFreshState(KEY_WEEKLY, weeklyEpoch(nowMs));

  render();
  setInterval(updateClock, 1000);
  setInterval(render, 60000);
})();
function updateClock() {
  const now = Date.now();

  document.getElementById("clock-now").textContent = fmtClock(now);
  document.getElementById("daily-meta").innerHTML =
    "resets in <b>" + fmtDur(nextDailyReset(now) - now) + "</b>";
  const w = lastWeeklyCounts;
  document.getElementById("weekly-meta").innerHTML =
    "Week " + isoWeek(now) + " \u00B7 " + w.done + " of " + w.total + " done" +
    " \u00B7 resets in <b>" + fmtDur(nextWeeklyReset(now) - now) + "</b>";
  document.querySelectorAll(".live-cd").forEach(span => {
    const t = TASK_BY_ID[span.dataset.ev];
    if (!t || !t.ev) return;
    const ev = EVS[t.id];
    const nowMin = now / 60000;
    const since = ((nowMin - ev.offset) % ev.interval + ev.interval) % ev.interval;
    if (since < 15) {
      span.textContent = "Active NOW";
      span.style.color = "var(--now)";
      span.style.fontWeight = "700";
    } else {
      const nx = evNextMs(ev, now);
      let txt = "next @ " + fmtClock(nx);
      if (t.id === "nakedman") txt += " \u00B7 " + nakedMap(nx);
      span.textContent = txt;
      span.style.color = "";
      span.style.fontWeight = "";
    }
  });
}
