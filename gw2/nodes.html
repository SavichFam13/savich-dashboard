// =====================================================================
// STORE SHIM — per-user local cache (fast loads, offline fallback).
// Cloud (Supabase user_state) is the source of truth; the cache is
// keyed by user id so two accounts on the same device never mix.
// =====================================================================
const Store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { localStorage.setItem(k, JSON.stringify(v)); }
};

// =====================================================================
// STATE + PER-USER SYNC ENGINE (createUserSync lives in db.js)
// =====================================================================
const STATE_KEY = "gw2-nodes";
let USER_ID = null;

// state: { owned: {name:true}, custom: [{group,name,details}], locs: {name:"[&...] text"} }
function normalizeState(s) {
  s = s || {};
  if (!s.owned || typeof s.owned !== "object") s.owned = {};
  if (!Array.isArray(s.custom)) s.custom = [];
  if (!s.locs || typeof s.locs !== "object") s.locs = {};
  return s;
}
let state = { owned: {}, custom: [], locs: {} };
let filter = "all";

const sync = createUserSync({
  key: STATE_KEY,
  sections: ["owned", "custom", "locs"],
  loadLocal: () => Store.get(STATE_KEY + ":" + USER_ID),
  saveLocal: (s) => Store.set(STATE_KEY + ":" + USER_ID, s),
  getState: () => state,
  setState: (s) => { state = normalizeState(s); },
  onRender: () => render(),
  setOnline: (ok, msg) => setSync(ok, msg)
});

function save(immediate) { sync.save(immediate); }

function setSync(ok, msg) {
  const el = document.getElementById("sync-note");
  el.textContent = ok ? (msg || "✓") : "offline — changes NOT saved";
  el.classList.toggle("live", !!ok);
}

// =====================================================================
// BACKUP / RESTORE
// =====================================================================
function isValidNodeState(data) {
  return data && typeof data === "object" && !Array.isArray(data) &&
    typeof data.owned === "object" && data.owned !== null &&
    Array.isArray(data.custom) &&
    (data.locs === undefined || (typeof data.locs === "object" && data.locs !== null));
}

function exportState() {
  const ownedCount = Object.keys(state.owned).length;
  const customCount = (state.custom || []).length;
  const locCount = Object.keys(state.locs || {}).length;
  if (ownedCount === 0 && customCount === 0 && locCount === 0) {
    showToast("Nothing to back up yet — no owned nodes, custom nodes, or saved codes.");
    return;
  }
  const blob = new Blob([JSON.stringify(state, null, 2)],
    { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "gw2-nodes-backup-" +
    new Date().toISOString().slice(0, 10) + ".json";
  a.click();
  URL.revokeObjectURL(url);
  showToast("Backup downloaded. Keep it somewhere safe.");
}

function importState(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const data = JSON.parse(reader.result);
      if (!isValidNodeState(data)) {
        showToast("That file isn't a valid nodes backup. It should be a gw2-nodes export.");
        e.target.value = "";
        return;
      }
      const ownedN = Object.keys(data.owned || {}).length;
      const customN = (data.custom || []).length;
      const locN = Object.keys(data.locs || {}).length;
      const curOwned = Object.keys(state.owned).length;
      const ok = await askConfirm(
        "Restore backup over current data?",
        "Backup: " + ownedN + " owned, " + customN + " custom nodes, " + locN + " saved codes\n" +
        "Current: " + curOwned + " owned, " +
        (state.custom || []).length + " custom nodes, " +
        Object.keys(state.locs || {}).length + " saved codes\n\n" +
        "This replaces everything on this page with the backup contents.",
        true
      );
      if (!ok) { e.target.value = ""; return; }
      state = normalizeState(data);
      save(true); // push to cloud right away
      render();
      showToast("Backup restored.");
    } catch (err) {
      showToast("Couldn't read that file.");
    }
    e.target.value = "";
  };
  reader.readAsText(file);
}

// =====================================================================
// POPUP FUNCTIONS
// =====================================================================
function infoFor(node) {
  const cust = (state.custom || []).find(c => c.name === node.name);
  if (cust && cust.details) {
    return { src: cust.details, drops: "", custom: true };
  }
  const i = INFO[node.name];
  if (i) return { src: i.src, drops: i.drops, custom: false };
  return null;
}

function locFor(node) {
  // user-saved code/text wins over the seed
  return (state.locs && state.locs[node.name]) || LOC[node.name] || null;
}

function codeIn(text) {
  const m = text && text.match(/\[&[A-Za-z0-9+/]+={0,2}\]/);
  return m ? m[0] : null;
}

function openInfo(node, evt) {
  const panel = document.getElementById("info-panel");
  document.getElementById("info-name").textContent = node.name;
  const lines = document.getElementById("info-lines");
  lines.innerHTML = "";

  function line(lab, val) {
    const div = document.createElement("div");
    div.className = "info-line";
    div.innerHTML = '<span class="lab">' + lab + ':</span> <b>' + esc(val) + '</b>';
    lines.appendChild(div);
    return div;
  }
  function smallBtn(label, cls, onClick) {
    const btn = document.createElement("button");
    btn.className = "info-btn" + (cls ? " " + cls : "");
    btn.textContent = label;
    btn.onclick = onClick;
    return btn;
  }

  const info = infoFor(node);
  if (info) {
    if (info.src) line(info.custom ? "Details" : "How to get it", info.src);
    if (info.drops) line("Daily gathering", info.drops);
  } else {
    line("Details", "Not yet documented");
  }
  line("Status", state.owned[node.name] ? "OWNED ✓" : "Still needed");

  // ---------- LOCATION LINE (copy-code + inline edit) ----------
  const curLoc = locFor(node);
  const code = codeIn(curLoc);
  const locDiv = document.createElement("div");
  locDiv.className = "info-line";
  if (code) locDiv.classList.add("has-code");

  const lab = document.createElement("span");
  lab.className = "lab";
  lab.textContent = "Location: ";
  locDiv.appendChild(lab);

  const val = document.createElement("b");
  val.innerHTML = esc(curLoc || "not set");
  if (code) {
    val.innerHTML = esc(curLoc.replace(code, "")) +
      ' <span class="info-code">' + esc(code) + "</span>";
  }
  locDiv.appendChild(val);

  if (code) {
    locDiv.appendChild(smallBtn("copy code", "copycode", function () {
      const btn = this;
      navigator.clipboard.writeText(code).then(function () {
        btn.textContent = "copied!";
        showToast("Map code copied — paste it into GW2 chat.");
        setTimeout(function () { btn.textContent = "copy code"; }, 1200);
      });
    }));
  }

  const editBtn = smallBtn(curLoc ? "edit" : "+ add code", "plain", function () {
    // INLINE EDITOR — no browser dialogs, so nothing can be blocked
    locDiv.innerHTML = "";
    const inp = document.createElement("input");
    inp.type = "text";
    inp.className = "info-input";
    inp.placeholder = "paste code like [&BLgEAAA=] + optional note";
    inp.value = curLoc || "";
    locDiv.appendChild(inp);

    const saveBtn = smallBtn("save", "copycode", function () {
      const v = inp.value.trim();
      if (v) state.locs[node.name] = v;
      else delete state.locs[node.name];
      save();
      openInfo(node, evt); // redraw popup with the new value
    });
    locDiv.appendChild(saveBtn);

    const cancelBtn = smallBtn("cancel", "plain", function () {
      openInfo(node, evt);
    });
    locDiv.appendChild(cancelBtn);

    // Enter key saves, Escape cancels (careful: outer Escape handler closes panel)
    inp.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); saveBtn.click(); }
      if (e.key === "Escape") { e.stopPropagation(); cancelBtn.click(); }
    });

    inp.focus();
  });
  locDiv.appendChild(editBtn);

  lines.appendChild(locDiv);
  // ------------------------------------------------------

  // Delete button for custom nodes
  if (node.custom) {
    const btn = document.createElement("button");
    btn.className = "info-del";
    btn.textContent = "delete this custom node";
    btn.onclick = () => {
      confirmAndRemove(node.name);
    };
    lines.appendChild(btn);
  }

  panel.classList.add("open");
  // only reposition when opened from a chip (not when reopened after edit)
  const t = evt && evt.currentTarget;
  const isChip = t && t.classList && t.classList.contains("chip");
  if (isChip) {
    const r = t.getBoundingClientRect();
    const vw = window.innerWidth, vh = window.innerHeight;
    const pw = panel.offsetWidth, ph = panel.offsetHeight;
    let y = r.bottom + 10;
    if (y + ph > vh - 14) y = Math.max(14, r.top - ph - 10);
    let x = r.left;
    if (x + pw > vw - 14) x = Math.max(14, vw - pw - 14);
    panel.style.left = x + "px";
    panel.style.top = y + "px";
  }
}
function closeInfo() {
  document.getElementById("info-panel").classList.remove("open");
}
document.addEventListener("keydown", e => { if (e.key === "Escape") closeInfo(); });
document.addEventListener("click", e => {
  const panel = document.getElementById("info-panel");
  if (panel.classList.contains("open") && !panel.contains(e.target))
    closeInfo();
}, true);

// =====================================================================
// RENDER
// =====================================================================
function allNodes() {
  const out = [];
  for (const g in NODE_GROUPS)
    for (const n of NODE_GROUPS[g]) out.push({ group: g, name: n, custom: false });
  for (const c of (state.custom || []))
    out.push({ group: c.group, name: c.name, custom: true, details: c.details || "" });
  return out;
}

function render() {
  const nodes = allNodes();
  const ownedCount = nodes.filter(n => state.owned[n.name]).length;
  const pct = nodes.length ? Math.round(ownedCount / nodes.length * 100) : 0;

  document.getElementById("stats").textContent =
    ownedCount + " of " + nodes.length + " nodes owned (" + pct + "%)";
  const bar = document.getElementById("bar");
  bar.style.width = pct + "%";
  bar.className = "progress-inner" + (pct === 100 ? " full" : "");

  const groups = {};
  for (const n of nodes) {
    if (filter === "needed" && state.owned[n.name]) continue;
    if (filter === "owned" && !state.owned[n.name]) continue;
    (groups[n.group] = groups[n.group] || []).push(n);
  }

  const wrap = document.getElementById("groups");
  wrap.innerHTML = "";
  for (const g in groups) {
    const ownedInGroup = groups[g].filter(n => state.owned[n.name]).length;
    const h = document.createElement("div");
    h.className = "section-title";
    h.innerHTML = "<span>" + esc(g) + "</span><span class='section-count'>" +
      ownedInGroup + " / " + groups[g].length + " owned</span>";
    wrap.appendChild(h);
    const roster = document.createElement("div");
    roster.className = "roster";
    for (const n of groups[g]) {
      const b = document.createElement("button");
      const info = infoFor(n);
      b.className = "chip" + (state.owned[n.name] ? " owned" : "") + (info ? " has-info" : "");
      b.innerHTML = (state.owned[n.name] ? "<span class='tick'>&#10003;</span> " : "") +
                    "<span class='nm'>" + esc(n.name) + "</span>";

      // Hover tooltip
      if (info) {
        b.title = (info.src ? "How: " + info.src + "\n" : "") +
                  (info.drops ? "Gives: " + info.drops + "\n" : "") +
                  "Right-click for details";
      } else {
        b.title = "Right-click for details";
      }

      b.onclick = () => toggle(n.name);
      b.oncontextmenu = (e) => { e.preventDefault(); openInfo(n, e); };
      roster.appendChild(b);
    }
    wrap.appendChild(roster);
  }

  for (const [id, f] of [["f-all","all"],["f-needed","needed"],["f-owned","owned"]])
    document.getElementById(id).className = "filter-btn" + (filter === f ? " on" : "");
}

function toggle(name) {
  if (state.owned[name]) delete state.owned[name];
  else state.owned[name] = true;
  save(); render();
}

function addNode() {
  const nameEl = document.getElementById("new-name");
  const group = document.getElementById("new-group").value;
  const name = nameEl.value.trim();
  if (!name) { showToast("Type a node name first."); return; }
  state.custom = state.custom || [];
  state.custom.push({ group: group === "Custom" ? "Custom" : group, name: name, details: "" });
  nameEl.value = "";
  save(); render();
  showToast("Added \"" + name + "\".");
}

async function confirmAndRemove(name) {
  const ok = await askConfirm(
    "Remove custom node?",
    "\"" + name + "\"\n\nThis deletes it from the list permanently.",
    true
  );
  if (!ok) return;
  state.custom = (state.custom || []).filter(c => c.name !== name);
  if (state.owned[name]) delete state.owned[name];
  save(); render();
  closeInfo();
  showToast("Custom node removed.");
}

function setFilter(f) { filter = f; render(); }

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

// =====================================================================
// MODAL — askConfirm but with any number of choices.
// Each choice: { label, value, primary?, destructive? }
// Resolves with the chosen value (null if cancelled/escaped/backdrop).
// =====================================================================
let modalResolve = null;

function askChoice(title, message, choices) {
  return new Promise(resolve => {
    modalResolve = resolve;
    document.getElementById("modal-title").textContent = title;
    document.getElementById("modal-message").textContent = message;
    const btns = document.getElementById("modal-buttons");
    btns.innerHTML = "";
    choices.forEach(c => {
      const b = document.createElement("button");
      b.textContent = c.label;
      b.className = c.primary
        ? ("modal-yes" + (c.destructive ? " destructive" : ""))
        : "modal-no";
      b.onclick = () => closeModal(c.value);
      btns.appendChild(b);
    });
    document.getElementById("modal-overlay").classList.add("open");
  });
}

function askConfirm(title, message, destructive) {
  return askChoice(title, message, [
    { label: "NO", value: false },
    { label: "YES", value: true, primary: true, destructive: !!destructive }
  ]);
}

function closeModal(result) {
  document.getElementById("modal-overlay").classList.remove("open");
  if (modalResolve) { modalResolve(result); modalResolve = null; }
}

document.getElementById("modal-overlay").addEventListener("click", e => {
  if (e.target === document.getElementById("modal-overlay")) closeModal(null);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" &&
      document.getElementById("modal-overlay").classList.contains("open")) {
    closeModal(null);
  }
});

// =====================================================================
// TOAST
// =====================================================================
let toastTimer = null;
function showToast(message) {
  const t = document.getElementById("toast");
  t.textContent = message;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

// =====================================================================
// INIT
// =====================================================================
(async function init() {
  render(); // show structure immediately while auth check runs

  const session = await requireAuth(); // bounces to login if needed
  if (!session) return;
  USER_ID = session.user && session.user.id;

  // migrate old single-user localStorage data to this user's cache once
  const legacy = Store.get(STATE_KEY);
  if (legacy) {
    Store.set(STATE_KEY + ":" + USER_ID, legacy);
    localStorage.removeItem(STATE_KEY);
  }

  const ok = await sync.init();
  render();
})();
</script>
