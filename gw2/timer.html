const LOCAL_DAILY = "gw2-tracker-daily";
const LOCAL_CARRY = "gw2-tracker-daily-carry";
const ROLLOVER_MINS = { furby: 40, dragonstand: 90, island: 45, joras: 40 };

const Store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

let USER_ID = null;

let daily = { epoch: -1, done: {} };
let carry = null;

function normDaily(s) {
  if (!s || typeof s !== "object" || typeof s.epoch !== "number" ||
      !s.done || typeof s.done !== "object") return { epoch: -1, done: {} };
  return { epoch: s.epoch, done: { ...s.done } };
}
function normCarry(s) {
  if (!s || typeof s !== "object" || typeof s.epoch !== "number" ||
      !s.done || typeof s.done !== "object") return null;
  return { epoch: s.epoch, done: { ...s.done } };
}

const sync = createUserSync({
  key: "gw2-tracker-daily",
  sections: ["daily", "carry"],
  loadLocal: () => Store.get("gw2-tracker-daily-cache:" + USER_ID),
  saveLocal: s => Store.set("gw2-tracker-daily-cache:" + USER_ID, s),
  getState: () => ({ daily: daily, carry: carry || { epoch: -1, done: {} } }),
  setState: s => {
    daily = normDaily(s && s.daily);
    carry = normCarry(s && s.carry);
  },
  onRender: () => render(),
  setOnline: (ok, msg) => setSync(ok, msg)
});

function setSync(ok, msg) {
  const el = document.getElementById("sync-note");
  el.textContent = ok ? (msg || "✓") : "offline — changes NOT saved";
  el.classList.toggle("live", !!ok);
}

function dailyEpoch(nowMs) { return Math.floor(nowMs / 86400000); }

function getDailyState(nowMs) {
  const ep = dailyEpoch(nowMs);
  if (daily.epoch !== ep) daily = { epoch: ep, done: {} };
  return daily;
}

function saveDailyState(s) {
  daily = s;
  sync.save();
  Store.set(LOCAL_DAILY, s);
}

function saveCarryState() {
  sync.save();
  if (carry) Store.set(LOCAL_CARRY, carry);
}

function isLogged(tid, nowMs) {
  return getDailyState(nowMs).done[tid] !== undefined;
}

function toggleLog(ev, nowMs) {
  const s = getDailyState(nowMs);
  if (s.done[ev.tid] !== undefined) {
    delete s.done[ev.tid];
    flash("\u2716 unlogged: " + ev.short);
  } else {
    s.done[ev.tid] = prevSlotMs(ev, nowMs);
    flash("\u2714 logged: " + ev.short);
  }
  saveDailyState(s);
}

function prevSlotMs(ev, nowMs) {
  if (!ev.interval && !ev.daily) return nowMs;
  const mu = minutesUntil(ev, nowMs);
  if (mu <= 5) return nowMs + mu * 60000;
  return nowMs - minutesSince(ev, nowMs) * 60000;
}

function logWithRollover(ev, nowMs) {
  const slotMs   = prevSlotMs(ev, nowMs);
  const creditMs = slotMs + ROLLOVER_MINS[ev.tid] * 60000;
  if (dailyEpoch(creditMs) === dailyEpoch(nowMs)) {
    toggleLog(ev, nowMs);
    return;
  }
  const newEp = dailyEpoch(creditMs);
  if (!carry || carry.epoch !== newEp) carry = { epoch: newEp, done: {} };
  if (carry.done[ev.tid] !== undefined) {
    delete carry.done[ev.tid];
    flash("\u2716 unqueued: " + ev.short);
  } else {
    carry.done[ev.tid] = slotMs;
    flash("\u2714 " + ev.short + " finishes after reset \u2014 logged for the NEW day");
  }
  saveCarryState();
}

let selectedEv = null;
let liveChips = [];

function zoneFor(ev, tMs) {
  if (!ev.zones) return ev.zone || "";
  const n = ev.zones.length;
  let idx = Math.round((Math.round(tMs / 60000) - ev.anchor) / ev.interval) % n;
  if (idx < 0) idx += n;
  return ev.zones[idx];
}

function minutesUntil(ev, nowMs) {
  const nowMin = nowMs / 60000;
  if (ev.daily) {
    const dayStart = Math.floor(nowMin / 1440) * 1440;
    let best = Infinity;
    for (let d = 0; d <= 1; d++) {
      for (let i = 0; i < ev.daily.length; i++) {
        const delta = (dayStart + d * 1440 + ev.daily[i]) - nowMin;
        if (delta >= 0 && delta < best) best = delta;
      }
    }
    return best === Infinity ? 0 : best;
  }
  const phase = nowMin % ev.interval;
  let delta = (ev.offset - phase) % ev.interval;
  if (delta < 0) delta += ev.interval;
  return delta;
}

function minutesSince(ev, nowMs) {
  const nowMin = nowMs / 60000;
  if (ev.daily) {
    const dayStart = Math.floor(nowMin / 1440) * 1440;
    let best = Infinity;
    for (let d = -1; d <= 0; d++) {
      for (let i = 0; i < ev.daily.length; i++) {
        const delta = nowMin - (dayStart + d * 1440 + ev.daily[i]);
        if (delta >= 0 && delta < best) best = delta;
      }
    }
    return best === Infinity ? 999 : best;
  }
  const phase = nowMin % ev.interval;
  let since = (phase - ev.offset) % ev.interval;
  if (since < 0) since += ev.interval;
  return since;
}

function nextOccurrences(ev, nowMs, count) {
  const out = [];
  if (ev.daily) {
    const nowMin = nowMs / 60000;
    const dayStart = Math.floor(nowMin / 1440) * 1440;
    const times = ev.daily.slice().sort((a, b) => a - b);
    for (let d = 0; d <= 2 && out.length < count; d++) {
      for (let i = 0; i < times.length && out.length < count; i++) {
        const t = (dayStart + d * 1440 + times[i]) * 60000;
        if (t >= nowMs) out.push(t);
      }
    }
    return out;
  }
  let t = nowMs + minutesUntil(ev, nowMs) * 60000;
  for (let i = 0; i < count; i++) {
    out.push(t);
    t += ev.interval * 60000;
  }
  return out;
}

function fmtClock(ms) {
  const d = new Date(ms);
  let h = d.getHours() % 12; if (h === 0) h = 12;
  const ampm = d.getHours() >= 12 ? "PM" : "AM";
  return h + ":" + String(d.getMinutes()).padStart(2, "0") + " " + ampm;
}
function fmtDay(ms) {
  const d = new Date(ms);
  const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  return days[d.getDay()];
}
function fmtCD(min) {
  const totalSec = Math.max(0, Math.round(min * 60));
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  if (h > 0) return "in " + h + "h " + String(m).padStart(2, "0") + "m";
  return "in " + m + "m " + String(totalSec % 60).padStart(2, "0") + "s";
}
function fmtCDShort(min) {
  const totalSec = Math.max(0, Math.round(min * 60));
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  if (h > 0) return h + "hr " + String(m).padStart(2, "0") + "m";
  return m + "m";
}

function patternFor(ev) {
  if (!ev.interval && !ev.daily) return ev.zone || "untimed";
  let s = "";
  const minPast = ev.offset !== undefined ? ("0" + (ev.offset % 60)).slice(-2) : "";
  if (ev.daily) {
    s = (ev.zone ? ev.zone + " \u00B7 " : "") + ev.daily.length + " spawns daily";
  } else if (ev.zones) {
    s = "every " + (ev.interval / 60) + " hours at :" + minPast +
        " \u00B7 rotates: " + ev.zones.join(" \u2192 ");
  } else {
    s = (ev.zone ? ev.zone + " \u00B7 " : "") +
        "every " + (ev.interval / 60) + " hours at :" + minPast;
  }
  if (ev.heads) s += " \u00B7 " + ev.heads.join(", ") + " together";
  return s;
}

let flashTimer = null;
function flash(msg) {
  const el = document.getElementById("flash-msg");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => el.classList.remove("show"), 1800);
}

function openSchedule(ev, evt) {
  selectedEv = ev;
  const panel = document.getElementById("schedule-panel");
  panel.classList.add("open");
  renderSchedule(Date.now());

  const chipEl = evt && evt.currentTarget ? evt.currentTarget : null;
  if (chipEl) {
    panel.style.transform = "none";
    const r = chipEl.getBoundingClientRect();
    const vw = window.innerWidth, vh = window.innerHeight;
    const pw = panel.offsetWidth, ph = panel.offsetHeight;
    let y;
    if (r.bottom + ph + 16 < vh) y = r.bottom + 10;
    else y = Math.max(14, r.top - ph - 10);
    let x = r.left;
    if (x + pw > vw - 14) x = Math.max(14, vw - pw - 14);
    panel.style.left = x + "px";
    panel.style.top = y + "px";
  }
}
function closeSchedule() {
  selectedEv = null;
  document.getElementById("schedule-panel").classList.remove("open");
}
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeSchedule();
});

function renderSchedule(now) {
  if (!selectedEv) return;
  const ev = selectedEv;
  document.getElementById("sched-name").textContent = ev.name;
  document.getElementById("sched-pattern").textContent = patternFor(ev);

  const list = document.getElementById("sched-list");
  list.innerHTML = "";
    if (!ev.interval && !ev.daily) {
    const row = document.createElement("div");
    row.className = "sched-row";
    row.innerHTML =
      '<span class="sched-when"><b>Reward:</b> <span>' + (ev.reward || "\u2014") + "</span></span>";
    list.appendChild(row);
    return;
  }
  const times = nextOccurrences(ev, now, 6);
  times.forEach((t, i) => {
    const row = document.createElement("div");
    row.className = "sched-row";
    const z = zoneFor(ev, t);
    row.innerHTML =
      '<span class="sched-when"><b>' + fmtClock(t) + "</b>" +
      "<span>" + fmtDay(t) + (z ? " \u00B7 " + z : "") + "</span></span>" +
      '<span class="sched-cd">' + (i === 0 ? fmtCD(minutesUntil(ev, now)) : "") + "</span>";
    list.appendChild(row);
  });
}

function renderChips(containerId, list, now, preserveOrder, isAdhoc) {
  const roster = document.getElementById(containerId);
  roster.innerHTML = "";

  const sorted = preserveOrder || isAdhoc
    ? list.slice()
    : list.slice().sort((a, b) => minutesUntil(a, now) - minutesUntil(b, now));

  sorted.forEach(ev => {
    const logged = isLogged(ev.tid, now);
    const chip = document.createElement("button");
    chip.type = "button";

    let cls = "chip";
    let inner =
      '<span class="dot" style="background:' + ev.color + '"></span>' +
      ev.short;

    if (isAdhoc) {
      cls += (logged ? " logged" : "");
      inner += (logged ? ' <span class="tick">\u2713</span>'
                       : ' <span class="chip-cd">log it</span>');
      chip.title = ev.name + (ev.zone ? " \u2014 " + ev.zone : "") +
                   " \u2014 left-click to log at current time";
    } else {
      const mu = minutesUntil(ev, now);
      const since = minutesSince(ev, now);
      const isActive = since < 15;
      const nextT = now + mu * 60000;
      const z = zoneFor(ev, nextT);
      const cdText = isActive ? "" : fmtCDShort(mu);

      cls += (isActive ? " active" : (mu <= 11 ? " next" : "")) +
             (logged ? " logged" : "") +
             (selectedEv === ev ? " selected" : "");

      inner += ' <span class="chip-cd"' + (isActive ? ' style="display:none"' : '') + '>' + cdText + '</span>' +
              (logged ? ' <span class="tick">\u2713</span>' : "");
      chip.title = ev.name +
        (logged ? " \u2014 logged today (click again to un-log)" : "") +
        "\nLeft-click: log to dailies. Right-click: schedule.";
    }

    chip.className = cls;
    chip.innerHTML = inner;
    chip.onclick = e => {
      e.preventDefault();
      if (ROLLOVER_MINS[ev.tid]) logWithRollover(ev, Date.now());
      else toggleLog(ev, Date.now());
      render();
    };
    chip.oncontextmenu = e => {
      e.preventDefault();
      openSchedule(ev, e);
    };
    liveChips.push({ chip: chip, ev: ev });
    roster.appendChild(chip);
  });
}

function render() {
  const now = Date.now();
  liveChips = [];
  document.getElementById("clock-now").textContent = fmtClock(now);

  renderChips("roster-wb", WORLD_BOSSES, now);
  renderChips("roster-daily", DAILY_BOSSES, now);
  renderChips("roster-conv", CONVERGENCES, now);
  renderChips("roster-meta", METAS, now, true);
  renderChips("roster-misc", MISC, now, true);
  renderChips("roster-adhoc", ADHOC, now, true, true);

  renderSchedule(now);
}

(async function init() {
  const session = await requireAuth();
  if (!session) return;
  USER_ID = session.user && session.user.id;
const cached = Store.get("gw2-tracker-daily-cache:" + USER_ID);
if (cached && cached.daily && cached.daily.epoch === dailyEpoch(Date.now())) {
  daily = normDaily(cached.daily);
  carry = normCarry(cached.carry);
  render();
}
  await sync.init();

  const today = dailyEpoch(Date.now());
  let dirty = false;
  if (daily.epoch !== today) { daily = { epoch: today, done: {} }; dirty = true; }

  const migKey = "gw2-timer-migrated:" + USER_ID;
  if (!Store.get(migKey)) {
    const ld = Store.get(LOCAL_DAILY);
    if (ld && ld.epoch === today && ld.done) {
      for (const k in ld.done) if (daily.done[k] === undefined) daily.done[k] = ld.done[k];
      dirty = true;
    }
    const lc = Store.get(LOCAL_CARRY);
    if (lc && (!carry || lc.epoch >= carry.epoch)) { carry = normCarry(lc); dirty = true; }
    Store.set(migKey, true);
  }

  if (dirty) sync.save(true);

  render();
  setInterval(updateClock, 1000);
  setInterval(render, 60000);
})();

function updateClock() {
  const now = Date.now();
  document.getElementById("clock-now").textContent = fmtClock(now);

  liveChips.forEach(function(entry) {
    const chip = entry.chip, ev = entry.ev;
    if (!ev.interval && !ev.daily) return;
    const mu = minutesUntil(ev, now);
    const since = minutesSince(ev, now);
    const isActive = since < 15;
    chip.classList.toggle("active", isActive);
    chip.classList.toggle("next", !isActive && mu <= 11);
    const cd = chip.querySelector(".chip-cd");
    if (cd) {
      cd.textContent = isActive ? "" : fmtCDShort(mu);
      cd.style.display = isActive ? "none" : "";
    }
  });

  if (selectedEv) renderSchedule(now);
}
</script>
