  .clock b { color: var(--text); }

    display: flex; gap: 6px; border-bottom: 2px solid var(--border);
    margin: 12px 0 16px; flex-wrap: wrap;
  }
  nav.tabs button {
    background: none; border: none; color: var(--dim);
    font-family: inherit; font-size: 0.8rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1.5px;
    padding: 10px 14px; cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -2px;

  nav.tabs button:hover { color: var(--text); }

  .page { display: none; }
  .page.visible { display: block; }
  .section-title {
    font-size: 0.9rem; color: var(--hot-pink); text-transform: uppercase;
    letter-spacing: 1.5px; font-weight: 700; margin: 26px 0 6px;
  }
  .section-note { color: var(--dim); font-size: 0.82rem; margin-bottom: 10px; }
  .section-note b { color: var(--accent2); }
  .roster { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 999px; padding: 10px 18px;
    color: var(--text); font-family: inherit; font-size: 0.95rem;
    cursor: pointer; font-weight: 700;
  }
  .chip .dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .chip:hover { border-color: var(--dim); background: #1d1926; }
  .chip .tick { color: var(--good); font-size: 0.85rem; font-weight: 700; flex-shrink: 0; }
  .chip .stamp-info {
    color: var(--good); font-size: 0.8rem; font-weight: 700; white-space: nowrap;
  }
  .chip .chip-cd { color: var(--accent2); font-size: 0.8rem; font-weight: 400; white-space: nowrap; }
  .chip .chip-zone { color: var(--dim); font-size: 0.75rem; font-weight: 400; white-space: nowrap; }

    box-shadow: 0 0 0 2px rgba(125, 219, 163, 0.30);

  .chip.next { border-color: var(--accent2); }
  .chip.next .chip-cd { font-weight: 700; }

    border-color: var(--now);
    box-shadow: 0 0 0 2px rgb(0, 0, 0);
    animation: pulse 1.6s infinite;
  }
  .chip.active .dot { animation: dotpulse 1.6s infinite; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 2px rgba(248, 0, 0, 0.989); }
    50%      { box-shadow: 0 0 0 4px rgb(255, 0, 0); }
  }
  @keyframes dotpulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.35); }
  }
  .chip.warn { border-color: var(--now); }
  .chip .warn-flag { color: var(--now); font-size: 0.72rem; font-weight: 700; white-space: nowrap; }

  .info-wp:hover { border-color: var(--accent); }
  .schedule-panel {
    display: none; position: fixed; z-index: 100;
    width: min(560px, calc(100vw - 40px));
    background: var(--panel); border: 1px solid var(--accent2);
    border-radius: 10px; padding: 18px 20px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.65);
  }
  .schedule-panel.open { display: block; }
  .sched-head {
    display: flex; justify-content: space-between; align-items: baseline;

  .sched-name { font-size: 1.05rem; font-weight: 700; color: var(--accent2); }

    background: none; border: none; color: var(--dim); cursor: pointer;

  .sched-close:hover { color: #ff8a8a; }

    display: flex; justify-content: space-between; gap: 16px;

  .sched-cd { color: var(--accent2); font-weight: 700; white-space: nowrap; }

    background: var(--panel); border: 1px solid var(--border); border-radius: 4px;

  if (h > 0) return "in " + h + "h " + String(m).padStart(2, "0") + "m";

function minutesUntil(ev, nowMs) {
  const nowMin = nowMs / 60000;
  if (ev.daily) {
    const dayStart = Math.floor(nowMin / 1440) * 1440;
    let best = Infinity;
    for (let d = 0; d <= 1; d++) {
      for (let i = 0; i < ev.daily.length; i++) {
        const delta = (dayStart + d * 1440 + ev.daily[i]) - nowMin;
        if (delta >= 0 && delta < best) best = delta;
      }
    }
    return best === Infinity ? 0 : best;
  }
  const phase = nowMin % ev.interval;
  let delta = (ev.offset - phase) % ev.interval;
  if (delta < 0) delta += ev.interval;
  return delta;
}
function minutesSince(ev, nowMs) {
  const nowMin = nowMs / 60000;
  if (ev.daily) {
    const dayStart = Math.floor(nowMin / 1440) * 1440;
    let best = Infinity;
    for (let d = -1; d <= 0; d++) {
      for (let i = 0; i < ev.daily.length; i++) {
        const delta = nowMin - (dayStart + d * 1440 + ev.daily[i]);
        if (delta >= 0 && delta < best) best = delta;
      }
    }
    return best === Infinity ? 999 : best;
  }
  const phase = nowMin % ev.interval;
  let since = (phase - ev.offset) % ev.interval;
  if (since < 0) since += ev.interval;
  return since;

function nextOccurrences(ev, nowMs, count) {
  const out = [];

    const nowMin = nowMs / 60000;
    const dayStart = Math.floor(nowMin / 1440) * 1440;
    const times = ev.daily.slice().sort((a, b) => a - b);
    for (let d = 0; d <= 2 && out.length < count; d++) {
      for (let i = 0; i < times.length && out.length < count; i++) {
        const t = (dayStart + d * 1440 + times[i]) * 60000;
        if (t >= nowMs) out.push(t);

    }
    return out;
  }
  let t = nowMs + minutesUntil(ev, nowMs) * 60000;

    s = "every " + (ev.interval / 60) + " hours at :" + minPast +

  } else {
    s = (ev.zone ? ev.zone + " \u00B7 " : "") +

function zoneFor(ev, tMs) {
  if (!ev.zones) return ev.zone || "";

function wpFor(ev, tMs) {
  if (!ev.wps) return "";

function logDailyEv(name, tid, ev, nowMs, remove) {
  const slotMs = evPrevMs(ev, nowMs);
  const creditMs = slotMs + ROLLOVER_MINS[tid] * 60000;
  if (dailyEpoch(creditMs) === dailyEpoch(nowMs)) {
    trackerToggleLog(name, tid, nowMs, false, slotMs, remove);
    return;
  }
  let carryNow = loadState(KEY_CARRY) || {};
  const newEp = dailyEpoch(creditMs);
  if (carryNow.epoch !== newEp) carryNow = { epoch: newEp, done: {} };
  if (remove) {
    if (carryNow.done[tid] === undefined) { flash("\u2716 nothing queued: " + name); return; }
    delete carryNow.done[tid];
    flash("\u2716 unqueued: " + name);

    if (carryNow.done[tid] !== undefined) {
      flash("\u2714 already queued for the NEW day \u2014 shift-click to unqueue");
      return;
    }
    carryNow.done[tid] = slotMs;
    flash("\u2714 " + name + " finishes after reset \u2014 logged for the NEW day");
  }
  saveState(KEY_CARRY, carryNow);
}

      '<span class="sched-when"><b>' + fmtClock(t) + "</b>" +
      "<span>" + fmtDay(t) + (z ? " \u00B7 " + z : "") + "</span></span>" +
      '<span class="sched-cd">' + (i === 0 ? fmtCD(minutesUntil(ev, now)) : "") + "</span>";
    if (wp) row.insertBefore(wpBtn(wp), row.lastElementChild);
    list.appendChild(row);
  });
}
function renderChips(containerId, list, now, preserveOrder, isAdhoc) {
  const roster = document.getElementById(containerId);
  roster.innerHTML = "";
  const sorted = preserveOrder || isAdhoc
    ? list.slice()
    : list.slice().sort((a, b) => minutesUntil(a, now) - minutesUntil(b, now));
  sorted.forEach(ev => {
    const chip = document.createElement("button");
    chip.type = "button";
    let cls = "chip";
    let inner =
      '<span class="dot" style="background:' + ev.color + '"></span>' +
      ev.short;
    if (isAdhoc) {
      const n = ev.multi ? getLogs(ev.tid, now).length : (evIsLogged(ev.tid, now) ? 1 : 0);
      const logged = n > 0;
      cls += (logged ? " logged" : "");
      inner += (logged
        ? ' <span class="tick">\u2713' + (ev.multi ? " \u00D7" + n : "") + '</span>'
        : ' <span class="chip-cd">log it</span>');
      if (ev.multi) {
        chip.title = ev.name + (ev.zone ? " \u2014 " + ev.zone : "") +
          "\nLeft-click: +1 log. Shift-click: remove last log. Right-click: details.";
      } else {
        chip.title = ev.name + (ev.zone ? " \u2014 " + ev.zone : "") +
                     " \u2014 left-click to log at current time";
      }
    } else {
      const logsN = ev.multi ? getLogs(ev.tid, now).length : 0;
      const logged = ev.multi ? logsN > 0 : evIsLogged(ev.tid, now);
      const mu = minutesUntil(ev, now);
      const since = minutesSince(ev, now);
      const isActive = since < 15;
      const nextT = now + mu * 60000;
      const z = zoneFor(ev, nextT);
      const cdText = isActive ? "" : fmtCDShort(mu);
      cls += (isActive ? " active" : (mu <= 11 ? " next" : "")) +
             (logged ? " logged" : "") +
             (selectedEv === ev ? " selected" : "");
      inner += ' <span class="chip-cd"' + (isActive ? ' style="display:none"' : '') + '>' + cdText + '</span>' +
              (logged ? ' <span class="tick">\u2713' + (ev.multi ? " \u00D7" + logsN : "") + '</span>' : "");
      if (ev.multi) {
        chip.title = ev.name + " \u2014 \u00D7" + logsN + " logged today" +
          "\nLeft-click: +1 log. Shift-click: remove last log. Right-click: schedule & log list.";
      } else {
        chip.title = ev.name +
          (logged ? " \u2014 logged today (click again to un-log)" : "") +
          "\nLeft-click: log to dailies. Right-click: schedule.";
      }
    }
    chip.className = cls;
    chip.innerHTML = inner;
    chip.onclick = e => {
      e.preventDefault();
      if (ev.multi) evToggleLogMulti(ev, Date.now(), e.shiftKey);
      else evToggleLog(ev.short, ev.tid, Date.now(), e.shiftKey);
      render();
    };
    chip.oncontextmenu = e => {
      e.preventDefault();
      openSchedule(ev, e);
    };
    liveChips.push({ chip: chip, ev: ev });
    roster.appendChild(chip);
  });
}
function evToggleLogMulti(ev, nowMs, removeLast) {
  if (removeLast) { removeLastLog(ev.short, ev.tid, nowMs); return; }
  const slot = (ev.interval || ev.daily) ? evPrevMs(EVS[ev.tid] || ev, nowMs) : nowMs;
  const s = getFreshState(KEY_DAILY, dailyEpoch(nowMs));
  const arr = logsFor(ev.tid, nowMs).slice();
  arr.push(ev.tid === "fractalincursion" ? incursionSlotMs(nowMs) : slot);
  s.done[ev.tid] = arr;
  flash("\u2714 logged: " + ev.short + " \u2014 \u00D7" + arr.length + " today");
  saveState(KEY_DAILY, s);
}
let infoTask = null;
function openInfo(task, evt, isWeekly) {
  infoTask = { t: task, isWeekly: isWeekly };
  const now = Date.now();
  const panel = document.getElementById("info-panel");
  document.getElementById("info-name").textContent = task.name;
  const lines = document.getElementById("info-lines");
  lines.innerHTML = "";
  function line(html, cls) {
    const div = document.createElement("div");
    div.className = "info-line" + (cls ? " " + cls : "");
    div.innerHTML = html;
    lines.appendChild(div);
  }
  if (task.zone) line('<span class="lab">Where:</span> <b>' + task.zone + '</b>');
  if (task.reward) line('<span class="lab">Reward:</span> ' + task.reward);
  if (isWeekly) {
    if (task.rotating) {
      const wk = isoWeek(now);
      const weekData = WEEKS[wk] || null;
      const text = weekData ? weekData[task.rotating] : null;
      if (text) {
        line('<span class="lab">This week (' + wk + '):</span> ' + text);
      } else {
        line('no objective listed for week ' + wk + ' yet (blank weeks in your sheet)', 'missing');
      }
    } else if (task.objective) {
      line('<span class="lab">Objective:</span> ' + task.objective);
    }
  }
  if (task.isGhost) {
    line('<span class="lab">Picked up today</span> \u2014 logged from the Event Timers tab; vanishes at the daily reset.');
  }
  const ev = (!isWeekly && task.ev) ? EVS[task.id] : null;
  if (ev) {
    const pat = ev.daily
      ? "fixed daily spawns (UTC)"
      : "every " + (ev.interval / 60) + " hours";
    line('<span class="lab">Schedule:</span> ' + pat + (ev.map ? " \u00B7 rotates: " + NAKED_MAPS.join(" \u2192 ") : ""));
  }
  const tsRaw = loggedStamp(task.id, now, isWeekly);
  const logs  = Array.isArray(tsRaw) ? tsRaw.slice().sort((a, b) => a - b)
               : (typeof tsRaw === "number" && !isNaN(tsRaw) ? [tsRaw] : []);
  if (logs.length) {
    if (!isWeekly && isMulti(task.id)) {
      line('<span class="lab">Status:</span> <b style="color:var(--good)">' +
           'done \u00D7' + logs.length + ' today</b>');
      logs.forEach(l => {
        const wp = (task.id === "fractalincursion") ? incursionWp(l) : "";
        let txt = fmtClock(l);
        if (task.id === "fractalincursion") txt += " \u00B7 " + incursionZone(l);
        const row = document.createElement("div");
        row.className = "info-line";
        const del = document.createElement("button");
        del.type = "button";
        del.className = "info-del";
        del.textContent = "\u2716";
        del.title = "remove this log";
        del.onclick = () => { removeLogAt(task.name, task.id, l, Date.now()); closeInfo(); };
        row.appendChild(del);
        const label = document.createElement("b");
        label.textContent = txt;
        row.appendChild(label);
        if (wp) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "info-wp";
          btn.textContent = wp;
          btn.title = "click to copy, then paste in GW2 chat";
          btn.onclick = e => {
            e.stopPropagation();
            navigator.clipboard.writeText(wp).then(
              () => flash("\u2713 copied " + wp + " \u2014 paste it in-game"),
              () => flash("copy blocked \u2014 select the text manually")
            );
          };
          row.appendChild(btn);
        }
        lines.appendChild(row);
      });
    } else {
      const ts = logs[0];
      let stampTxt;
      if (isWeekly) {
        const d = new Date(ts);
        const days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
        const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
        stampTxt = "done " + days[d.getDay()] + " " + months[d.getMonth()] + " " + d.getDate() +
                   " @ " + fmtClock(ts);
      } else {
        stampTxt = "done @ " + fmtClock(ts);
      }
      if (!isWeekly && task.id === "nakedman") stampTxt += " \u00B7 " + nakedMap(ts);
      if (!isWeekly && dailyEpoch(ts) < dailyEpoch(now)) stampTxt += "  (yesterday)";
      line('<span class="lab">Status:</span> <b style="color:var(--good)">' + stampTxt + '</b>');
    }
  } else if (ev) {
    const nx = evNextMs(ev, now);
    let nextTxt = "next @ " + fmtClock(nx);
    if (task.id === "nakedman") nextTxt += " \u00B7 " + nakedMap(nx);
    line('<span class="lab">Status:</span> ' + nextTxt);
  }
  panel.classList.add("open");
  const chipEl = evt && evt.currentTarget ? evt.currentTarget : null;
  if (chipEl) {
    const r = chipEl.getBoundingClientRect();
    const vw = window.innerWidth, vh = window.innerHeight;
    const pw = panel.offsetWidth, ph = panel.offsetHeight;
    let y = r.bottom + 10;
    if (y + ph > vh - 14) y = Math.max(14, r.top - ph - 10);
    let x = r.left;
    if (x + pw > vw - 14) x = Math.max(14, vw - pw - 14);
    panel.style.left = x + "px";
    panel.style.top = y + "px";
  }
}
function closeInfo() {
  infoTask = null;
  document.getElementById("info-panel").classList.remove("open");
}
function tooltipFor(task, isWeekly, nowMs) {
  let tip = task.name;
  if (task.zone) tip += "\nWhere: " + task.zone;
  if (task.reward) tip += "\nReward: " + task.reward;
  if (isWeekly && task.rotating) {
    const wk = isoWeek(nowMs);
    const wd = WEEKS[wk] || null;
    tip += wd && wd[task.rotating]
      ? "\nThis week (" + wk + "): " + wd[task.rotating]
      : "\n!! no objective listed for week " + wk + " (fill it in)";
  } else if (isWeekly && task.objective) {
    tip += "\nObjective: " + task.objective;
  }
  tip += "\nLeft-click: log. Shift-click: unlog/remove last. Right-click: details.";
  return tip;
}
function cdSpanHtml(t, now) {
  const ev = EVS[t.id];
  const since = minsSinceSpawn(ev, now);
  if (since < 15) {
    return ' <span class="chip-cd live-cd" data-ev="' + t.id +
           '" style="color:var(--now);font-weight:700">Active NOW</span>';
  }
  const nx = evNextMs(ev, now);
  let nextTxt = "next @ " + fmtClock(nx);
  if (t.id === "nakedman") nextTxt += " \u00B7 " + nakedMap(nx);
  return ' <span class="chip-cd live-cd" data-ev="' + t.id + '">' + nextTxt + '</span>';
}
function renderDailyChips(now) {
  const roster = document.getElementById("roster-daily");
  roster.innerHTML = "";
  const s = getFreshState(KEY_DAILY, dailyEpoch(now));
  DAILIES.forEach(t => {
    const ts = s.done[t.id];
    const ev = t.ev ? EVS[t.id] : null;
    const chip = document.createElement("button");
    chip.type = "button";
    const since = (ts === undefined && ev) ? minsSinceSpawn(ev, now) : null;
    chip.className = "chip" +
      (ts !== undefined ? " logged" : "") +
      (since !== null && since < 15 ? " active" : "");
    let inner = '<span class="dot" style="background:' + t.color + '"></span>' + t.name;
    if (ts !== undefined) {
      let stampTxt = fmtClock(ts);
      if (t.id === "nakedman") stampTxt += " \u00B7 " + nakedMap(ts);
      inner += ' <span class="tick">\u2713</span><span class="stamp-info">@ ' + stampTxt + '</span>';
      if (dailyEpoch(ts) < dailyEpoch(now)) {
        inner += ' <span class="chip-cd" style="color:var(--accent2)">(yesterday)</span>';
      }
    } else if (ev) {
      if (since !== null && since < 15) {
        /* active window: no countdown text, chip pulses via .active */
      } else {
        inner += cdSpanHtml(t, now);
      }
    } else if (t.zone) {
      inner += ' <span class="chip-zone">@ ' + t.zone + '</span>';
    }
    chip.innerHTML = inner;
    chip.title = tooltipFor(t, false, now);
    chip.onclick = e => {
      e.preventDefault();
      if (ev && ROLLOVER_MINS[t.id]) {
        logDailyEv(t.name, t.id, ev, Date.now(), e.shiftKey);
      } else if (e.shiftKey) {
        trackerToggleLog(t.name, t.id, Date.now(), false, undefined, true);
      } else {
        const stamp = ev ? evPrevMs(ev, Date.now()) : undefined;
        trackerToggleLog(t.name, t.id, Date.now(), false, stamp, false);
      }
      render();
    };
    chip.oncontextmenu = e => { e.preventDefault(); openInfo(t, e, false); };
    roster.appendChild(chip);
  });
  return Object.keys(s.done).filter(k => DAILIES.some(d => d.id === k)).length + " of " + DAILIES.length + " done";
}
function renderGhosts(now) {
  const block = document.getElementById("ghost-block");
  block.innerHTML = "";
  const s = getFreshState(KEY_DAILY, dailyEpoch(now));
  const dailyIds = {};
  DAILIES.forEach(t => { dailyIds[t.id] = true; });
  const ghosts = Object.keys(s.done)
    .filter(tid => !dailyIds[tid])
    .map(tid => {
      const v = s.done[tid];
      const arr = Array.isArray(v) ? v.slice().sort((a, b) => a - b) : [v];
      return { tid: tid, ts: arr[arr.length - 1], logs: arr };
    })
    .sort((a, b) => a.ts - b.ts);
  if (ghosts.length === 0) return;
  const roster = document.createElement("div");
  roster.className = "roster";
  block.appendChild(roster);
  ghosts.forEach(g => {
    const x = EXTRAS[g.tid] || { name: g.tid, zone: "logged from Event Timers" };
    const multi = isMulti(g.tid);
    let stamp = fmtClock(g.ts);
    if (g.tid === "fractalincursion") stamp += " \u00B7 " + incursionZone(g.ts);
    let tick = ' <span class="tick">\u2713</span>';
    if (multi && g.logs.length > 1) tick = ' <span class="tick">\u2713 \u00D7' + g.logs.length + '</span>';
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "chip ghost logged";
    chip.innerHTML = '<span class="dot" style="background:' + (x.color || "#5fd3c4") + '"></span>' +
                     x.name + tick + '<span class="stamp-info">@ ' + stamp + '</span>';
    let tip = x.name + "\nWhere: " + (x.zone || "?");
    if (x.reward) tip += "\nReward: " + x.reward;
    tip += "\nLeft-click: log. Shift-click: remove last. Right-click: details.";
    chip.title = tip;
    const ghostTask = { id: g.tid, name: x.name, zone: x.zone || "",
                        reward: x.reward || "", isGhost: true };
    chip.onclick = e => {
      e.preventDefault();
      if (multi) {
        if (e.shiftKey) removeLastLog(x.name, g.tid, Date.now());
        else toggleLogMulti(x.name, g.tid, Date.now());
      } else if (e.shiftKey) {
        removeLastLog(x.name, g.tid, Date.now());
      } else {
        trackerToggleLog(x.name, g.tid, Date.now(), false, undefined, false);
      }
    };
    chip.oncontextmenu = e => { e.preventDefault(); openInfo(ghostTask, e, false); };
    roster.appendChild(chip);
  });
}
function renderWeeklyChips(now) {
  const roster = document.getElementById("roster-weekly");
  roster.innerHTML = "";
  const s = getFreshState(KEY_WEEKLY, weeklyEpoch(now));
  const wk = isoWeek(now);
  const weekData = WEEKS[wk] || null;
  let doneCount = 0;
  WEEKLIES.forEach(t => {
    const ts = s.done[t.id];
    if (ts !== undefined) doneCount++;
    const missing = t.rotating && !(weekData && weekData[t.rotating]);
    const chip = document.createElement("button");
    chip.className = "chip" + (ts !== undefined ? " logged" : "") + (missing ? " warn" : "");
    let inner = '<span class="dot" style="background:#148eb4"></span>' + t.name;
    if (ts !== undefined) {
      inner += ' <span class="tick">\u2713</span>';
    } else if (missing) {
      inner += ' <span class="warn-flag">no objective for wk ' + wk + '</span>';
    }
    chip.innerHTML = inner;
    chip.title = tooltipFor(t, true, now);
    chip.onclick = e => {
      e.preventDefault();
      trackerToggleLog(t.name, t.id, Date.now(), true, undefined, e.shiftKey);
      render();
    };
    chip.oncontextmenu = e => { e.preventDefault(); openInfo(t, e, true); };
    roster.appendChild(chip);
  });
  const pct = WEEKLIES.length ? (doneCount / WEEKLIES.length) * 100 : 0;
  const bar = document.getElementById("weekly-bar");
  bar.style.width = pct + "%";
  bar.className = "progress-inner" + (pct === 100 ? " full" : "");
  lastWeeklyCounts = { done: doneCount, total: WEEKLIES.length };
  return lastWeeklyCounts;
}
function render() {
  const now = Date.now();
  liveChips = [];
  document.getElementById("clock-now").textContent = fmtClock(now);
  renderChips("roster-wb", WORLD_BOSSES, now);
  renderChips("roster-hardwb", DAILY_BOSSES, now);
  renderChips("roster-conv", CONVERGENCES, now);
  renderChips("roster-meta", METAS, now);
  renderChips("roster-misc", MISC, now);
  renderChips("roster-adhoc", ADHOC, now, true, true);
  document.getElementById("daily-meta").innerHTML =
    "resets in <b>" + fmtDur(nextDailyReset(now) - now) + "</b>";
  renderDailyChips(now);
  renderGhosts(now);
  const w = renderWeeklyChips(now);
  document.getElementById("weekly-meta").innerHTML =
    "Week " + isoWeek(now) + " \u00B7 " + w.done + " of " + w.total + " done" +
    " \u00B7 resets in <b>" + fmtDur(nextWeeklyReset(now) - now) + "</b>";
  renderSchedule(now);
}
(async function init() {
  const session = await requireAuth();
  if (!session) return;
  USER_ID = session.user && session.user.id;
  if (!USER_ID) return;
  rolloverLocked = true;
  const dc = Store.get(DAILY_CLOUD_KEY + ":" + USER_ID);
  const wc = Store.get(WEEKLY_CLOUD_KEY + ":" + USER_ID);
  if (dc) dailyState = normalizeDailyState(dc);
  if (wc) weeklyState = normalizeWeeklyState(wc);
  render();
  await dailySync.init();
  await weeklySync.init();
  await historySync.init();
  historySyncReady = true;
  /* --- legacy history migration: two-pass, server-verified, entry-by-entry --- */
  /* PASS 1: if a previous visit marked legacy keys as adopted, delete them ONLY
     after confirming Supabase's own copy contains EVERY day and EVERY task
     entry from the old history — not merely that the year key exists. */
  const legacyMarker = Store.get("gw2-legacy-history-keys");
  if (Array.isArray(legacyMarker) && legacyMarker.length) {
    let serverLogs = null;
    try {
      const remote = await loadUserState(HISTORY_CLOUD_KEY, null);
      serverLogs = remote && remote.state ? remote.state.logs : null;
    } catch (e) { serverLogs = null; }
    if (serverLogs && typeof serverLogs === "object") {
      let allSafe = true;
      for (const key of legacyMarker) {
        if (!allSafe) break;
        const year = key.slice(-4);
        const legacyYear = Store.get(key);
        if (!legacyYear || typeof legacyYear !== "object") continue; /* nothing left to protect */
        const srvYear = serverLogs[year];
        if (!srvYear || typeof srvYear !== "object") { allSafe = false; break; }
        for (const day of Object.keys(legacyYear)) {
          const legacyDay = legacyYear[day];
          if (!legacyDay || typeof legacyDay !== "object") continue;
          const srvDay = srvYear[day];
          if (!srvDay || typeof srvDay !== "object") { allSafe = false; break; }
          for (const tid in legacyDay) {
            if (srvDay[tid] === undefined) { allSafe = false; break; }
          }
          if (!allSafe) break;
        }
      }
      if (allSafe) {
        legacyMarker.forEach(key => localStorage.removeItem(key));
        Store.set("gw2-legacy-history-keys", null);
      }
    }
  }
  /* PASS 2: adopt any not-yet-adopted legacy keys by merging
     entry-by-entry into historyLogs, then mark them for later deletion. */
  const legacyYearKeys = [];
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (/^gw2-daily-log-\d{4}$/.test(key)) legacyYearKeys.push(key);
  }
  let adoptedAny = false;
  for (const key of legacyYearKeys) {
    const year = key.slice(-4);
    const legacyYear = Store.get(key);
    if (legacyYear && typeof legacyYear === "object") {
      historyLogs[year] = historyLogs[year] || {};
      for (const day of Object.keys(legacyYear)) {
        if (!legacyYear[day] || typeof legacyYear[day] !== "object") continue;
        historyLogs[year][day] = historyLogs[year][day] || {};
        const merged = historyLogs[year][day];
        for (const tid in legacyYear[day]) {
          if (merged[tid] === undefined) merged[tid] = legacyYear[day][tid];
        }
      }
      adoptedAny = true;
    }
  }
  if (adoptedAny) {
    historySync.save(true);
    const marker = Array.isArray(legacyMarker) ? legacyMarker.slice() : [];
    legacyYearKeys.forEach(key => { if (!marker.includes(key)) marker.push(key); });
    Store.set("gw2-legacy-history-keys", marker);
  }
  rolloverLocked = false;
  const nowMs = Date.now();
  getFreshState(KEY_DAILY, dailyEpoch(nowMs));
  getFreshState(KEY_WEEKLY, weeklyEpoch(nowMs));
  render();
  setInterval(updateClock, 1000);
  setInterval(render, 60000);
})();
function updateClock() {
  const now = Date.now();
  document.getElementById("clock-now").textContent = fmtClock(now);
  document.getElementById("daily-meta").innerHTML =
    "resets in <b>" + fmtDur(nextDailyReset(now) - now) + "</b>";
  const w = lastWeeklyCounts;
  document.getElementById("weekly-meta").innerHTML =
    "Week " + isoWeek(now) + " \u00B7 " + w.done + " of " + w.total + " done" +
    " \u00B7 resets in <b>" + fmtDur(nextWeeklyReset(now) - now) + "</b>";
  liveChips.forEach(function(entry) {
    const chip = entry.chip, ev = entry.ev;
    if (!ev.interval && !ev.daily) return;
    const mu = minutesUntil(ev, now);
    const since = minutesSince(ev, now);
    const isActive = since < 15;
    chip.classList.toggle("active", isActive);
    chip.classList.toggle("next", !isActive && mu <= 11);
    const cd = chip.querySelector(".chip-cd");
    if (cd) {
      cd.textContent = isActive ? "" : fmtCDShort(mu);
      cd.style.display = isActive ? "none" : "";
    }
  });
  document.querySelectorAll(".live-cd").forEach(span => {
    const t = TASK_BY_ID[span.dataset.ev];
    if (!t || !t.ev) return;
    const ev = EVS[t.id];
    const since = minsSinceSpawn(ev, now);
    if (since < 15) {
      span.textContent = "Active NOW";
      span.style.color = "var(--now)";
      span.style.fontWeight = "700";
    } else {
      const nx = evNextMs(ev, now);
      let txt = "next @ " + fmtClock(nx);
      if (t.id === "nakedman") txt += " \u00B7 " + nakedMap(nx);
      span.textContent = txt;
      span.style.color = "";
      span.style.fontWeight = "";
    }
  });
  if (selectedEv) renderSchedule(now);
}
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeSchedule(); closeInfo(); }
});
