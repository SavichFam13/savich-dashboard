<style>
  :root {
    --bg: #121016;
    --panel: #1c1922;
    --text: #f2eef7;
    --accent: #c9a0ff;
    --accent2: #5fd3c4;
    --dim: #a89bbd;
    --border: #332c3e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: Verdana, Geneva, Tahoma, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    padding: 40px 20px;
    max-width: 1060px;

  .top {
    display: flex; justify-content: space-between; align-items: baseline;
    flex-wrap: wrap; gap: 12px; margin-bottom: 6px;
  }
  h1 { font-size: 1.5rem; color: var(--accent); margin-bottom: 10px; letter-spacing: 0.5px; }
  .nav-bar { display: flex; gap: 8px; flex-wrap: wrap; }
  .nav-btn {
    background: var(--panel); border: 1px solid var(--border); color: var(--dim);
    text-decoration: none; padding: 6px 14px; border-radius: 8px;
    font-size: 0.85rem; font-weight: 600; transition: all 0.2s ease;
  }
  .nav-btn:hover { border-color: var(--accent); color: var(--accent); }
  .nav-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  p.sub { color: var(--dim); margin-bottom: 34px; font-size: 0.9rem; }
  h2.section {
    font-size: 0.75rem; letter-spacing: 2px; color: var(--accent2);
    text-transform: uppercase; margin: 0 0 16px 0; font-weight: 700;
  }
  .nav-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(295px, 1fr));
    gap: 20px;
    margin-bottom: 46px;
  }
  .nav-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 24px; text-decoration: none; color: var(--text);
    transition: transform 0.15s ease, border-color 0.15s ease; display: block;
  }
  .nav-card:hover { transform: translateY(-3px); border-color: var(--accent); }
  .nav-card h3 { font-size: 1.05rem; color: var(--accent); margin-bottom: 9px; }
  .nav-card p { font-size: 0.83rem; color: var(--dim); margin: 0; line-height: 1.55; }
  .note { font-size: 0.73rem; color: var(--dim); padding-top: 20px; border-top: 1px solid var(--border); }

<script>
window.Store = {
  get(key) {
    try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; }
  },
  set(key, val) { localStorage.setItem(key, JSON.stringify(val)); },
  del(key) { localStorage.removeItem(key); }
};
