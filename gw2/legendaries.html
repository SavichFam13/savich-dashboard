<style>

  .phase:last-child { margin-bottom: 0; }

    display: flex; align-items: baseline; gap: 10px; cursor: pointer;

  .item-row { display: flex; align-items: flex-start; gap: 8px; flex-wrap: wrap; }
  .chk {

  .lbl.has-subs { color: var(--accent); font-weight: 700; }
  .chk:checked + .lbl { color: var(--good); text-decoration: line-through; }

  .empty-msg { color: var(--dim); font-size: 0.85rem; padding: 30px 0; text-align: center; }

<script>
const Store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { localStorage.setItem(k, JSON.stringify(v)); }
};
const KEY = "gw2-legendaries";
let legs = [];
let USER_ID = null;
const sync = createUserSync({
  key: KEY,
  sections: ["legs"],
  loadLocal: () => Store.get(KEY + ":" + USER_ID),
  saveLocal: (s) => Store.set(KEY + ":" + USER_ID, s),
  getState: () => ({ legs: legs }),
  setState: (s) => { legs = normalizeLegs(s && s.legs); },
  onRender: () => render(),
  setOnline: (ok, msg) => setSync(ok, msg)
});
function setSync(ok, msg) {
  const el = document.getElementById("sync-note");
  el.textContent = ok ? (msg || "✓") : "offline — changes NOT saved";
  el.classList.toggle("live", !!ok);
}
function normalizeLegs(arr) {
  return (Array.isArray(arr) ? arr : [])
    .filter(l => l && (l.phases || l.steps))
    .map(l => {
      if (!l.phases) l.phases = [{ title: "Steps", sub: "", items: l.steps }];
      l.phases.forEach(p => { if (typeof p.open !== "boolean") p.open = false; });
      return l;
    });
}
function save(immediate) { sync.save(immediate); }
let modalCb = null;
function askModal(opts) {
  const ov = document.getElementById("modal-overlay");
  const yesBtn = document.getElementById("modal-yes");
  const inputRow = document.getElementById("modal-input-row");
  const input = document.getElementById("modal-input");
  document.getElementById("modal-title").textContent = opts.title || "Are you sure?";
  document.getElementById("modal-text").textContent = opts.text || "";
  yesBtn.textContent = opts.yes || "YES";
  document.getElementById("modal-no").textContent = opts.no || "NO";
  yesBtn.classList.toggle("safe", !opts.danger);
  if (opts.inputLabel !== undefined) {
    inputRow.classList.add("show");
    input.placeholder = opts.inputLabel;
    input.value = opts.inputDefault || "";
  } else {
    inputRow.classList.remove("show");
    input.value = "";
  }
  modalCb = opts.onYes || null;
  ov.classList.add("open");
  if (opts.inputLabel !== undefined) setTimeout(() => input.focus(), 50);
}
function closeModal() {
  document.getElementById("modal-overlay").classList.remove("open");
  modalCb = null;
}
document.getElementById("modal-yes").onclick = () => {
  const cb = modalCb;
  const val = document.getElementById("modal-input").value;
  closeModal();
  if (cb) cb(val);
};
document.getElementById("modal-no").onclick = closeModal;
document.getElementById("modal-overlay").addEventListener("click", e => {
  if (e.target === e.currentTarget) closeModal();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeModal();
  if (e.key === "Enter" && document.getElementById("modal-overlay").classList.contains("open")
      && document.getElementById("modal-input-row").classList.contains("show")) {
    document.getElementById("modal-yes").click();
  }
});

function snapshot(phases) {
  return JSON.parse(JSON.stringify(phases)).map(p => ({
    title: p.title,
    sub: p.sub || "",
    open: false,
    items: (p.items || []).map(function cp(it) {
      const c = { label: it.label, done: !!it.done };
      if (it.qty) c.qty = it.qty;
      if (it.subs) c.subs = it.subs.map(cp);
      return c;
    })
  }));
}
function isDone(it) {
  if (it.subs && it.subs.length) return it.subs.every(isDone);
  return !!it.done;
}
function countLeaves(arr) {
  let n = 0, d = 0;
  (arr || []).forEach(it => {
    if (it.subs && it.subs.length) {
      const r = countLeaves(it.subs); n += r.n; d += r.d;
    } else { n++; if (it.done) d++; }
  });
  return { n, d };
}
const tplSel = document.getElementById("leg-template");
for (const k in TEMPLATES) {
  const o = document.createElement("option");
  o.value = k; o.textContent = TEMPLATES[k].label;
  tplSel.appendChild(o);
}
function updHint() {
  document.getElementById("tpl-hint").innerHTML =
    "&#9432; " + TEMPLATES[tplSel.value].hint;
}
tplSel.onchange = updHint;

function addLegend() {
  const tpl = TEMPLATES[tplSel.value];
  if (!tpl) return;
  const name = tpl.label.replace(/\s*\(.*?\)(\s*—.*)?$/, "").trim() || tpl.label;
  const phases = snapshot(tpl.phases);
  phases[0].open = true;
  legs.unshift({ id: "l" + Date.now(), name: name, kind: tpl.label, phases: phases });
  save(); render();
}
function delLegend(li) {
  askModal({
    title: "Remove " + legs[li].name + "?",
    text: "Its checklist progress goes with it. This can't be undone.",
    danger: true,
    yes: "DELETE",
    no: "KEEP IT",
    onYes: () => {
      legs.splice(li, 1);
      save(); render();
    }
  });
}
function toggleAt(li, pi, path, checked) {
  const arr = legs[li].phases[pi].items;
  const idxs = path.split(".").map(Number);
  let node = arr[idxs[0]];
  for (let i = 1; i < idxs.length; i++) node = node.subs[idxs[i]];
  node.done = checked;
  save(); render();
}

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function fmtQty(q) { return q ? "<span class='qty'>" + esc(q) + "</span> " : ""; }
function itemHtml(item, li, pi, path) {
  const hasSubs = !!(item.subs && item.subs.length);
  const done = isDone(item);
  const uid = "subs-" + li + "-" + pi + "-" + path.replace(/\./g, "-");
  let h = "<li class='item'><div class='item-row'>";
  h += "<input type='checkbox' class='chk' data-li='" + li + "' data-pi='" + pi +
       "' data-path='" + path + "'" + (done ? " checked" : "") +
       (hasSubs ? " disabled title='auto-checks when all ingredients are done'" : "") + ">";
  h += "<span class='lbl" + (hasSubs ? " has-subs" : "") + "'>" + fmtQty(item.qty) + esc(item.label) + "</span>";
  if (hasSubs) {
    h += "<button class='toggle-subs' data-target='" + uid + "' type='button'>" +
         countLeaves(item.subs).n + " items &#9662;</button></div>";
    h += "<ul class='subs' id='" + uid + "'>";
    item.subs.forEach((s, si) => { h += itemHtml(s, li, pi, path + "." + si); });
    h += "</ul>";
  } else {
    h += "</div>";
  }
  h += "</li>";
  return h;
}
function render() {
  const wrap = document.getElementById("leg-list");
  wrap.innerHTML = "";
  if (legs.length === 0) {
    wrap.innerHTML = "<div class='empty-msg'>Nothing in the workshop. Add one above and pick a template.</div>";
    return;
  }
  legs.forEach((leg, li) => {
    let n = 0, d = 0;
    leg.phases.forEach(p => { const r = countLeaves(p.items); n += r.n; d += r.d; });
    const pct = n ? Math.round(d / n * 100) : 0;
    const card = document.createElement("div");
    card.className = "leg-card" + (n && pct === 100 ? " complete" : "");
    let html = "<div class='leg-head'><div><span class='leg-name'>" + esc(leg.name) +
      "</span> <span class='leg-kind'>" + esc(leg.kind) + "</span></div>" +
      "<div><span class='leg-pct'>" + pct + "%</span> <span class='leg-count'>(" + d + "/" + n + " steps)</span> " +
      "<button class='leg-del' data-li='" + li + "' type='button'>delete</button></div></div>" +
      "<div class='leg-bar-outer'><div class='leg-bar' style='width:" + pct + "%'></div></div>";
    leg.phases.forEach((ph, pi) => {
      const t = countLeaves(ph.items);
      const phDone = t.n > 0 && t.d === t.n;
      html += "<div class='phase" + (ph.open ? "" : " collapsed") + "' data-phase='" + pi + "'>";
      html += "<div class='phase-head' data-li='" + li + "' data-pi='" + pi + "'>" +
        "<span class='phase-caret'>&#9656;</span>" +
        "<span class='phase-title'>" + esc(ph.title) + "</span>" +
        (ph.sub ? "<span class='phase-sub'>" + esc(ph.sub) + "</span>" : "") +
        "<span class='phase-done'>" + (phDone ? "&#10003; complete" : t.d + "/" + t.n) + "</span></div>";
      html += "<div class='phase-body'><ul class='items'>";
      ph.items.forEach((it, ii) => { html += itemHtml(it, li, pi, String(ii)); });
    html += "</ul></div></div>";
    });
    card.innerHTML = html;
    wrap.appendChild(card);
  });
  wrap.querySelectorAll(".phase-head").forEach(h => {
    h.onclick = () => {
      const ph = legs[h.dataset.li].phases[h.dataset.pi];
      ph.open = !ph.open;
      save();
      h.parentElement.classList.toggle("collapsed", !ph.open);
    };
  });
  wrap.querySelectorAll(".chk[data-path]").forEach(cb => {
    cb.onchange = () => toggleAt(+cb.dataset.li, +cb.dataset.pi, cb.dataset.path, cb.checked);
  });
  wrap.querySelectorAll(".toggle-subs").forEach(b => {
    b.onclick = () => {
      const el = document.getElementById(b.dataset.target);
      if (el) el.classList.toggle("hidden");
    };
  });
  wrap.querySelectorAll(".leg-del").forEach(b => {
    b.onclick = () => delLegend(+b.dataset.li);
  });
}
(async function init() {
  const session = await requireAuth();
  if (!session) return;
  USER_ID = session.user && session.user.id;
  const legacy = Store.get(KEY);
  const local = Store.get(KEY + ":" + USER_ID);
  await sync.init();
  const nowLocal = Store.get(KEY + ":" + USER_ID) || null;
  const remoteEmpty = (legs || []).length === 0;
  if (remoteEmpty && !nowLocal && legacy && legacy.length) {
    legs = normalizeLegs(legacy);
    save(true);
    render();
  }
  if ((legs || []).length === 0) {
    const seedFlag = "gw2-legendaries-seeded-v3:" + USER_ID;
    if (!Store.get(seedFlag)) {
      legs = [{
        id: "seed", name: "Vision (example)", kind: TEMPLATES.Vision.label,
        phases: snapshot(TEMPLATES.Vision.phases)
      }];
      legs[0].phases[0].open = true;
      Store.set(seedFlag, true);
      save(true);
      render();
    }
  }
  render();
})();
