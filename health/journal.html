<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M18 40 L18 14 L40 28 Q50 22 60 28 L82 14 L82 40 Q82 86 50 86 Q18 86 18 40 Z' fill='%2314111a' stroke='%23c9a0ff' stroke-width='5' stroke-linejoin='round'/%3E%3Cellipse cx='36' cy='54' rx='5' ry='8' fill='%235fd3c4'/%3E%3Cellipse cx='64' cy='54' rx='5' ry='8' fill='%235fd3c4'/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journal — Savich Family Dashboard</title>
<link rel="stylesheet" href="../common.css">
<style>
  body { font-size: 15px; line-height: 1.5; padding: 32px 20px; max-width: 1180px; margin: 0 auto; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px; margin-bottom: 10px; }
  .top-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  h1 { font-size: 1.5rem; color: var(--accent); letter-spacing: 0.5px; }
  .intro { color: var(--dim); font-size: 0.85rem; margin: 4px 0 24px; }

  /* ---- door cards ---- */
  .jt-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; }
  .jt-card {
    --tc: var(--accent);
    position: relative; background: var(--panel);
    border: 1px solid var(--border); border-top: 4px solid var(--tc);
    border-radius: 10px; padding: 18px; text-align: left;
    cursor: pointer; color: var(--text); font-family: inherit;
    transition: transform 0.15s ease, border-color 0.15s ease;
    overflow: hidden;
  }
  .jt-card:hover { transform: translateY(-3px); border-color: var(--tc); }
  .jt-emoji {
    width: 44px; height: 44px; border-radius: 50%;
    background: color-mix(in srgb, var(--tc) 16%, var(--panel));
    border: 1px solid var(--tc);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.25rem; margin-bottom: 10px;
  }
  .jt-card h3 { color: var(--tc); font-size: 0.98rem; margin: 0 0 6px; }
  .jt-card p { color: var(--dim); font-size: 0.78rem; margin: 0; line-height: 1.5; }
  .jt-status { margin-top: 10px; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.5px; }
  .jt-status.done { color: var(--good); }
  .jt-status.todo { color: var(--dim); }
  /* each door gets its own corner doodle */
  .jt-card::after { content: ""; position: absolute; right: -18px; top: -18px; width: 64px; height: 64px; opacity: 0.16; pointer-events: none; }
  .t-brain::after     { border-radius: 50%; background: repeating-radial-gradient(circle at 60% 40%, var(--tc) 0 2px, transparent 3px 11px); }
  .t-therapist::after { background: repeating-linear-gradient(45deg, var(--tc) 0 3px, transparent 3px 12px); }
  .t-letters::after   { border-radius: 4px 18px 4px 18px; border: 3px dashed var(--tc); width: 56px; height: 56px; right: -6px; top: -6px; }
  .t-vent::after      { border-radius: 50%; background: radial-gradient(circle, var(--tc) 0 30%, transparent 32%), radial-gradient(circle, var(--tc) 0 18%, transparent 20%), radial-gradient(circle, var(--tc) 0 12%, transparent 13%); }
  .t-diary::after     { border-radius: 0; background: repeating-linear-gradient(0deg, var(--tc) 0 2px, transparent 2px 10px); height: 56px; }
  .t-sparks::after    { border-radius: 50% 50% 50% 0; background: var(--tc); }

  /* ---- history ---- */
  .hist { margin-top: 40px; }
  .hist h2 { font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase; color: var(--accent2); margin: 0 0 12px; }
  .hist-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .hist-date { color: var(--text); font-size: 0.85rem; font-weight: 700; min-width: 150px; }
  .hist-date.today { color: var(--accent2); }
  .hist-chip {
    background: none; border: 1px solid var(--tc); color: var(--tc);
    border-radius: 999px; padding: 3px 12px; cursor: pointer;
    font-family: inherit; font-size: 0.72rem; font-weight: 700;
  }
  .hist-chip:hover { background: color-mix(in srgb, var(--tc) 14%, var(--panel)); }
  .hist-empty { color: var(--dim); font-size: 0.82rem; }

  /* ---- overlay ---- */
  .overlay {
    position: fixed; inset: 0; z-index: 250;
    background: rgba(10, 8, 14, 0.72);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .overlay.open { display: flex; }
  .entry-panel {
    --jc: var(--accent);
    background: var(--panel); border: 1px solid var(--jc);
    border-radius: 12px; width: min(740px, 96vw);
    max-height: 88vh; display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 12px 40px rgba(0,0,0,0.6);
  }
  .entry-head {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    background: linear-gradient(135deg, color-mix(in srgb, var(--jc) 10%, var(--panel)), var(--panel));
  }
  .entry-emoji { font-size: 1.4rem; }
  .entry-title { color: var(--jc); font-size: 1.05rem; font-weight: 700; }
  .entry-date {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; font-family: inherit; font-size: 0.85rem;
  }
  .entry-x {
    margin-left: auto; background: none; color: var(--dim);
    border: 1px solid var(--border); border-radius: 50%;
    width: 28px; height: 28px; cursor: pointer; font-size: 0.9rem;
  }
  .entry-x:hover { color: var(--bad); border-color: var(--bad); }
  .entry-body { padding: 18px 20px 24px; overflow-y: auto; }
  .entry-body.readonly input, .entry-body.readonly textarea, .entry-body.readonly select { opacity: 0.8; }
  .entry-foot {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 12px 20px; border-top: 1px solid var(--border);
  }
  .jbtn {
    background: var(--jc); color: #121016; border: none; border-radius: 6px;
    padding: 9px 18px; font-family: inherit; font-size: 0.82rem; font-weight: 700;
    letter-spacing: 1px; cursor: pointer;
  }
  .jbtn:hover { filter: brightness(1.1); }
  .jbtn.ghost { background: none; color: var(--dim); border: 1px solid var(--border); }
  .jbtn.ghost:hover { color: var(--text); border-color: var(--dim); }
  .jbtn.danger { background: none; color: var(--bad); border: 1px solid var(--bad); margin-left: auto; }
  .entry-hint { width: 100%; color: var(--dim); font-size: 0.7rem; }

  /* ---- generic field bits ---- */
  .fld { margin-bottom: 14px; }
  .fld > label { display: block; font-size: 0.75rem; color: var(--dim); margin-bottom: 5px; }
  .fld input[type="text"], .fld textarea, .fld select {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 9px 11px; font-family: inherit; font-size: 0.9rem;
  }
  .fld input:focus, .fld textarea:focus { outline: none; border-color: var(--jc); }
  .fld textarea { resize: vertical; min-height: 60px; }
  .slider-row { display: flex; align-items: center; gap: 12px; }
  .slider-row input[type="range"] { flex: 1; accent-color: var(--jc); }
  .slider-row output {
    min-width: 40px; text-align: center; font-weight: 700; color: var(--jc);
    background: color-mix(in srgb, var(--jc) 12%, var(--bg));
    border: 1px solid var(--jc); border-radius: 6px; padding: 4px 8px; font-size: 0.85rem;
  }

  /* =============== BRAIN DUMP — neon void =============== */
  .p-brain { background: radial-gradient(circle at 50% 0%, #2a1233 0%, var(--panel) 60%); }
  .p-brain .bd-box {
    width: 100%; min-height: 260px; background: rgba(0,0,0,0.35);
    color: #f2eef7; border: 1px solid #e10ab2; border-radius: 8px;
    padding: 14px; font-family: inherit; font-size: 0.95rem; line-height: 1.6;
    resize: vertical;
  }
  .p-brain .bd-box:focus { outline: none; box-shadow: 0 0 0 2px rgba(225,10,178,0.35); }
  .p-brain .bd-count { color: #e10ab2; font-size: 0.72rem; font-weight: 700; text-align: right; margin-top: 4px; }

  /* =============== THERAPIST LIST — tidy checklist =============== */
  .p-therapist { background: color-mix(in srgb, #5fd3c4 5%, var(--panel)); }
  .th-add { display: flex; gap: 8px; margin-bottom: 14px; }
  .th-add input {
    flex: 1; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 12px; font-family: inherit; font-size: 0.9rem;
  }
  .th-add input:focus { outline: none; border-color: #5fd3c4; }
  .th-row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px;
    margin-bottom: 8px; background: var(--bg);
  }
  .th-row .th-check {
    width: 24px; height: 24px; flex-shrink: 0; border-radius: 50%;
    border: 2px solid var(--dim); background: none; color: transparent;
    cursor: pointer; font-size: 0.8rem; line-height: 1;
  }
  .th-row.discussed { opacity: 0.55; }
  .th-row.discussed .th-check { border-color: #7ddba3; color: #7ddba3; }
  .th-row.discussed .th-txt { text-decoration: line-through; }
  .th-row .th-txt { flex: 1; font-size: 0.9rem; }
  .th-row .th-del {
    background: none; border: none; color: var(--dim); cursor: pointer;
    font-size: 0.85rem; padding: 2px 6px;
  }
  .th-row .th-del:hover { color: var(--bad); }
  .th-empty { color: var(--dim); font-size: 0.82rem; }

  /* =============== UNSNT LETTERS — real paper =============== */
  .p-letters {
    background:
      radial-gradient(circle at 85% 15%, rgba(232,194,122,0.25), transparent 40%),
      #f6f0e0;
    color: #33302a;
    font-family: Georgia, "Times New Roman", serif;
  }
  .p-letters .fld > label { color: #8a8064; font-style: italic; font-size: 0.8rem; }
  .p-letters .fld input[type="text"], .p-letters .fld textarea {
    background: #fffdf6; color: #33302a; border: 1px solid #d9cfb4;
    font-family: Georgia, "Times New Roman", serif; font-size: 1rem;
  }
  .p-letters .letter-body {
    width: 100%; min-height: 230px;
    background: repeating-linear-gradient(#fffdf6 0 27px, #ece2c8 27px 28px);
    color: #33302a; border: 1px solid #d9cfb4; border-radius: 4px;
    padding: 8px 14px; line-height: 28px;
    font-family: Georgia, "Times New Roman", serif; font-size: 1rem;
    resize: vertical;
  }
  .p-letters .letter-body:focus { outline: none; border-color: #b39244; }
  .p-letters .salut, .p-letters .sig { font-style: italic; color: #6b6350; }

  /* =============== VENT — the loud room =============== */
  .p-vent { background: radial-gradient(circle at 50% 110%, #3a0f16 0%, var(--panel) 65%); }
  .p-vent .fld textarea {
    min-height: 260px; border-color: #ff5a5a; background: rgba(0,0,0,0.35);
    font-size: 0.95rem; line-height: 1.6;
  }
  .p-vent .fld textarea:focus { outline: none; box-shadow: 0 0 0 2px rgba(255,90,90,0.3); }
  .p-vent .fld > label { color: #ff9a9a; text-transform: uppercase; letter-spacing: 1px; font-size: 0.68rem; font-weight: 700; }

  /* =============== LIFE DIARY — soft sage =============== */
  .p-diary { background: linear-gradient(180deg, color-mix(in srgb, #7ddba3 9%, var(--panel)), var(--panel)); }
  .p-diary .fld textarea { min-height: 240px; font-size: 0.95rem; line-height: 1.65; }
  .p-diary .fld textarea:focus { outline: none; border-color: #7ddba3; }

  /* =============== SPARKS — sticky energy =============== */
  .p-sparks { background: radial-gradient(circle at 20% 0%, rgba(255,209,102,0.14), transparent 45%), var(--panel); }
  .p-sparks .fld textarea {
    min-height: 240px; border-style: dashed; border-color: #ffd166;
    font-size: 0.95rem; line-height: 1.6;
  }
  .p-sparks .fld textarea:focus { outline: none; box-shadow: 0 0 0 2px rgba(255,209,102,0.3); }
  .p-sparks .fld > label { color: #ffd166; font-weight: 700; }

  .flash-msg {
    position: fixed; top: 18px; right: 18px; z-index: 300;
    background: var(--panel); border: 1px solid var(--good);
    color: var(--good); border-radius: 10px; padding: 10px 18px;
    font-weight: 700; font-size: 0.9rem;
    box-shadow: 0 8px 30px rgba(0,0,0,0.6); display: none;
  }
  .flash-msg.show { display: block; }
</style>
</head>
<body>
<div class="top">
  <h1>Personal Journal</h1>
  <div class="top-right">
    <span class="sync-note" id="sync-note">syncing…</span>
    <div id="nav"></div>
  </div>
</div>
<p class="intro">No homework. No questions. Pick a door, dump what's in your head, close it again.</p>
<nav class="jt-grid" id="jt-grid"></nav>
<div class="hist" id="hist-block"></div>

<div class="overlay" id="entry-overlay">
  <div class="entry-panel" id="entry-panel">
    <div class="entry-head">
      <span class="entry-emoji" id="entry-emoji">🧠</span>
      <span class="entry-title" id="entry-title">Journal</span>
      <input type="date" class="entry-date" id="entry-date">
      <button class="entry-x" id="entry-x" title="close (Esc)">✕</button>
    </div>
    <div class="entry-body" id="entry-body"></div>
    <div class="entry-foot">
      <button class="jbtn" id="entry-save">SAVE</button>
      <button class="jbtn ghost" id="entry-edit" style="display:none">✎ EDIT</button>
      <button class="jbtn danger" id="entry-del" style="display:none">DELETE</button>
      <span class="entry-hint" id="entry-hint">nothing is graded · you can save it empty if today was empty</span>
    </div>
  </div>
</div>

<div class="flash-msg" id="flash-msg"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../db.js"></script>
<script src="../rollover.js"></script>
<script src="../nav.js"></script>
<script>
/* =====================================================================
   Per-user cloud state (key: "journal-entries"):
     { entries: { "YYYY-MM-DD": { typeId: <value> } } }
   Most pages save a single object { main: "...", extras }.
   The therapist list saves { items: [{t, d}, ...] }.
===================================================================== */

const Store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { localStorage.setItem(k, JSON.stringify(v)); }
};

const JOURNAL_KEY = "journal-entries";
let USER_ID = null;
let entries = {};
let entriesUpdatedAt = {};
let online = false;
let historySyncReady = false;

/* ============================== the six doors ============================== */

const TYPES = [
  {
    id: "brain", name: "Brain Dump", emoji: "🧠", color: "#e10ab2", pclass: "p-brain",
    desc: "One giant box. Whatever is rattling around in your head — dump it in and close the lid. No format, no rules.",
    hint: "just spill · mid-sentence is fine · you never have to finish a thought",
    build() {
      return '<div class="fld" style="margin-bottom:4px">' +
        '<textarea class="bd-box" data-f="main" data-grow="1" placeholder="ok. go."></textarea>' +
        '<div class="bd-count" id="bd-count"></div></div>';
    },
    after(el) {
      const upd = () => {
        const words = el.value.trim() ? el.value.trim().split(/\s+/).length : 0;
        document.getElementById("bd-count").textContent =
          words ? words + " word" + (words === 1 ? "" : "s") + " out of your head" : "";
      };
      el.addEventListener("input", upd);
      upd();
    }
  },
  {
    id: "therapist", name: "Therapist List", emoji: "🛋️", color: "#5fd3c4", pclass: "p-therapist",
    desc: "Running list of things to bring up in sessions. Add the moment you think of it, cross it off after you've talked it through.",
    hint: "add it when you think of it · that's the whole system",
    build() {
      return '<div class="fld"><div class="th-add">' +
        '<input type="text" id="th-input" placeholder="want to remember to bring up…">' +
        '<button type="button" class="jbtn" id="th-add-btn">ADD</button></div>' +
        '<div id="th-list"></div></div>';
    },
    fill(saved) {
      theraItems = (saved && Array.isArray(saved.items)) ? saved.items : [];
      renderThera();
    },
    collect() { return { items: theraItems }; },
    focusId: "th-input"
  },
  {
    id: "letters", name: "Unsent Letters", emoji: "💌", color: "#e8c27a", pclass: "p-letters",
    desc: "Write to anyone you will never send it to — the person you're furious at, the one who's gone, the version of you from five years ago. The paper keeps every secret.",
    hint: "says exactly what you'd never say out loud · it stays on this paper",
    build() {
      return '<div class="fld"><label>To</label><input type="text" data-f="to" placeholder="who is this for — a name, \u201cnobody\u201d, \u201cyou know who you are\u201d…"></div>' +
        '<div class="fld"><label>Say it</label>' +
        '<textarea class="letter-body" data-f="main" data-grow="1" placeholder="Dear whatever-your-name-is,"></textarea></div>' +
        '<div class="fld"><label>Signed</label><input type="text" data-f="sig" class="sig" placeholder="\u2014 me"></div>';
    }
  },
  {
    id: "vent", name: "Vent", emoji: "🌋", color: "#ff5a5a", pclass: "p-vent",
    desc: "For when it's too loud inside. Rate how loud, then yell into the void. The void does not judge, interrupt, or say \u201cbreathe\u201d.",
    hint: "caps lock encouraged · typos welcome · nobody is coming to fix this, it just gets heard",
    build() {
      return '<div class="fld"><label>How loud is it in there right now (1–10)</label><div class="slider-row">' +
        '<input type="range" data-f="loud" min="1" max="10" value="7"><output>7</output></div></div>' +
        '<div class="fld"><label>Let it out</label>' +
        '<textarea data-f="main" data-grow="1" placeholder="AAAAAAAAAH. ok so—"></textarea></div>';
    }
  },
  {
    id: "diary", name: "Life Diary", emoji: "🌤️", color: "#7ddba3", pclass: "p-diary",
    desc: "What's going on in your life, unfiltered — the good days, the bad stretches, the stuff in between. Future-you will want to read this.",
    hint: "write like you're telling future-you what happened · or write nothing, the blank counts too",
    build() {
      return '<div class="fld"><label>Today in one line (optional)</label>' +
        '<input type="text" data-f="line" placeholder="what kind of day was it?"></div>' +
        '<div class="fld"><label>The longer version</label>' +
        '<textarea data-f="main" data-grow="1" placeholder="so here\u2019s where I\u2019m at\u2026"></textarea></div>';
    }
  },
  {
    id: "sparks", name: "Sparks", emoji: "💡", color: "#ffd166", pclass: "p-sparks",
    desc: "Half-formed ideas, hyperfocus rambles, the thing you remembered at 2am, plans you might chase someday. Catch them before they evaporate.",
    hint: "half an idea is a caught idea · finish nothing",
    build() {
      return '<div class="fld"><label>Catch them here</label>' +
        '<textarea data-f="main" data-grow="1" placeholder="what if\u2026"></textarea></div>';
    }
  }
];
const TYPE_BY_ID = {};
TYPES.forEach(t => { TYPE_BY_ID[t.id] = t; });

/* ============================== therapist list internals ============================== */

let theraItems = [];   // [{ t: "text", d: true/false }]

function renderThera() {
  const list = document.getElementById("th-list");
  if (!list) return;
  list.innerHTML = "";
  if (!theraItems.length) {
    const p = document.createElement("p");
    p.className = "th-empty";
    p.textContent = "Empty right now. Anything that loops in your head at night goes here.";
    list.appendChild(p);
    return;
  }
  theraItems.forEach((it, i) => {
    const row = document.createElement("div");
    row.className = "th-row" + (it.d ? " discussed" : "");
    const chk = document.createElement("button");
    chk.type = "button";
    chk.className = "th-check";
    chk.innerHTML = "✓";
    chk.title = it.d ? "mark as not-yet-discussed" : "marked as talked through";
    chk.onclick = () => { it.d = !it.d; renderThera(); };
    const txt = document.createElement("span");
    txt.className = "th-txt";
    txt.textContent = it.t;
    const del = document.createElement("button");
    del.type = "button";
    del.className = "th-del";
    del.textContent = "✕";
    del.title = "remove";
    del.onclick = () => { theraItems.splice(i, 1); renderThera(); };
    row.appendChild(chk); row.appendChild(txt); row.appendChild(del);
    list.appendChild(row);
  });
}

function addTheraItem() {
  const inp = document.getElementById("th-input");
  if (!inp) return;
  const v = inp.value.trim();
  if (!v) return;
  theraItems.push({ t: v, d: false });
  inp.value = "";
  renderThera();
  inp.focus();
}

/* ============================== sync ============================== */

function updateSyncNote() {
  const el = document.getElementById("sync-note");
  if (!el) return;
  el.textContent = online ? "✓" : "offline — changes NOT saved";
  el.classList.toggle("live", online);
}

const journalSync = createUserSync({
  key: JOURNAL_KEY,
  sections: ["entries"],
  growSections: ["entries"],
  loadLocal: () => {
    const cached = Store.get(JOURNAL_KEY + ":" + USER_ID);
    return cached && cached.entries ? cached : { entries: {}, updatedAt: {} };
  },
  saveLocal: v => Store.set(JOURNAL_KEY + ":" + USER_ID, v),
  getState: () => ({ entries: entries, updatedAt: entriesUpdatedAt }),
  setState: v => {
    entries = (v && v.entries && typeof v.entries === "object" && !Array.isArray(v.entries)) ? v.entries : {};
    entriesUpdatedAt = (v && v.updatedAt) || {};
  },
  onRender: renderHome,
  setOnline: ok => { online = !!ok; updateSyncNote(); }
});

/* ============================== helpers ============================== */

function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function fmtDateLong(iso) {
  const p = iso.split("-");
  if (p.length !== 3) return iso;
  const d = new Date(+p[0], +p[1] - 1, +p[2]);
  const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return days[d.getDay()] + ", " + months[d.getMonth()] + " " + d.getDate() + " " + d.getFullYear();
}

let flashTimer = null;
function flash(msg) {
  const el = document.getElementById("flash-msg");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => el.classList.remove("show"), 1800);
}

function hasContent(t) {
  if (!t) return false;
  if (t.items) return t.items.length > 0;
  return Object.values(t).some(v => v !== undefined && v !== null && String(v).trim() !== "" && String(v) !== "7");
}

/* ============================== home view ============================== */

function renderHome() {
  const today = todayStr();
  const day = entries[today] || {};
  const grid = document.getElementById("jt-grid");
  grid.innerHTML = "";
  TYPES.forEach(t => {
    const done = hasContent(day[t.id]);
    const card = document.createElement("button");
    card.type = "button";
    card.className = "jt-card t-" + t.id;
    card.style.setProperty("--tc", t.color);
    card.innerHTML =
      '<div class="jt-emoji">' + t.emoji + '</div>' +
      '<h3>' + t.name + '</h3>' +
      '<p>' + t.desc + '</p>' +
      '<div class="jt-status ' + (done ? "done" : "todo") + '">' +
      (done ? "✓ written today" : "open it") + '</div>';
    card.onclick = () => openEntry(t.id, today, false);
    grid.appendChild(card);
  });

  const hb = document.getElementById("hist-block");
  hb.innerHTML = "";
  const dates = Object.keys(entries).filter(d => Object.keys(entries[d] || {}).length).sort().reverse();
  const h2 = document.createElement("h2");
  h2.textContent = "Past entries";
  hb.appendChild(h2);
  if (!dates.length) {
    const p = document.createElement("p");
    p.className = "hist-empty";
    p.textContent = "Nothing yet — today's the first page.";
    hb.appendChild(p);
    return;
  }
  dates.slice(0, 60).forEach(d => {
    const row = document.createElement("div");
    row.className = "hist-row";
    const lab = document.createElement("span");
    lab.className = "hist-date" + (d === today ? " today" : "");
    lab.textContent = fmtDateLong(d);
    row.appendChild(lab);
    Object.keys(entries[d]).forEach(tid => {
      const t = TYPE_BY_ID[tid];
      if (!t) return;
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "hist-chip";
      chip.style.setProperty("--tc", t.color);
      chip.textContent = t.emoji + " " + t.name;
      chip.onclick = () => openEntry(tid, d, true);
      row.appendChild(chip);
    });
    hb.appendChild(row);
  });
}

/* ============================== entry overlay ============================== */

let openType = null;
let openDate = null;
let viewMode = false;

function openEntry(typeId, dateStr, readonly) {
  openType = TYPE_BY_ID[typeId];
  if (!openType) return;
  openDate = dateStr;
  viewMode = !!readonly;

  const overlay = document.getElementById("entry-overlay");
  const panel = document.getElementById("entry-panel");
  const body = document.getElementById("entry-body");
  panel.style.setProperty("--jc", openType.color);
  document.getElementById("entry-emoji").textContent = openType.emoji;
  document.getElementById("entry-title").textContent = openType.name;
  document.getElementById("entry-date").value = dateStr;
  document.getElementById("entry-date").disabled = viewMode;
  document.getElementById("entry-hint").textContent = openType.hint ||
    "nothing is graded · you can save it empty if today was empty";

  body.className = "entry-body " + openType.pclass + (viewMode ? " readonly" : "");
  body.innerHTML = openType.build();

  const saved = entries[dateStr] && entries[dateStr][typeId];
  if (openType.fill) openType.fill(saved);
  else fillForm(saved || {});
  if (openType.after) {
    const mainEl = body.querySelector("[data-f='main']");
    if (mainEl) openType.after(mainEl);
  }

  document.getElementById("entry-save").style.display = viewMode ? "none" : "";
  document.getElementById("entry-edit").style.display = viewMode ? "" : "none";
  document.getElementById("entry-del").style.display = viewMode ? "" : "none";

  if (openType.focusId && !viewMode) {
    const f = document.getElementById(openType.focusId);
    if (f) setTimeout(() => f.focus(), 60);
  }
  overlay.classList.add("open");
}

function closeEntry() {
  document.getElementById("entry-overlay").classList.remove("open");
  openType = null;
  openDate = null;
}

function fillForm(vals) {
  const body = document.getElementById("entry-body");
  body.querySelectorAll("[data-f]").forEach(el => {
    const f = el.getAttribute("data-f");
    if (el.tagName === "INPUT" && el.type === "range") {
      el.value = (vals[f] !== undefined && vals[f] !== "") ? vals[f] : el.value;
      const out = el.parentElement.querySelector("output");
      if (out) out.textContent = el.value;
    } else {
      el.value = vals[f] !== undefined ? vals[f] : "";
    }
    if (el.hasAttribute("data-grow")) autogrow(el);
  });
}

function collectForm() {
  const out = {};
  document.getElementById("entry-body").querySelectorAll("[data-f]").forEach(el => {
    out[el.getAttribute("data-f")] = el.value;
  });
  return out;
}

function saveEntry() {
  const dateStr = document.getElementById("entry-date").value || todayStr();
  const vals = openType.collect ? openType.collect() : collectForm();
  if (!entries[dateStr]) entries[dateStr] = {};
  entries[dateStr][openType.id] = vals;
  if (historySyncReady) journalSync.save(true); else Store.set(JOURNAL_KEY + ":" + USER_ID, { entries: entries, updatedAt: entriesUpdatedAt });
  flash("✓ saved — " + openType.name + " · " + dateStr);
  closeEntry();
  renderHome();
}

function deleteEntry() {
  if (!window.confirm("Delete this " + openType.name + " entry from " + openDate + "?")) return;
  if (entries[openDate]) {
    delete entries[openDate][openType.id];
    if (!Object.keys(entries[openDate]).length) delete entries[openDate];
  }
  if (historySyncReady) journalSync.save(true); else Store.set(JOURNAL_KEY + ":" + USER_ID, { entries: entries, updatedAt: entriesUpdatedAt });
  flash("✖ entry deleted");
  closeEntry();
  renderHome();
}

function autogrow(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight + 4, 2000) + "px";
}

/* ============================== wiring ============================== */

document.getElementById("entry-x").onclick = closeEntry;
document.getElementById("entry-save").onclick = saveEntry;
document.getElementById("entry-del").onclick = deleteEntry;
document.getElementById("entry-edit").onclick = () => {
  const body = document.getElementById("entry-body");
  body.classList.remove("readonly");
  document.getElementById("entry-date").disabled = false;
  document.getElementById("entry-save").style.display = "";
  document.getElementById("entry-edit").style.display = "none";
  viewMode = false;
  if (openType.id === "therapist") renderThera();
  flash("editing — SAVE when done");
};
document.getElementById("entry-date").addEventListener("change", () => {
  openDate = document.getElementById("entry-date").value || todayStr();
});
document.getElementById("entry-body").addEventListener("input", e => {
  if (e.target && e.target.type === "range") {
    const out = e.target.parentElement.querySelector("output");
    if (out) out.textContent = e.target.value;
  }
  if (e.target && e.target.hasAttribute && e.target.hasAttribute("data-grow")) autogrow(e.target);
});
document.getElementById("entry-body").addEventListener("click", e => {
  if (e.target && e.target.id === "th-add-btn") addTheraItem();
});
document.getElementById("entry-body").addEventListener("keydown", e => {
  if (e.target && e.target.id === "th-input" && e.key === "Enter") {
    e.preventDefault();
    addTheraItem();
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeEntry();
});

/* ============================== boot ============================== */

(async function init() {
  const session = await requireAuth();
  if (!session) return;
  USER_ID = session.user && session.user.id;
  if (!USER_ID) return;
  const cached = Store.get(JOURNAL_KEY + ":" + USER_ID);
  if (cached && cached.entries) entries = cached.entries;
  renderHome();
  await journalSync.init();
  historySyncReady = true;
  renderHome();
})();
</script>
</body>
