<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bucket List — Savich Dashboard</title>
<style>
  :root {
    --bg: #121016;
    --panel: #1c1922;
    --text: #f2eef7;
    --accent: #c9a0ff;
    --accent2: #5fd3c4;
    --dim: #a89bbd;
    --border: #332c3e;
    --bad: #ff8a8a;
    /* lisa frank neon layer */
    --lf-pink: #ff4fa3;
    --lf-magenta: #d81b7f;
    --lf-gold: #ffd93d;
    --lf-teal: #12d6b0;
    --lf-blue: #00c2e0;
    --lf-purple: #8b2fc9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: Verdana, Geneva, Tahoma, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    padding: 40px 20px;
    max-width: 860px;
    margin: 0 auto;
    overflow-x: hidden;
  }
  /* subtle rainbow glow behind everything */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 600px 300px at 15% 10%, rgba(139,47,201,.22), transparent 70%),
      radial-gradient(ellipse 500px 260px at 85% 20%, rgba(255,79,163,.16), transparent 70%),
      radial-gradient(ellipse 550px 300px at 50% 95%, rgba(18,214,176,.14), transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* floating doodles */
  .sky { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .sky span { position: absolute; opacity: .5; animation: drift 9s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: translateY(0) rotate(-8deg);} to { transform: translateY(-22px) rotate(10deg);} }

  .wrap { position: relative; z-index: 1; }

  .top {
    display: flex; justify-content: space-between; align-items: baseline;
    flex-wrap: wrap; gap: 12px; margin-bottom: 18px;
  }
  .back-link {
    color: var(--accent2);
    font-size: 0.8rem;
    text-decoration: none;
  }
  .back-link:hover { text-decoration: underline; }
  .backup-btns { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .sync-note { color: var(--dim); font-size: 0.68rem; letter-spacing: .3px; white-space: nowrap; }
  .sync-note.live { color: var(--lf-teal); }
  .backup-btn {
    background: var(--panel);
    border: 1px solid var(--accent2);
    color: var(--accent2);
    border-radius: 999px;
    padding: 5px 16px;
    font-family: inherit;
    font-size: 0.75rem;
    font-weight: 700;
    cursor: pointer;
  }
  .backup-btn:hover { filter: brightness(1.15); }

  header { text-align: center; margin-bottom: 36px; position: relative; }
  .rainbow-bar {
    height: 10px; border-radius: 999px;
    background: linear-gradient(90deg,
      var(--lf-pink), var(--lf-gold), var(--lf-teal), var(--lf-blue), var(--lf-purple), var(--lf-pink));
    background-size: 200% 100%;
    animation: shimmer 4s linear infinite;
    margin-bottom: 22px;
    box-shadow: 0 0 18px rgba(255,79,163,.35);
  }
  @keyframes shimmer { from { background-position: 0% 0;} to { background-position: 200% 0;} }

  h1 {
    font-size: 2.2rem;
    letter-spacing: 1px;
    margin-bottom: 8px;
    background: linear-gradient(90deg, var(--lf-pink), var(--lf-gold), var(--lf-teal), var(--lf-blue), var(--lf-purple));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    transform: rotate(-1.2deg);
  }
  .tagline {
    display: inline-block;
    color: var(--dim);
    font-size: 0.88rem;
    border: 1px dashed var(--lf-pink);
    border-radius: 999px;
    padding: 8px 20px;
    transform: rotate(0.8deg);
    background: rgba(255,79,163,.07);
  }

  /* section headers — dashboard style but sparklier */
  h2.section {
    font-size: 0.75rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 700;
    margin: 34px 0 14px;
    color: var(--accent2);
    display: flex; align-items: center; gap: 10px;
  }
  h2.section .n {
    display: grid; place-items: center;
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--panel);
    border: 1px solid var(--lf-purple);
    color: var(--lf-gold);
    font-size: 0.95rem;
    box-shadow: 0 0 10px rgba(139,47,201,.5);
  }

  /* stats strip */
  .stats {
    display: flex; gap: 14px; justify-content: center;
    margin-bottom: 8px; flex-wrap: wrap;
  }
  .stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 18px;
    font-size: 0.8rem;
    color: var(--dim);
  }
  .stat b { color: var(--lf-gold); font-size: 0.95rem; }

  /* panels match dashboard .nav-card look */
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 10px;
  }
  .card:hover { border-color: var(--lf-pink); transition: border-color .2s; }

  ul.bucket { list-style: none; margin-top: 6px; }
  li.item {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 12px 6px;
    border-bottom: 1px solid var(--border);
    transition: transform .15s;
  }
  li.item:first-child { border-top: 1px solid var(--border); }
  li.item:last-child { border-bottom: none; }
  li.item:hover { transform: translateX(4px); }

  .check {
    flex: 0 0 auto; width: 30px; height: 30px; margin-top: 3px;
    border: 2px solid var(--lf-purple); border-radius: 50%;
    background: transparent; cursor: pointer; display: grid; place-items: center;
    font-size: 1rem; transition: all .2s;
  }
  .check:hover { border-color: var(--lf-gold); box-shadow: 0 0 10px rgba(255,217,61,.4); }
  .item.done .check {
    background: var(--lf-gold);
    color: var(--bg);
    border-color: var(--lf-gold);
    box-shadow: 0 0 12px rgba(255,217,61,.55);
  }
  .item.done .txt { color: var(--dim); text-decoration: line-through wavy var(--lf-pink); }

  .txt { flex: 1; line-height: 1.5; }
  .txt .story {
    display: block; margin-top: 6px;
    font-size: 0.8rem; color: var(--accent);
    background: rgba(18,214,176,.08);
    border-left: 3px solid var(--lf-teal);
    border-radius: 0 8px 8px 0;
    padding: 8px 12px;
    text-decoration: none !important;
  }
  .del {
    background: none; border: none; cursor: pointer;
    font-size: 0.95rem; opacity: .35;
    transition: all .15s; color: var(--dim);
  }
  .del:hover { opacity: 1; transform: rotate(15deg) scale(1.15); color: var(--lf-pink); }

  /* add form — at the TOP of each card */
  .addrow { display: flex; gap: 10px; }
  input[type="text"] {
    flex: 1;
    padding: 10px 16px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-family: inherit; font-size: 0.88rem;
    outline: none;
  }
  input[type="text"]::placeholder { color: var(--dim); }
  input[type="text"]:focus { border-color: var(--lf-blue); box-shadow: 0 0 10px rgba(0,194,224,.25); }
  button.go {
    padding: 10px 20px;
    border: none; border-radius: 20px; cursor: pointer;
    font-family: inherit; font-weight: 700; font-size: 0.85rem;
    color: var(--bg);
    background: linear-gradient(90deg, var(--lf-pink), var(--lf-purple));
    transition: transform .1s, box-shadow .1s;
    box-shadow: 0 0 14px rgba(255,79,163,.35);
    white-space: nowrap;
  }
  button.go:hover { box-shadow: 0 0 20px rgba(255,79,163,.55); }
  button.go:active { transform: scale(.96); }

  .story-toggle-wrap { text-align: center; margin-top: 10px; margin-bottom: 4px; }
  .story-toggle {
    background: none; border: none; cursor: pointer;
    font-family: inherit; font-size: 0.75rem;
    color: var(--accent2); text-decoration: underline dotted;
  }
  .story-input {
    display: none; margin-top: 6px;
    width: 100%;
  }

  .empty-msg {
    text-align: center; padding: 16px;
    color: var(--dim); font-size: 0.85rem;
  }

  .footer-note {
    font-size: 0.73rem;
    color: var(--dim);
    padding-top: 20px;
    border-top: 1px solid var(--border);
    margin-top: 40px;
    text-align: center;
  }

  /* toast — same pattern as inventory/recipes */
  .toast {
    position: fixed; top: 18px; right: 18px; z-index: 300;
    background: var(--panel); border: 1px solid var(--lf-teal);
    color: var(--lf-teal); border-radius: 10px; padding: 10px 18px;
    font-weight: 700; font-size: 0.9rem;
    box-shadow: 0 8px 30px rgba(0,0,0,0.6);
    display: none;
  }
  .toast.show { display: block; }

  /* sparkle burst */
  .sparkle {
    position: fixed; pointer-events: none; font-size: 1.3rem;
    animation: pop 800ms ease-out forwards; z-index: 50;
  }
  @keyframes pop {
    0% { transform: scale(.4) translateY(0); opacity: 1; }
    100% { transform: scale(1.6) translateY(-50px); opacity: 0; }
  }

  /* ---- modal (house style, same as inventory/recipes/history/nodes) ---- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(10, 8, 14, 0.75);
    display: none; align-items: center; justify-content: center;
    z-index: 200; padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 26px 28px 22px;
    max-width: 410px; width: 100%;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  }
  .modal-box h2 {
    font-size: 0.96rem; color: var(--lf-pink);
    margin-bottom: 12px; line-height: 1.4;
  }
  .modal-box p {
    font-size: 0.81rem; color: var(--dim);
    line-height: 1.6; margin-bottom: 22px; white-space: pre-line;
  }
  .modal-buttons { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
  .modal-buttons button {
    font-family: inherit; font-size: 0.81rem; font-weight: 700;
    border-radius: 5px; padding: 8px 22px; cursor: pointer; letter-spacing: 1px;
  }
  .modal-yes { background: var(--accent2); color: #121016; border: none; }
  .modal-yes.destructive { background: var(--bad); }
  .modal-yes:hover { filter: brightness(1.1); }
  .modal-no {
    background: none; color: var(--dim);
    border: 1px solid var(--border); font-weight: 400;
  }
  .modal-no:hover { border-color: var(--accent); color: var(--text); }
</style>
</head>
<body>

<div class="sky" id="sky"></div>

<div class="wrap">
  <div class="top">
    <a class="back-link" href="../index.html">← back to the mothership</a>
    <div class="backup-btns">
      <span class="sync-note" id="sync-note">checking account…</span>
      <button class="backup-btn" onclick="exportData()">Back dat data up</button>
      <button class="backup-btn" onclick="document.getElementById('import-file').click()">Bring it on back</button>
      <input type="file" id="import-file" accept=".json,application/json" style="display:none" onchange="importData(event)">
    </div>
  </div>

  <header>
    <div class="rainbow-bar"></div>
    <h1>🌈 Bucket List 🦄</h1>
    <p class="tagline">All the things you didn't know you needed to do until you did them! ✨</p>
    <div class="stats" id="stats"></div>
  </header>

  <h2 class="section"><span class="n">🎯</span> The Official Agenda</h2>
  <div class="card">
    <div class="addrow">
      <input type="text" id="classicInput" placeholder="a dream worth chasing 🌟">
      <button class="go" onclick="addItem('classic')">add it 💥</button>
    </div>
    <div class="story-toggle-wrap">
      <button class="story-toggle" onclick="toggleStory('classic')" id="classicStoryBtn">＋ tell the story</button>
    </div>
    <input type="text" class="story-input" id="classicStory" placeholder="why does this one matter to you? 💭">
    <ul class="bucket" id="classicList"></ul>
  </div>

  <h2 class="section"><span class="n">🌀</span> Plot-Twist Achievements</h2>
  <div class="card">
    <div class="addrow">
      <input type="text" id="twistInput" placeholder="something wild that just... happened ✨">
      <button class="go" onclick="addItem('twist')">add it 💥</button>
    </div>
    <div class="story-toggle-wrap">
      <button class="story-toggle" onclick="toggleStory('twist')" id="twistStoryBtn">＋ tell the story</button>
    </div>
    <input type="text" class="story-input" id="twistStory" placeholder="give us the details, we're nosy 🎤">
    <ul class="bucket" id="twistList"></ul>
  </div>

  <p class="footer-note">✦ every day is a chance to accidentally achieve something ✦</p>
</div>

<!-- ============ MODAL + TOAST ============ -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box">
    <h2 id="modal-title"></h2>
    <p id="modal-message"></p>
    <div class="modal-buttons" id="modal-buttons"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../db.js"></script>
<script>
// Per-user cloud row in user_state. This is a plain bucket-list blob,
// not part of any GW2 daily/weekly tracker structure.
const KEY = "savich-bucket";
const LEGACY_KEY = "savichBucket";
let USER_ID = null;

let data = {
  twist: [
    {
      txt: "Stun a pharmacist into total silence 💊",
      done: true,
      story: "Told her how long I'd been reusing the same insulin syringe before replacing it. She simply stopped talking. Mid-sentence. Stared at me like I'd summoned a demon in aisle four. A core memory."
    }
  ],
  classic: []
};

// Normalize the two independent lists while preserving each item's fields.
function normalizeBucketState(value) {
  const source = value && typeof value === "object" ? value : {};
  return {
    twist: Array.isArray(source.twist) ? source.twist : [],
    classic: Array.isArray(source.classic) ? source.classic : []
  };
}

const Store = {
  get(key) {
    try { return JSON.parse(localStorage.getItem(key)); }
    catch (e) { return null; }
  },
  set(key, value) {
    localStorage.setItem(key, JSON.stringify(value));
  }
};

// Same per-user sync engine as Nodes and History.
// The cloud record "savich-bucket" stores { twist: [...], classic: [...] }.
const sync = createUserSync({
  key: KEY,
  sections: ["twist", "classic"],
  loadLocal: () => Store.get(KEY + ":" + USER_ID) || data,
  saveLocal: state => Store.set(KEY + ":" + USER_ID, state),
  getState: () => data,
  setState: state => { data = normalizeBucketState(state); },
  onRender: () => renderAll(),
  setOnline: (ok, message) => setSync(ok, message)
});

function save(immediate) {
  sync.save(!!immediate);
}

function setSync(ok, message) {
  const el = document.getElementById("sync-note");
  if (!el) return;
  el.textContent = ok ? (message || "cloud synced ✓") : "offline — changes NOT saved";
  el.classList.toggle("live", !!ok);
}

const icons = ["✨","⭐","💖","🌈","🦋","🌸","🌟","🍭","💫"];

function escapeHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function render(kind, listId) {
  const ul = document.getElementById(listId);
  const arr = data[kind];
  ul.innerHTML = "";
  if (!arr.length) {
    ul.innerHTML = '<li class="empty-msg">suspiciously empty... 🕳️</li>';
    return;
  }
  arr.forEach((item, i) => {
    const li = document.createElement("li");
    li.className = "item" + (item.done ? " done" : "");
    li.innerHTML = `
      <button class="check" onclick="toggleDone(event,'${kind}',${i})" title="${item.done ? "un-achieve?!" : "achieved!"}">${item.done ? icons[(i + item.txt.length) % icons.length] : ""}</button>
      <div class="txt">${escapeHtml(item.txt)}${item.story ? `<span class="story">🎤 ${escapeHtml(item.story)}</span>` : ""}</div>
      <button class="del" onclick="removeItem('${kind}',${i})" title="banish">🗑️</button>`;
    ul.appendChild(li);
  });
}

function renderStats() {
  const all = [...data.twist, ...data.classic];
  const done = all.filter(i => i.done).length;
  document.getElementById("stats").innerHTML =
    `<span class="stat">✅ <b>${done}</b> achieved</span>
     <span class="stat">🎯 <b>${all.length - done}</b> remaining</span>
     <span class="stat">🌀 <b>${data.twist.length}</b> plot twists</span>`;
}

function addItem(kind) {
  const input = document.getElementById(kind + "Input");
  const storyEl = document.getElementById(kind + "Story");
  const txt = input.value.trim();
  if (!txt) {
    input.focus();
    input.placeholder = "type something first, silly 🙃";
    return;
  }
  data[kind].push({ txt, done: false, story: storyEl.value.trim() });
  input.value = "";
  storyEl.value = "";
  storyEl.style.display = "none";
  document.getElementById(kind + "StoryBtn").textContent = "＋ tell the story";
  save();
  renderAll();
}

function toggleDone(ev, kind, i) {
  const nowDone = !data[kind][i].done;
  data[kind][i].done = nowDone;
  save();
  renderAll();
  if (nowDone) burst(ev);
}

async function removeItem(kind, i) {
  const item = data[kind][i];
  const ok = await askConfirm(
    "Banish this one forever?",
    item.txt + "\n\nThere's no take-backs on a banishing.",
    true
  );
  if (!ok) return;
  data[kind].splice(i, 1);
  save();
  renderAll();
  showToast("Banished to the shadow realm. 👋");
}

function toggleStory(kind) {
  const el = document.getElementById(kind + "Story");
  const btn = document.getElementById(kind + "StoryBtn");
  const showing = el.style.display === "block";
  el.style.display = showing ? "none" : "block";
  btn.textContent = showing ? "＋ tell the story" : "− hide the story";
}

["twist", "classic"].forEach(kind => {
  document.getElementById(kind + "Input").addEventListener("keydown", e => {
    if (e.key === "Enter") addItem(kind);
  });
});

function burst(ev) {
  const x = ev && ev.clientX ? ev.clientX : window.innerWidth / 2;
  const y = ev && ev.clientY ? ev.clientY : 200;
  for (let n = 0; n < 7; n++) {
    const s = document.createElement("div");
    s.className = "sparkle";
    s.textContent = icons[Math.floor(Math.random() * icons.length)];
    s.style.left = (x + (Math.random() * 80 - 40)) + "px";
    s.style.top = (y + (Math.random() * 40 - 20)) + "px";
    s.style.animationDelay = (n * 60) + "ms";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1100);
  }
}

// ==========================================================
// BACKUP / RESTORE — matches inventory/recipes house style
// Export file name: savich-bucket-backup-YYYY-MM-DD.json
// ==========================================================
function exportData() {
  const blob = new Blob([JSON.stringify(data, null, 2)],
    { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "savich-bucket-backup-" +
    new Date().toISOString().slice(0, 10) + ".json";
  a.click();
  URL.revokeObjectURL(url);
  showToast("Backup downloaded. Keep it somewhere safe.");
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (!parsed || !Array.isArray(parsed.twist) || !Array.isArray(parsed.classic)) {
        showToast("That file isn't a valid bucket backup.");
        return;
      }
      const ok = await askConfirm(
        "Replace current bucket list?",
        "This overwrites everything on this page with the contents of the backup file.",
        true
      );
      if (!ok) return;
      data = normalizeBucketState(parsed);
      save(true);
      renderAll();
      showToast("Backup restored.");
    } catch (err) {
      showToast("Couldn't read that file.");
    }
  };
  reader.readAsText(file);
  e.target.value = "";
}

// ==========================================================
// MODAL — askConfirm but with any number of choices.
// Each choice: { label, value, primary?, destructive? }
// Resolves with the chosen value (null if cancelled/escaped/backdrop).
// ==========================================================
let modalResolve = null;

function askChoice(title, message, choices) {
  return new Promise(resolve => {
    modalResolve = resolve;
    document.getElementById("modal-title").textContent = title;
    document.getElementById("modal-message").textContent = message;
    const btns = document.getElementById("modal-buttons");
    btns.innerHTML = "";
    choices.forEach(c => {
      const b = document.createElement("button");
      b.textContent = c.label;
      b.className = c.primary
        ? ("modal-yes" + (c.destructive ? " destructive" : ""))
        : "modal-no";
      b.onclick = () => closeModal(c.value);
      btns.appendChild(b);
    });
    document.getElementById("modal-overlay").classList.add("open");
  });
}

function askConfirm(title, message, destructive) {
  return askChoice(title, message, [
    { label: "NO", value: false },
    { label: "YES", value: true, primary: true, destructive: !!destructive }
  ]);
}

function closeModal(result) {
  document.getElementById("modal-overlay").classList.remove("open");
  if (modalResolve) { modalResolve(result); modalResolve = null; }
}

document.getElementById("modal-overlay").addEventListener("click", e => {
  if (e.target === document.getElementById("modal-overlay")) closeModal(null);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" &&
      document.getElementById("modal-overlay").classList.contains("open")) {
    closeModal(null);
  }
});

// ==========================================================
// TOAST
// ==========================================================
let toastTimer = null;
function showToast(message) {
  const t = document.getElementById("toast");
  t.textContent = message;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

/* floating sky doodles */
(function() {
  const sky = document.getElementById("sky");
  const doodles = ["⭐","💖","🌈","🦄","✨","🍭","🌟","🎀"];
  for (let i = 0; i < 12; i++) {
    const s = document.createElement("span");
    s.textContent = doodles[i % doodles.length];
    s.style.left = Math.random() * 95 + "vw";
    s.style.top = Math.random() * 95 + "vh";
    s.style.fontSize = (0.7 + Math.random() * 1.1) + "rem";
    s.style.animationDelay = (Math.random() * 8) + "s";
    sky.appendChild(s);
  }
})();

function renderAll() {
  render("twist", "twistList");
  render("classic", "classicList");
  renderStats();
}
// Render the existing starter content immediately, then load the signed-in
// account's cache/cloud state. The legacy browser key is adopted once by the
// first account that opens this upgraded page, then removed to prevent leakage
// into another account on the same browser.
renderAll();

(async function initBucketSync() {
  try {
    const session = await requireAuth();
    if (!session) return;

    USER_ID = session.user && session.user.id;
    if (!USER_ID) throw new Error("Signed-in session has no user ID");

    const userCacheKey = KEY + ":" + USER_ID;
    const existingUserCache = Store.get(userCacheKey);
    const legacy = Store.get(LEGACY_KEY);

    if (!existingUserCache && legacy &&
        Array.isArray(legacy.twist) && Array.isArray(legacy.classic)) {
      Store.set(userCacheKey, normalizeBucketState(legacy));
    }

    // Never leave the old unscoped key available to a different account.
    if (legacy !== null) localStorage.removeItem(LEGACY_KEY);

    await sync.init();
    renderAll();
  } catch (error) {
    console.error("Bucket List account sync initialization failed:", error);
    setSync(false, "cloud connection error");
  }
})();
</script>
</body>
</html>
