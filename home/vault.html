<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vault Distribution</title>
<style>
  :root {
    --bg: #121016;
    --panel: #1c1922;
    --text: #f2eef7;
    --accent: #c9a0ff;
    --accent2: #5fd3c4;
    --dim: #a89bbd;
    --border: #332c3e;
    --good: #7ddba3;
    --bad: #ff8a8a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: Verdana, Geneva, Tahoma, sans-serif;
    font-size: 14px;
    line-height: 1.6;
    padding: 32px 20px;
    max-width: 1080px;
    margin: 0 auto;
  }
  .top {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 12px; margin-bottom: 6px;
  }
  h1 { font-size: 1.4rem; color: var(--accent); letter-spacing: 0.5px; }
  .top-right {
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap; justify-content: flex-end;
  }
  /* Navigation Bar — house style, same as trackers/recipes/inventory */
  .nav-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--dim);
    text-decoration: none;
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 600;
    transition: all 0.2s ease;
  }
  .nav-btn:hover { border-color: var(--accent2); color: var(--accent2); }
  p.sub { color: var(--dim); font-size: 0.82rem; margin-bottom: 24px; }

  nav {
    display: flex; gap: 4px; margin-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }
  nav button {
    background: none; border: none; color: var(--dim);
    padding: 10px 16px; font-family: inherit; font-size: 0.85rem;
    cursor: pointer; border-bottom: 2px solid transparent;
  }
  nav button.active { color: var(--accent2); border-bottom-color: var(--accent2); }
  .page { display: none; }
  .page.visible { display: block; }

  .pool-panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 20px; margin-bottom: 24px;
  }
  .pool-row { display: flex; gap: 14px; align-items: end; flex-wrap: wrap; }
  .pool-row label {
    display: block; font-size: 0.68rem; color: var(--dim);
    margin-bottom: 5px; letter-spacing: 0.5px; text-transform: uppercase;
  }
  #pool-amount {
    background: #16131d; color: var(--text);
    border: 1px solid var(--border); border-radius: 5px;
    padding: 10px 12px; font-family: inherit; font-size: 1.15rem;
    width: 220px;
  }
  #pool-amount:focus { outline: none; border-color: var(--accent2); }
  .remaining { font-size: 0.78rem; color: var(--dim); margin-left: auto; align-self: center; }
  .remaining b { color: var(--accent2); }

  .actions { display: flex; gap: 10px; margin-top: 24px; flex-wrap: wrap; }
  button.primary {
    background: var(--accent2); color: #121016; border: none;
    padding: 9px 18px; border-radius: 5px; font-size: 0.82rem;
    font-weight: 700; font-family: inherit; cursor: pointer;
  }
  button.primary:hover { filter: brightness(1.1); }
  button.danger {
    background: none; border: 1px solid var(--border); color: var(--dim);
    padding: 8px 18px; border-radius: 5px; font-size: 0.8rem;
    font-family: inherit; cursor: pointer;
  }
  button.danger:hover { border-color: var(--bad); color: var(--bad); }

  table { width: 100%; border-collapse: collapse; font-size: 0.83rem; }
  th {
    text-align: left; padding: 9px 12px; color: var(--dim);
    font-weight: 600; border-bottom: 1px solid var(--border);
    background: var(--panel); font-size: 0.68rem;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  td { padding: 9px 12px; border-bottom: 1px solid #26212e; }
  tr:nth-child(even) td { background: #171420; }
  tr.done td { opacity: 0.45; }
  tr.done td.transfer { color: var(--good); opacity: 1; }
  .transfer { text-align: right; font-variant-numeric: tabular-nums; color: var(--accent2); }
  th.transfer { text-align: right; }
  .cb { width: 17px; height: 17px; accent-color: var(--accent2); cursor: pointer; }
  input.weight {
    width: 62px; background: #16131d; color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 5px 7px; font-family: inherit; font-size: 0.8rem;
  }
  input.weight:focus { outline: none; border-color: var(--accent2); }
  .empty { color: var(--dim); font-size: 0.8rem; padding: 18px 0; text-align: center; }

  .hist-row { cursor: pointer; }
  .hist-row:hover td { background: #1d1926 !important; }
  .detail-row td { background: #171420 !important; padding: 14px 20px 14px 32px; }
  .detail-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 6px 24px; font-size: 0.78rem;
  }
  .detail-grid div { display: flex; justify-content: space-between; gap: 10px; }
  .detail-grid span.v { color: var(--dim); }
  .detail-grid span.a { color: var(--accent2); font-variant-numeric: tabular-nums; }

  .sync-note {
    font-size: 0.72rem; color: var(--dim); letter-spacing: 0.5px;
  }
  .sync-note.live { color: var(--good); }

  /* ---- custom modal ---- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(10, 8, 14, 0.75);
    display: none; align-items: center; justify-content: center;
    z-index: 100; padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 26px 28px 22px;
    max-width: 380px; width: 100%;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  }
  .modal-box h2 {
    font-size: 0.98rem; color: #e10ab2;
    margin-bottom: 12px; line-height: 1.4;
  }
  .modal-box p {
    font-size: 0.82rem; color: var(--dim);
    line-height: 1.6; margin-bottom: 22px;
    white-space: pre-line;
  }
  .modal-buttons { display: flex; gap: 10px; justify-content: flex-end; }
  .modal-buttons button {
    font-family: inherit; font-size: 0.82rem; font-weight: 700;
    border-radius: 5px; padding: 8px 22px; cursor: pointer; letter-spacing: 1px;
  }
  .modal-yes {
    background: var(--accent2); color: #121016; border: none;
  }
  .modal-yes:hover { filter: brightness(1.1); }
  .modal-yes.destructive { background: var(--bad); }
  .modal-no {
    background: none; color: var(--dim);
    border: 1px solid var(--border); font-weight: 400;
  }
  .modal-no:hover { border-color: var(--accent); color: var(--text); }

  /* ---- toast ---- */
  .toast {
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--panel); border: 1px solid var(--accent2);
    color: var(--good); border-radius: 8px; padding: 12px 22px;
    font-size: 0.82rem; opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 110; max-width: 90vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="top">
  <h1>Vault Distribution</h1>
  <div class="top-right">
    <span class="sync-note" id="sync-note">syncing…</span>
    <a href="../index.html" class="nav-btn">Dashboard</a>
  </div>
</div>
<p class="sub">Save baby, save baby, save baby save!</p>

<nav>
  <button id="tab-distribute" class="active">DISTRIBUTE</button>
  <button id="tab-history">HISTORY</button>
</nav>

<!-- ============ DISTRIBUTE ============ -->
<div class="page visible" id="page-distribute">

  <div class="pool-panel">
    <div class="pool-row">
      <div>
        <label for="pool-amount">Extra Savings (amount to distribute)</label>
        <input type="number" id="pool-amount" step="0.01" placeholder="$0.00">
      </div>
      <div class="remaining">
        Weight total: <b id="weight-total">100</b>% &nbsp;·&nbsp;
        Checked off: <b id="done-count">0</b> / <span id="vault-count">20</span>
      </div>
    </div>
  </div>

  <div id="weight-warning" style="display:none; background:#2a1620; border:1px solid var(--bad); color:var(--bad); border-radius:8px; padding:10px 16px; margin:-8px 0 24px 0; font-size:0.8rem;"></div>

  <table>
    <thead>
      <tr>
        <th style="width:46px;">Done</th>
        <th>Vault</th>
        <th style="width:130px;" class="transfer">Transfer</th>
        <th style="width:110px;">Weight %</th>
      </tr>
    </thead>
    <tbody id="vault-body"></tbody>
  </table>

  <div class="actions">
    <button class="primary" onclick="saveCycle()">Save Pay Cycle to History</button>
    <button class="danger" onclick="resetCycle()">Reset</button>
  </div>
</div>

<!-- ============ HISTORY ============ -->
<div class="page" id="page-history">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px;">
    <span style="font-size:0.8rem; color:var(--dim);" id="hist-count">0 pay cycles</span>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="danger" onclick="exportHistory()">Export Backup</button>
      <button class="danger" onclick="document.getElementById('import-file').click()">Import Backup</button>
      <button class="danger" id="btn-clear-history" onclick="clearHistory()">Clear All History</button>
      <input type="file" id="import-file" accept=".json,application/json" style="display:none;" onchange="importHistory(this)">
    </div>
  </div>
  <table>
    <thead>
      <tr>
        <th style="width:120px;">Date</th>
        <th style="width:150px;" class="transfer">Extra Savings</th>
        <th style="width:100px;" class="transfer">Vaults</th>
        <th style="width:60px;"></th>
      </tr>
    </thead>
    <tbody id="history-body"></tbody>
  </table>
  <div class="empty" id="hist-empty">No pay cycles saved yet. Complete a distribution, then click "Save Pay Cycle to History".</div>
</div>

<!-- ============ MODAL + TOAST ============ -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box">
    <h2 id="modal-title"></h2>
    <p id="modal-message"></p>
    <div class="modal-buttons">
      <button class="modal-no" id="modal-no">NO</button>
      <button class="modal-yes" id="modal-yes">YES</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../db.js"></script>
<script>
// ==========================================================
// VAULT DISTRIBUTION — CLOUD EDITION
// Scope: SHARED (both accounts see and contribute)
//   - vault config + in-progress cycle -> app_data blobs
//   - saved pay cycles                -> vault_history rows
//   - deleting history / clearing     -> admin only (DB-enforced)
// ==========================================================

const DEFAULT_VAULTS = [
  { name: "420", weight: 2 },
  { name: "Advantage", weight: 0 },
  { name: "All for the Pussy!", weight: 11 },
  { name: "Aly personal", weight: 8 },
  { name: "Birthday", weight: 1 },
  { name: "Bribery fund", weight: 1 },
  { name: "Clothes", weight: 1 },
  { name: "Dining & Coffee", weight: 0 },
  { name: "Emergency Fund", weight: 8 },
  { name: "Groceries", weight: 20 },
  { name: "His Royal Bitchness", weight: 3 },
  { name: "Home Improvement", weight: 5 },
  { name: "Iri personal", weight: 2 },
  { name: "Medical", weight: 4 },
  { name: "Play Money", weight: 10 },
  { name: "Savor Card", weight: 0 },
  { name: "Shitscriptions", weight: 3 },
  { name: "Tali Personal", weight: 8 },
  { name: "Tech replacement", weight: 8 },
  { name: "Transportation", weight: 5 },
];

const CFG_KEY  = "savich-vault-config";
const CUR_KEY  = "savich-vault-current";

let vaults  = DEFAULT_VAULTS.map(v => ({ ...v }));
let current = { amount: "", done: {} };
let history = [];          // vault_history rows from the cloud
let IS_ADMIN = false;

// ==========================================================
// CLOUD HELPERS (direct to supabase, shared scope)
// ==========================================================
async function ensureAuth() {
  if (typeof requireAuth === "function") return await requireAuth();
  const { data } = await sb().auth.getSession();
  if (!data || !data.session) {
    location.href = "../auth.html?next=" + encodeURIComponent(location.pathname);
    throw new Error("not signed in");
  }
}

async function getBlob(key) {
  const { data, error } = await sb()
    .from("app_data").select("data")
    .eq("key", key).eq("owner", "shared").maybeSingle();
  if (error) throw error;
  return data ? data.data : null;
}

async function putBlob(key, dataObj) {
  const { error } = await sb()
    .from("app_data")
    .upsert({ key: key, owner: "shared", data: dataObj });
  if (error) throw error;
}

async function loadHistoryRows() {
  const { data, error } = await sb()
    .from("vault_history").select("*")
    .eq("owner", "shared")
    .order("cycle_date", { ascending: true })
    .order("id", { ascending: true });
  if (error) throw error;
  history = data || [];
}

function setSync(ok, msg) {
  const el = document.getElementById("sync-note");
  el.textContent = ok ? (msg || "✓") : "offline — changes NOT saved";
  el.classList.toggle("live", !!ok);
}

// ==========================================================
// TRANSFER MATH (unchanged)
// ==========================================================
function transferFor(amount, weight) {
  if (amount === "" || !Number.isFinite(amount)) return "";
  if (weight === "" || !Number.isFinite(weight)) return "";
  return Math.round(amount * weight) / 100;
}

function money(n) {
  return "$" + Number(n).toLocaleString("en-US",
    { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function poolAmount() {
  const v = parseFloat(document.getElementById("pool-amount").value);
  return Number.isFinite(v) ? v : "";
}

// ==========================================================
// CUSTOM MODAL
// ==========================================================
let modalResolve = null;

function askConfirm(title, message, destructive) {
  return new Promise(resolve => {
    modalResolve = resolve;
    document.getElementById("modal-title").textContent = title;
    document.getElementById("modal-message").textContent = message;
    const yes = document.getElementById("modal-yes");
    yes.classList.toggle("destructive", !!destructive);
    document.getElementById("modal-overlay").classList.add("open");
  });
}

function closeModal(result) {
  document.getElementById("modal-overlay").classList.remove("open");
  if (modalResolve) { modalResolve(result); modalResolve = null; }
}

document.getElementById("modal-yes").onclick = () => closeModal(true);
document.getElementById("modal-no").onclick = () => closeModal(false);
document.getElementById("modal-overlay").addEventListener("click", e => {
  if (e.target === document.getElementById("modal-overlay")) closeModal(false);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" &&
      document.getElementById("modal-overlay").classList.contains("open")) {
    closeModal(false);
  }
});

// ==========================================================
// TOAST
// ==========================================================
let toastTimer = null;
function showToast(message) {
  const t = document.getElementById("toast");
  t.textContent = message;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 3200);
}

// ==========================================================
// RENDER DISTRIBUTE TABLE
// ==========================================================
function renderVaults() {
  const tbody = document.getElementById("vault-body");
  tbody.innerHTML = "";
  const amount = poolAmount();

  const order = [...vaults].sort((a, b) => {
    const da = current.done[a.name] ? 1 : 0;
    const db = current.done[b.name] ? 1 : 0;
    return da - db;
  });

  order.forEach(v => {
    const t = transferFor(amount, v.weight);
    const tr = document.createElement("tr");
    if (current.done[v.name]) tr.className = "done";
    tr.innerHTML =
      '<td><input type="checkbox" class="cb"' +
        (current.done[v.name] ? " checked" : "") +
        ' onchange="toggleDone(\'' + encodeURIComponent(v.name) + '\')"></td>' +
      "<td>" + v.name + "</td>" +
      '<td class="transfer">' + (t === "" ? "—" : money(t)) + "</td>" +
      '<td><input type="number" class="weight" min="0" max="100" step="0.5" value="' +
        v.weight + '" onchange="setWeight(' +
        vaults.indexOf(v) + ', this.value)"></td>';
    tbody.appendChild(tr);
  });

  const wt = vaults.reduce((s, v) => s + (Number(v.weight) || 0), 0);
  const wtEl = document.getElementById("weight-total");
  wtEl.textContent = wt;
  const warnEl = document.getElementById("weight-warning");
  if (wt === 100) {
    wtEl.style.color = "var(--accent2)";
    warnEl.style.display = "none";
  } else {
    wtEl.style.color = "var(--bad)";
    warnEl.style.display = "block";
    warnEl.textContent =
      "⚠ Weights add up to " + wt + "%, not 100% — " +
      (wt < 100
        ? (100 - wt) + "% is unassigned."
        : (wt - 100) + "% too much assigned.");
  }
  const dc = vaults.filter(v => current.done[v.name]).length;
  document.getElementById("done-count").textContent = dc;
  document.getElementById("vault-count").textContent = vaults.length;
}

function toggleDone(encName) {
  const name = decodeURIComponent(encName);
  current.done[name] = !current.done[name];
  putBlob(CUR_KEY, current).then(() => setSync(true)).catch(err => setSync(false));
  renderVaults();
}

function setWeight(i, val) {
  vaults[i].weight = val === "" ? 0 : Number(val);
  putBlob(CFG_KEY, { vaults: vaults }).then(() => setSync(true)).catch(err => setSync(false));
  renderVaults();
}

let curSaveTimer = null;
document.getElementById("pool-amount").addEventListener("input", () => {
  current.amount = document.getElementById("pool-amount").value;
  renderVaults();
  clearTimeout(curSaveTimer);
  curSaveTimer = setTimeout(() => {
    putBlob(CUR_KEY, current).then(() => setSync(true)).catch(err => setSync(false));
  }, 600);
});

// ==========================================================
// SAVE CYCLE — inserts a vault_history row
// ==========================================================
async function saveCycle() {
  const amount = poolAmount();
  if (amount === "" || amount <= 0) {
    showToast("Enter the Extra Savings amount first.");
    return;
  }

  const wt = vaults.reduce((s, v) => s + (Number(v.weight) || 0), 0);
  if (wt !== 100) {
    showToast("Weights total " + wt + "%, not 100% — fix them before saving.");
    return;
  }

  const entries = vaults.map(v => ({
    name: v.name,
    weight: v.weight,
    transfer: transferFor(amount, v.weight)
  }));

  const ok = await askConfirm(
    "Save this Pay Cycle to History?",
    "Extra Savings: " + money(amount) + "\n" +
    "Vaults distributed: " + vaults.length,
    false
  );
  if (!ok) return;

  const d = new Date();
  const dateStr = d.getFullYear() + "-" +
    String(d.getMonth() + 1).padStart(2, "0") + "-" +
    String(d.getDate()).padStart(2, "0");

  try {
    const { error } = await sb().from("vault_history").insert([{
      owner: "shared",
      cycle_date: dateStr,
      amount: amount,
      entries: entries,
      done_state: { ...current.done }
    }]);
    if (error) throw error;

    current = { amount: "", done: {} };
    await putBlob(CUR_KEY, current);
    document.getElementById("pool-amount").value = "";

    await loadHistoryRows();
    renderVaults();
    renderHistory();
    setSync(true);
    showToast("Pay cycle saved to history.");
  } catch (err) {
    console.error(err);
    setSync(false);
    showToast("Could not save — check your connection.");
  }
}

// ==========================================================
// RESET
// ==========================================================
async function resetCycle() {
  const ok = await askConfirm(
    "Reset Vault Distribution?",
    "This does NOT save the pay cycle to history. Save first if you want to keep it.",
    false
  );
  if (!ok) return;
  current = { amount: "", done: {} };
  try {
    await putBlob(CUR_KEY, current);
    setSync(true);
  } catch { setSync(false); }
  document.getElementById("pool-amount").value = "";
  renderVaults();
  showToast("Ready for the next pay cycle.");
}

// ==========================================================
// HISTORY (rows come from vault_history)
// ==========================================================
function renderHistory() {
  const tbody = document.getElementById("history-body");
  const empty = document.getElementById("hist-empty");
  tbody.innerHTML = "";

  document.getElementById("hist-count").textContent =
    history.length + " pay cycle" + (history.length === 1 ? "" : "s");

  if (history.length === 0) { empty.style.display = "block"; return; }
  empty.style.display = "none";

  const sorted = [...history].reverse();

  sorted.forEach(row => {
    const [y, m, d] = row.cycle_date.split("-");
    const tr = document.createElement("tr");
    tr.className = "hist-row";
    tr.onclick = () => toggleDetail(tr, row);
    tr.innerHTML =
      "<td>" + (m + "/" + d + "/" + y) + "</td>" +
      '<td class="transfer">' + money(row.amount) + "</td>" +
      '<td class="transfer">' + (row.entries ? row.entries.length : 0) + "</td>" +
      '<td style="color:var(--dim); font-size:0.75rem;">&#9662;</td>';
    tbody.appendChild(tr);
  });
}

function toggleDetail(tr, row) {
  const existing = document.getElementById("detail-" + row.id);
  if (existing) { existing.remove(); return; }

  const detail = document.createElement("tr");
  detail.className = "detail-row";
  detail.id = "detail-" + row.id;
  const cells = (row.entries || []).map(e =>
    "<div><span class='v'>" + e.name + " (" + e.weight + "%)</span>" +
    "<span class='a'>" + money(e.transfer) + "</span></div>").join("");
  detail.innerHTML = '<td colspan="4"><div class="detail-grid">' + cells + "</div></td>";
  tr.after(detail);
}

// Clear All = admin only at the DB level; hide button for members
async function clearHistory() {
  if (!IS_ADMIN) {
    showToast("Only the household admin can clear history.");
    return;
  }
  const ok = await askConfirm(
    "Delete entire history?",
    "This cannot be undone. Every pay cycle on every device will be gone.",
    true
  );
  if (!ok) return;
  try {
    const { error } = await sb().from("vault_history").delete().eq("owner", "shared");
    if (error) throw error;
    await loadHistoryRows();
    renderHistory();
    setSync(true);
    showToast("History cleared.");
  } catch (err) {
    console.error(err);
    setSync(false);
    showToast("Could not clear history.");
  }
}

// ==========================================================
// EXPORT / IMPORT BACKUP (also the migration path:
// export from the old local page, import here)
// ==========================================================
function exportHistory() {
  const payload = {
    vaults: vaults,
    history: history.map(r => ({
      date: r.cycle_date,
      amount: Number(r.amount),
      entries: r.entries || [],
      doneState: r.done_state || {}
    }))
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "vault-backup-" + new Date().toISOString().slice(0, 10) + ".json";
  a.click();
  URL.revokeObjectURL(a.href);
  showToast("Backup downloaded (" + payload.history.length + " cycles).");
}

async function importHistory(input) {
  const file = input.files && input.files[0];
  input.value = "";
  if (!file) return;

  let parsed;
  try {
    parsed = JSON.parse(await file.text());
  } catch {
    showToast("That file isn't valid JSON.");
    return;
  }

  // Accept either the full backup format or a bare history array
  let impVaults = null;
  let cycles = null;
  if (Array.isArray(parsed)) {
    cycles = parsed;
  } else if (parsed && typeof parsed === "object") {
    if (Array.isArray(parsed.history)) cycles = parsed.history;
    if (Array.isArray(parsed.vaults)) impVaults = parsed.vaults;
  }

  if (!cycles && !impVaults) {
    showToast("No recognizable vault data in that file.");
    return;
  }

  const lines = [];
  if (impVaults) lines.push(impVaults.length + " vaults (names + weights)");
  if (cycles) lines.push(cycles.length + " pay cycles");
  if (!impVaults && cycles && !cycles.every(c => Array.isArray(c.entries))) {
    showToast("Some cycles look malformed — aborting.");
    return;
  }

  const ok = await askConfirm(
    "Import this backup?",
    "Will add to the shared cloud data:\n" + lines.join("\n"),
    false
  );
  if (!ok) return;

  try {
    if (impVaults) {
      vaults = impVaults;
      await putBlob(CFG_KEY, { vaults: vaults });
    }
    if (cycles && cycles.length) {
      const rows = cycles.map(c => ({
        owner: "shared",
        cycle_date: c.date,
        amount: Number(c.amount),
        entries: c.entries || [],
        done_state: c.doneState || c.done_state || {}
      }));
      const { error } = await sb().from("vault_history").insert(rows);
      if (error) throw error;
    }
    await loadHistoryRows();
    renderVaults();
    renderHistory();
    setSync(true);
    showToast("Backup imported to the cloud.");
  } catch (err) {
    console.error(err);
    setSync(false);
    showToast("Import failed — nothing was half-added.");
  }
}

// ==========================================================
// TABS
// ==========================================================
document.getElementById("tab-distribute").onclick = () => switchTab("distribute");
document.getElementById("tab-history").onclick = () => switchTab("history");

function switchTab(name) {
  document.querySelectorAll("nav button")
    .forEach(b => b.classList.remove("active"));
  document.getElementById("tab-" + name).classList.add("active");
  document.querySelectorAll(".page")
    .forEach(p => p.classList.remove("visible"));
  document.getElementById("page-" + name).classList.add("visible");
}

// ==========================================================
// INIT — gate, then load everything from the cloud
// ==========================================================
(async function init() {
  try {
    await ensureAuth();
  } catch (e) {
    return; // redirecting to login
  }

  // admin check drives UI (the DB enforces regardless)
  try {
    const { data, error } = await sb().rpc("is_admin");
    IS_ADMIN = !error && data === true;
  } catch { IS_ADMIN = false; }
  if (!IS_ADMIN) {
    document.getElementById("btn-clear-history").style.display = "none";
  }

  try {
    const cfg = await getBlob(CFG_KEY);
    if (cfg && Array.isArray(cfg.vaults) && cfg.vaults.length) {
      vaults = cfg.vaults;
    } else if (Array.isArray(cfg) && cfg.length) {
      vaults = cfg; // older blob format, just in case
    }

    const cur = await getBlob(CUR_KEY);
    if (cur) {
      current = { amount: cur.amount || "", done: cur.done || {} };
    }

    await loadHistoryRows();
    setSync(true);
  } catch (err) {
    console.error(err);
    setSync(false);
    showToast("Loaded locally-known data — cloud unreachable.");
  }

  document.getElementById("pool-amount").value = current.amount || "";
  renderVaults();
  renderHistory();
})();
</script>
