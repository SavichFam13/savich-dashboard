<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M18 40 L18 14 L40 28 Q50 22 60 28 L82 14 L82 40 Q82 86 50 86 Q18 86 18 40 Z' fill='%2314111a' stroke='%23c9a0ff' stroke-width='5' stroke-linejoin='round'/%3E%3Cellipse cx='36' cy='54' rx='5' ry='8' fill='%235fd3c4'/%3E%3Cellipse cx='64' cy='54' rx='5' ry='8' fill='%235fd3c4'/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media Collection</title>
<link rel="stylesheet" href="../common.css">
<style>
body {background: var(--bg);
  color: var(--text);
  font-family: Verdana, Geneva, Tahoma, sans-serif;
  font-size: 13px;
  line-height: 1.6;
  max-width: 1340px;
  margin: 0 auto;
  padding: 32px 20px;
}
.masthead { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px; margin-bottom: 10px; }
.masthead h1 { font-size: 1.4rem; }
.masthead .sub { margin-top: 2px; }
.top-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
header h1 { color: var(--accent); font-size: 1.4rem; font-weight: 700; }
header .sub { color: var(--dim); font-size: 0.8rem; margin-top: 4px; }
.btn-topbar {
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--dim);
  border-radius: 8px;
  padding: 6px 14px;
  font-family: inherit;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
}
.btn-topbar:hover { border-color: #ff9ecf; color: #ff9ecf; }
.btn {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 5px;
  color: var(--text);
  font-family: inherit; font-size: 0.78rem; font-weight: 700;
  padding: 8px 14px; cursor: pointer;
}
.btn:hover { border-color: var(--accent2); }
.btn-primary {
  background: var(--accent2);
  color: #121016;
  border: 1px solid var(--accent2);
  font-weight: 700;
}
.btn-primary:hover { filter: brightness(1.1); }
.btn-pink {
  background: none;
  border: 1px solid var(--hot-pink);
  color: var(--hot-pink);
}
.btn-pink:hover { filter: brightness(1.2); }
.btn-danger {
  background: none;
  border: 1px solid var(--bad);
  color: var(--bad);
}
.btn-danger:hover { background: #2a1620; }
.btn:disabled { opacity: 0.4; cursor: default; }
a.btn { text-decoration: none; display: inline-block; }
input[type="text"], select {
  background: #16131d;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 5px;
  font-family: inherit; font-size: 0.82rem;
  padding: 8px 10px;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent2); }
input[type="checkbox"]:focus { outline: 2px solid var(--accent2); outline-offset: 2px; }
input[type="checkbox"] { accent-color: var(--accent2); width: 16px; height: 16px; cursor: pointer; }
textarea {
  background: #16131d;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 5px;
  font-family: inherit; font-size: 0.82rem;
  padding: 8px 10px;
  resize: vertical;
}
label.f-label {
  display: block;
  color: var(--dim);
  font-size: 0.68rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.5px;
  margin-bottom: 4px;
}
.check-row {
  display: flex; align-items: center; gap: 10px;
  background: #16131d; border: 1px solid var(--border); border-radius: 5px;
  padding: 10px 12px; cursor: pointer; user-select: none;
}
.check-row:hover { border-color: var(--accent2); }
.check-row span { font-size: 0.82rem; }
nav.tabs { display: flex; gap: 6px; border-bottom: 2px solid var(--border); margin: 12px 0 16px; flex-wrap: wrap; }
nav.tabs button {
  background: none; border: none; color: var(--dim);
  font-family: inherit; font-size: 0.78rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 1.5px;
  padding: 10px 14px; cursor: pointer;
  border-bottom: 2px solid transparent; margin-bottom: -2px;
}
nav.tabs button:hover { color: var(--text); }
nav.tabs button.active { color: var(--accent2); border-bottom-color: var(--accent2); }
.page { display: none; }
.page.visible { display: block; }
.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 20px;
  margin-bottom: 20px;
}
.section-title {
  color: var(--hot-pink);
  font-size: 0.74rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-bottom: 12px;
}
.owned-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 900px) { .owned-cols { grid-template-columns: 1fr; } }
.type-col { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
.type-col > h2 {
  color: var(--accent2); font-size: 0.9rem; text-transform: uppercase;
  letter-spacing: 2px; margin-bottom: 4px;
}
.type-count { color: var(--dim); font-size: 0.75rem; margin-bottom: 14px; }
.cat-group { margin-bottom: 16px; }
.cat-head {
  color: var(--hot-pink);
  font-size: 0.74rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 1.5px;
  padding-bottom: 4px; border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; gap: 10px;
  cursor: pointer; user-select: none;
}
.cat-head > span:first-child { min-width: 0; overflow-wrap: anywhere; }
.cat-head .chev { color: var(--dim); flex-shrink: 0; }
.cat-body { padding-top: 4px; }
.cat-body.collapsed { display: none; }
.media-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 5px 8px;
  border-bottom: 1px solid #26212e;
}
.media-item:nth-child(even) { background: #171420; }
.media-item:hover { background: #1d1926; }
.mi-title { font-size: 0.85rem; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.mi-name {
  cursor: pointer;
  border-bottom: 1px dotted var(--dim);
}
.mi-name:hover { color: var(--accent); border-bottom-color: var(--accent); }
.mi-year { color: var(--dim); font-size: 0.72rem; }
.mi-actions { display: flex; gap: 6px; flex-shrink: 0; }
.mini-btn {
  background: none; border: 1px solid var(--border); border-radius: 4px;
  color: var(--dim); font-family: inherit; font-size: 0.7rem;
  padding: 2px 8px; cursor: pointer;
}
.mini-btn:hover { border-color: var(--accent2); color: var(--accent2); }
.mini-btn.del:hover { border-color: var(--bad); color: var(--bad); }
/* CC toggle: green when the item has subtitles, not just on hover */
.mini-btn.cc-toggle { min-width: 46px; }
.mini-btn.cc-toggle.cc-on {
  border-color: var(--good); color: var(--good); background: rgba(125,219,163,0.08);
}
.mini-btn.cc-toggle.cc-on:hover { filter: brightness(1.15); }
table { width: 100%; border-collapse: collapse; }
th {
  color: var(--dim); font-size: 0.7rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.5px;
  text-align: left; padding: 8px 10px;
  border-bottom: 1px solid var(--border);
}
td { padding: 6px 10px; border-bottom: 1px solid #26212e; font-size: 0.83rem; }
tr:nth-child(even) td { background: #171420; }
tr:hover td { background: #1d1926; }
.badge {
  display: inline-block;
  font-size: 0.66rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
  border-radius: 4px; padding: 1px 8px;
}
.badge.movie { color: var(--accent2); border: 1px solid var(--accent2); }
.badge.tv { color: var(--hot-pink); border: 1px solid var(--hot-pink); }
.random-zone { text-align: center; padding: 34px 20px; }
.slot {
  min-height: 96px;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  gap: 8px; margin: 18px 0;
}
.slot-title {
  font-size: 1.6rem; font-weight: 700; color: var(--accent);
  letter-spacing: 0.5px;
}
.slot-meta { color: var(--dim); font-size: 0.8rem; }
.slot-meta .badge { margin-right: 8px; }
.spinning { color: var(--accent2); font-size: 1.2rem; animation: blink 0.35s infinite alternate; }
@keyframes blink { from { opacity: 1; } to { opacity: 0.25; } }
.rand-stats { color: var(--dim); font-size: 0.75rem; margin-top: 6px; }
.summary-strip {
  display: flex; gap: 24px; flex-wrap: wrap;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 8px; padding: 16px 20px; margin-bottom: 20px;
}
.sum-item .sum-num { color: var(--accent2); font-size: 1.3rem; font-weight: 700; }
.sum-item .sum-label { color: var(--dim); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 1px; }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.toolbar input[type="text"] { flex: 1; min-width: 160px; }
.empty-note { color: var(--dim); font-size: 0.8rem; font-style: italic; padding: 8px 8px; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
.step-tag {
  color: var(--dim);
  font-size: 0.66rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 1.5px;
  margin-bottom: 12px;
}
.ai-step { display: none; }
.ai-step.show { display: grid; gap: 14px; align-content: start; }
.star-row { display: flex; align-items: center; gap: 2px; }
.star-btn {
  background: none; border: none;
  color: var(--dim); font-size: 1.4rem;
  cursor: pointer; padding: 0 2px;
  line-height: 1.2;
}
.star-btn.sel { color: var(--hot-pink); }
.star-btn:hover { transform: scale(1.15); }
.star-clear {
  background: none; border: none;
  color: var(--dim); font-family: inherit;
  font-size: 0.68rem; cursor: pointer;
  margin-left: 8px; text-decoration: underline;
}
.star-clear:hover { color: var(--text); }
.media-chip {
  position: fixed;
  z-index: 150;
  background: var(--panel);
  border: 1px solid var(--accent);
  border-radius: 10px;
  padding: 14px 16px;
  max-width: 320px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
.media-chip .menu-x {
  background: none; border: none;
  color: var(--dim); cursor: pointer;
  font-family: inherit; font-size: 0.9rem;
  float: right; margin: -2px -2px 4px 10px; padding: 0;
}
.media-chip .menu-x:hover { color: #ff8a8a; }
.chip-title {
  color: var(--accent);
  font-weight: 700; font-size: 0.9rem;
  margin-bottom: 8px;
  padding-right: 70px;
}
.chip-row { font-size: 0.8rem; margin-bottom: 4px; display: flex; align-items: baseline; gap: 10px; }
.chip-k {
  color: var(--dim);
  text-transform: uppercase;
  font-size: 0.64rem; font-weight: 700;
  letter-spacing: 0.5px;
  flex-shrink: 0;
  white-space: nowrap;
}
.chip-stars { color: var(--hot-pink); letter-spacing: 2px; }
.chip-notes {
  font-size: 0.78rem;
  margin: 8px 0 10px;
  white-space: pre-wrap;
  border-top: 1px solid var(--border);
  padding-top: 8px;
}
</style>
</head>
<body>
<header class="masthead">
  <div>
    <h1>Media Collection</h1>
    <p class="sub">Own it. Want it. Spin the wheel and watch it.</p>
    <p class="sub" style="font-size:0.7rem;opacity:0.8;">Right click title to edit or delete.</p>
  </div>
  <div class="top-right">
    <span class="sync-note" id="sync-note">syncing…</span>
    <button class="btn-topbar" id="btnImport">Import</button>
    <button class="btn-topbar" id="btnExport">Export</button>
    <div id="nav"></div>
  </div>
</header>
<nav class="tabs">
  <button data-tab="owned" class="active">Owned</button>
  <button data-tab="wishlist">Wishlist</button>
  <button data-tab="random">Random Pick</button>
  <button data-tab="manage">Manage</button>
</nav>
<div class="summary-strip" id="summaryStrip"></div>
<section class="page visible" id="page-owned">
  <div class="toolbar">
    <input type="text" id="ownedSearch" placeholder="Search owned titles...">
    <select id="ownedTypeFilter">
      <option value="">All Types</option>
      <option value="movie">Movies Only</option>
      <option value="tv">TV Shows Only</option>
    </select>
    <select id="ownedCatFilter">
      <option value="">All Categories</option>
    </select>
    <select id="ownedSubsFilter">
      <option value="">All Subtitles</option>
      <option value="has">Has Subtitles</option>
      <option value="needs">Needs Subtitles</option>
    </select>
  </div>
  <div class="owned-cols" id="ownedCols"></div>
</section>
<section class="page" id="page-wishlist">
  <div class="toolbar">
    <input type="text" id="wishSearch" placeholder="Search wishlist titles...">
    <select id="wishTypeFilter">
      <option value="">All Types</option>
      <option value="movie">Movies Only</option>
      <option value="tv">TV Shows Only</option>
    </select>
    <button class="btn btn-pink" id="btnAddWish">+ Add to Wishlist</button>
  </div>
  <div class="panel" style="padding:0;">
    <table>
      <thead>
        <tr>
          <th>Title</th>
          <th>Type</th>
          <th>Category</th>
          <th style="width:230px;"></th>
        </tr>
      </thead>
      <tbody id="wishBody"></tbody>
    </table>
  </div>
</section>
<section class="page" id="page-random">
  <div class="panel random-zone">
    <div class="section-title">Can't Decide? Roll For It</div>
    <div class="slot" id="slot">
      <div class="slot-title" id="slotTitle">Ready to roll 🎬</div>
      <div class="slot-meta" id="slotMeta">Pick a button below and destiny takes over.</div>
    </div>
    <div style="display:flex; gap:14px; justify-content:center; flex-wrap:wrap;">
      <button class="btn btn-pink" id="btnRandMovie">🎲 Random Movie</button>
      <button class="btn btn-pink" id="btnRandTV">🎲 Random TV Show</button>
    </div>
    <div class="rand-stats" id="randStats"></div>
  </div>
</section>
<section class="page" id="page-manage">
  <div class="panel">
    <div class="section-title">Categories</div>
    <div style="display:flex; gap:10px; margin-bottom:10px;">
      <input type="text" id="newCatInput" placeholder="New category name (e.g. Anime, Documentary...)" style="flex:1;">
      <button class="btn btn-pink" id="btnAddCat">+ Add Category</button>
    </div>
    <div id="catList" style="display:flex; flex-wrap:wrap; gap:8px;"></div>
  </div>
</section>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
<h2 id="modalTitle"></h2>
<p id="modalMsg"></p>
<div class="modal-buttons">
  <button class="modal-yes" id="modalYes">YES</button>
  <button class="modal-no" id="modalNo">NO</button>
</div>
  </div>
</div>
<div class="modal-overlay" id="addItemOverlay">
  <div class="modal-box">
    <h2 id="addItemHeading">Add Item</h2>
    <div style="display:grid; gap:12px;">
      <div class="ai-step show" id="aiStep1">
        <div>
          <label class="f-label">Title</label>
          <input type="text" id="aiTitle" style="width:100%;">
        </div>
        <div>
          <label class="f-label">Type</label>
          <select id="aiType" style="width:100%;">
            <option value="movie">Movie</option>
            <option value="tv">TV Show</option>
          </select>
        </div>
        <div>
          <label class="f-label">Category</label>
          <select id="aiCat" style="width:100%;"></select>
        </div>
        <div>
          <label class="f-label">Collection / Series</label>
          <input type="text" id="aiColl" list="collList" style="width:100%;" placeholder="e.g. Doctor Who, Matrix">
          <datalist id="collList"></datalist>
        </div>
        <div>
          <label class="f-label">Subtitles</label>
          <label class="check-row">
            <input type="checkbox" id="aiSubs">
            <span>Has subtitles</span>
          </label>
        </div>
      </div>
      <div class="ai-step" id="aiStep2">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
          <div>
            <label class="f-label">Year Released:</label>
            <input type="text" id="aiYear" inputmode="numeric" placeholder="e.g. 1994" style="width:100%;">
          </div>
          <div>
            <label class="f-label">Season #<br>(TV SHOW ONLY)</label>
            <input type="text" id="aiSeason" inputmode="numeric" placeholder="e.g. 3" style="width:100%;">
          </div>
          <div>
            <label class="f-label">Movie # / Episode # (OPTIONAL)</label>
            <input type="text" id="aiEp" inputmode="numeric" placeholder="movie # · TV: ep #" style="width:100%;">
          </div>
        </div>
        <div>
          <label class="f-label">Our rating</label>
          <div class="star-row" id="aiStars"></div>
        </div>
        <div>
          <label class="f-label">Notes</label>
          <textarea id="aiNotes" rows="4" style="width:100%;" placeholder="Thoughts, favorite scenes, etc..."></textarea>
        </div>
      </div>
    </div>
    <div class="modal-actions" style="margin-top:18px;">
      <button class="btn" id="aiCancel">Cancel</button>
      <button class="btn" id="aiBack" style="display:none;">Back</button>
      <button class="btn btn-primary" id="aiNext">Next</button>
      <button class="btn btn-primary" id="aiSave" style="display:none;">Save</button>
    </div>
  </div>
</div>
<input type="file" id="importFile" accept=".json" style="display:none;">
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../db.js"></script>
<script src="../rollover.js"></script>
<script src="../nav.js"></script>
<script>
"use strict";
var CLOUD_KEY = "savich-media";
var CACHE_KEY = "savich-media-cache";
var LEGACY_ITEMS_KEY = "savich-media-v1";
var LEGACY_CATS_KEY = "savich-media-cats-v1";
var DEFAULT_CATS = ["Sci-Fi", "Horror", "Fantasy", "Action", "Comedy", "Drama", "Animation", "Documentary", "Thriller", "Other"];
var items = [];
var cats = DEFAULT_CATS.slice();
var cloudReady = false;
var lastSyncedPrint = null;
var saveQueued = false;
var saveTimer = null;
var rtReloadTimer = null;
function on(id, evt, fn) {
  var el = document.getElementById(id);
  if (el) el.addEventListener(evt, fn);
  else console.warn("Media page: element #" + id + " not found — handler skipped");
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function snapshot() { return { items: items, cats: cats }; }
function adoptState(value) {
  var o = value && typeof value === "object" ? value : {};
  items = Array.isArray(o.items) ? o.items : [];
  cats = (Array.isArray(o.cats) && o.cats.length) ? o.cats : DEFAULT_CATS.slice();
}
function fingerprint() {
  try { return JSON.stringify(snapshot()); } catch (e) { return ""; }
}
function loadCache() {
  try { return JSON.parse(localStorage.getItem(CACHE_KEY)); } catch (e) { return null; }
}
function cacheLocal() {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(snapshot())); } catch (e) {}
}
function loadLegacy() {
  try {
    var li = JSON.parse(localStorage.getItem(LEGACY_ITEMS_KEY) || "null");
    var lc = JSON.parse(localStorage.getItem(LEGACY_CATS_KEY) || "null");
    if (Array.isArray(li) && li.length) return { items: li, cats: Array.isArray(lc) && lc.length ? lc : DEFAULT_CATS.slice() };
  } catch (e) {}
  return null;
}
function setSync(ok, message) {
  var el = document.getElementById("sync-note");
  if (!el) return;
  el.textContent = ok ? (message || "✓") : "offline — changes NOT saved";
  el.classList.toggle("live", !!ok);
}
function save(immediate) {
  if (!cloudReady) return;
  clearTimeout(saveTimer);
  var finishOk = function () {
    lastSyncedPrint = fingerprint();
    saveQueued = false;
    setSync(true);
  };
  var fail = function (err) {
    saveQueued = false;
    console.error("Media cloud save failed:", err && err.message);
    setSync(false);
  };
  if (immediate) {
    saveDash(CLOUD_KEY, snapshot()).then(finishOk).catch(fail);
  } else {
    saveQueued = true;
    setSync(true, "☁️ saving…");
    saveTimer = setTimeout(function () {
      saveDash(CLOUD_KEY, snapshot()).then(finishOk).catch(fail);
    }, 900);
  }
}
function persist(immediate) {
  cacheLocal();
  save(immediate);
}
function setupRealtime() {
  sb()
    .channel("media-realtime")
    .on("postgres_changes",
      { event: "*", schema: "public", table: "app_data" },
      function () { scheduleRemoteReload(); })
    .subscribe();
}
function scheduleRemoteReload() {
  if (saveQueued) {
    clearTimeout(rtReloadTimer);
    rtReloadTimer = setTimeout(scheduleRemoteReload, 1000);
    return;
  }
  clearTimeout(rtReloadTimer);
  rtReloadTimer = setTimeout(async function () {
    try {
      var cloud = await loadDash(CLOUD_KEY);
      if (!cloud) return;
      var o = cloud && typeof cloud === "object" ? cloud : {};
      var normalized = {
        items: Array.isArray(o.items) ? o.items : [],
        cats: (Array.isArray(o.cats) && o.cats.length) ? o.cats : DEFAULT_CATS.slice()
      };
      var fp = JSON.stringify(normalized);
      if (lastSyncedPrint !== null && fp === lastSyncedPrint) return;
      if (fp === fingerprint()) return;
      adoptState(cloud);
      lastSyncedPrint = fingerprint();
      cacheLocal();
      renderAll();
    } catch (e) {
      console.warn("realtime reload skipped:", e && e.message);
    }
  }, 300);
}
adoptState(loadCache());
if (!items.length) {
  var legacy = loadLegacy();
  if (legacy) { items = legacy.items; cats = legacy.cats; }
}
var toastTimer = null;
function toast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2600);
}
function askConfirm(title, msg, destructive, labels) {
  var L = labels || {};
  return new Promise(function (resolve) {
    var ov = document.getElementById("modalOverlay");
    document.getElementById("modalTitle").textContent = title;
    document.getElementById("modalMsg").textContent = msg;
    document.getElementById("modalYes").textContent = L.yes || "YES";
    document.getElementById("modalNo").textContent = L.no || "NO";
    document.getElementById("modalYes").classList.toggle("destructive", !!destructive);
    ov.classList.add("open");
    function done(val) {
      ov.classList.remove("open");
      document.getElementById("modalYes").removeEventListener("click", yes);
      document.getElementById("modalNo").removeEventListener("click", no);
      ov.removeEventListener("click", overlay);
      document.removeEventListener("keydown", key);
      resolve(val);
    }
    function yes() { done(true); }
    function no() { done(false); }
    function overlay(e) { if (e.target === ov) done(false); }
    function key(e) { if (e.key === "Escape") done(false); }
    document.getElementById("modalYes").addEventListener("click", yes);
    document.getElementById("modalNo").addEventListener("click", no);
    ov.addEventListener("click", overlay);
    document.addEventListener("keydown", key);
  });
}
var tabBtns = document.querySelectorAll("nav.tabs button");

function renderAiStars() {
  var el = document.getElementById("aiStars");
  var html = "";

    html += '<button type="button" class="star-btn' + (i <= aiStars ? " sel" : "") +
      '" data-star="' + i + '" title="' + i + ' star' + (i > 1 ? "s" : "") + '">★</button>';
  }
  html += aiStars
    ? '<button type="button" class="star-clear" id="aiStarsClear">clear</button>'
    : "";

  el.querySelectorAll("[data-star]").forEach(function (b) {
    b.addEventListener("click", function () {
      var v = Number(b.dataset.star);
      aiStars = (v === aiStars) ? 0 : v;

function epSortKey(i) {
  var s = i.season != null && i.season !== "";
  var e = i.ep != null && i.ep !== "";

    var sn = parseFloat(i.season) || 0;
    var en = parseFloat(i.ep);
    if (isNaN(en)) en = 0;
    return "s" + String(sn).padStart(4, "0") +
      "e" + String(en).padStart(4, "0");
  }
  return "y" + String(i.year || "0000");
}

    if (next) candidates.push(next);
  });
  if (candidates.length) return candidates[Math.floor(Math.random() * candidates.length)];
  return pool[Math.floor(Math.random() * pool.length)];
}
function doRandom(type) {
  var pool = items.filter(function (i) { return i.owned && i.type === type; });
  var slotTitle = document.getElementById("slotTitle");
  var slotMeta = document.getElementById("slotMeta");
  if (!pool.length) {
    slotTitle.textContent = "Nothing to pick from";
    slotMeta.textContent = "Add some owned " + (type === "movie" ? "movies" : "TV shows") + " first.";
    return;
  }
  if (spinning) return;
  var target = rollPick(type);
  spinning = true;
  document.getElementById("btnRandMovie").disabled = true;
  document.getElementById("btnRandTV").disabled = true;
  var ticks = 0, maxTicks = 16;
  slotMeta.innerHTML = '<span class="spinning">Rolling...</span>';
  var iv = setInterval(function () {
    var r = (++ticks >= maxTicks) ? target : pool[Math.floor(Math.random() * pool.length)];
    slotTitle.textContent = r.title;
    if (ticks >= maxTicks) {
      clearInterval(iv);
      spinning = false;
      document.getElementById("btnRandMovie").disabled = false;
      document.getElementById("btnRandTV").disabled = false;
      var extras = [];
      if (r.coll) extras.push(r.coll);
      if (r.year) extras.push(r.year);
      if (r.rating) extras.push(chipStarLine(r.rating) + " " + r.rating + "/5");
      slotMeta.innerHTML = '<span class="badge ' + (r.type === "movie" ? "movie" : "tv") + '">' + (r.type === "movie" ? "Movie" : "TV") + '</span>' +
        '<span>' + esc(r.cat) + (extras.length ? " · " + esc(extras.join(" · ")) : "") +
        (r.subs ? " · subtitles ready" : " · needs subtitles") + "</span>";
      var rollHeading, rollMsg;
      if (r.coll) {
        rollHeading = "Will you watch: " + esc(r.coll);
        rollMsg = esc(r.title) + "\n" + (epTag(r) || "");
      } else {
        rollHeading = "Will you watch it?";
        rollMsg = '"' + esc(r.title) + '"' + (r.year ? " (" + esc(r.year) + ")" : "") + " is up.";
      }
      askConfirm(rollHeading, rollMsg, false, { yes: "YES", no: "NO" }).then(function (go) {
        if (!go) return;
        r.watched = true;
        persist();
        renderAll();
        toast('"' + r.title + '" logged as watched.');
      });
    }
  }, 90);
}
on("btnRandMovie", "click", function () { doRandom("movie"); });
on("btnRandTV", "click", function () { doRandom("tv"); });
function renderCats() {
  var el = document.getElementById("catList");
  el.innerHTML = sortedCats().map(function (c) {
    return '<span style="display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:5px;padding:4px 10px;font-size:0.78rem;">' +
      esc(c) + '<button class="mini-btn del" data-catdel="' + esc(c) + '" title="Remove category">✕</button></span>';
  }).join("");
  el.querySelectorAll("[data-catdel]").forEach(function (b) {
    b.addEventListener("click", function () {
      var c = b.dataset.catdel;
      var used = items.filter(function (i) { return i.cat === c; }).length;
      askConfirm("Remove Category", '"' + c + '" has ' + used + ' item(s). Removing it moves those items to "Other".\n\nThe whole household sees this change.', true, { yes: "REMOVE", no: "KEEP IT" }).then(function (ok) {
        if (!ok) return;
        cats = cats.filter(function (x) { return x !== c; });
        if (cats.indexOf("Other") === -1) cats.push("Other");
        items.forEach(function (i) { if (i.cat === c) i.cat = "Other"; });
        persist(); renderAll(); toast("Category removed.");
      });
    });
  });
}
on("btnAddCat", "click", function () {
  var inp = document.getElementById("newCatInput");
  var v = inp.value.trim();
  if (!v) return;
  if (cats.some(function (c) { return c.toLowerCase() === v.toLowerCase(); })) { toast("Already exists."); return; }
  cats.push(v);
  inp.value = "";
  persist(); renderAll(); toast("Category added.");
});
function refreshFilters() {
  var oc = document.getElementById("ownedCatFilter");
  var cur = oc.value;
  oc.innerHTML = '<option value="">All Categories</option>' + sortedCats().map(function (c) {
    return '<option value="' + esc(c) + '">' + esc(c) + '</option>';
  }).join("");
  oc.value = cur;
}
["ownedSearch", "ownedTypeFilter", "ownedCatFilter", "ownedSubsFilter"].forEach(function (id) {
  on(id, "input", renderOwned);
});
["wishSearch", "wishTypeFilter"].forEach(function (id) {
  on(id, "input", renderWish);
});
on("btnExport", "click", function () {
  var d = new Date().toISOString().slice(0, 10);
  var blob = new Blob([JSON.stringify(snapshot(), null, 2)], { type: "application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "media-backup-" + d + ".json";
  a.click();
  URL.revokeObjectURL(a.href);
  toast("Backup exported.");
});
on("btnImport", "click", function () {
  var imp = document.getElementById("importFile");
  if (imp) imp.click();
});
on("importFile", "change", function (e) {
  var f = e.target.files[0];
  if (!f) return;
  var reader = new FileReader();
  reader.onload = function () {
    try {
      var parsed = JSON.parse(reader.result);
      var inItems = Array.isArray(parsed) ? parsed : parsed.items;
      var inCats = (Array.isArray(parsed) ? null : parsed.cats);
      if (!Array.isArray(inItems)) throw 0;
      askConfirm("Import Backup", "This overwrites everything on this page with the contents of the backup file. Continue?", true, { yes: "IMPORT", no: "CANCEL" }).then(function (ok) {
        if (!ok) return;
        items = inItems;
        cats = (Array.isArray(inCats) && inCats.length) ? inCats : DEFAULT_CATS.slice();
        persist(true); renderAll(); toast("Backup imported.");
      });
    } catch (err) { toast("Invalid backup file."); }
    e.target.value = "";
  };
  reader.readAsText(f);
});
function renderAll() {
  refreshFilters();
  renderSummary();
  renderOwned();
  renderWish();
  renderCats();
}
renderAll();
(async function initSharedCloud() {
  try {
    if (typeof requireAuth !== "function" || typeof loadDash !== "function" || typeof saveDash !== "function") {
      throw new Error("db.js did not load (check the ../db.js path)");
    }
    var session = await requireAuth();
    if (!session) return; // bounced to login
    var cloud = await loadDash(CLOUD_KEY);
    if (cloud && cloud.items) {
      adoptState(cloud);
      cacheLocal();
      renderAll();
    } else {
      await saveDash(CLOUD_KEY, snapshot());
    }
    lastSyncedPrint = fingerprint();
    cloudReady = true;
    setSync(true, "✓");
    setupRealtime();
  } catch (error) {
    console.error("Media shared cloud init failed:", error && error.message);
    setSync(false, "⚠ " + (error && error.message ? error.message : "cloud init failed"));
  }
})();
</script>
